  "如果给你两倍时间和两倍人力，你会换方案吗？"
 ],
 fa:["有，而且我认为有反对是好事。当时团队里的反对主要来自两个角度：一是工程同事担心「自建 vs 用现成方案」的运维负担，二是担心新技术的不确定性拖慢交付。我的说服不是靠讲道理而是靠两件事：一是用数据——我做了一个 PoC，在我们的评测集上把效果和成本都跑出来了，用数字说明它能帶來什么；二是把反对意见变成设计约束——他们担心的运维负担，我把它变成了「第一版不自建，先用托管服务验证需求，跑通之后再决定是否自建」的阶段性方案，反对就变成了支持。反过来我也被说服过一次：原本我倾向于一个技术上更优雅的方案，但同事指出我们的团队规模支撑不了它的复杂度，最后选了更简单的一个。这件事让我学到：技术方案的决定性因素常常不是技术优劣，而是团队能不能长期维护它。所以我现在做决策一定会明确地把团队能力和维护成本列进评估维度，并且会主动去找持不同意见的人提前碰，而不是在评审会上才第一次听到反对。","代价说出来才诚实。最直接的是「我们没有获得那个更好方案的上限」——比如选择了 RAG 而不是微调，我们就失去了某种程度的行为一致性；选择用托管服务，我们就失去了定制优化的空间和一部分成本优势。第二是迁移成本被推迟而不是消失——第一版为了快做了简化设计，后来要支持更复杂的场景时，花的时间比当初一开始就做对要多。第三是有些技术债是长期的：某些早期为了赶时间的耦合，直到我离开那个项目都还在，接手的同事要为它付持续的利息。但我也要说清楚另一面：这个决策在当时的约束下是对的——我们有三周的时间和两个人，更好的方案需要六周和双倍预算，而那时候产品还没验证有没有人用；在一个没验证的产品上做过度投入，风险远大于技术债。所以我的结论是：代价是真实存在的，但我承认它并且知道什么时候该偿还，而不是假装没有代价。","我的答案倾向于「不会换技术路线，但会用多出来的资源补上当时妥协掉的东西」。原因是：当时的核心约束不是时间和人力，而是「需求本身还没被验证」——资源加倍并不能让市场验证得更快，反而会让我们在一个错误方向上投入更多。所以技术路线的选择我认为是对的。但如果真有双倍的资源，我会做三件当时没做的事：一是把评测体系提前建起来（当时是事后补的，导致我们前两个月的优化基本是盲飞）；二是把可观测和 trace 做全（事后排查 bad case 花了大量不必要的时间）；三是预留抽象层（网关、检索抽象），让后续替换模型和数据库的成本低得多。这三件事的共同点是：它们都不改变当时的交付内容，但会显著降低后续演进的成本。所以更准确的说法是：我会把多出来的资源投在「降低未来的不确定性」上，而不是投在「让第一版更华丽」上。这也是我现在做新项目的默认策略——先建评测和可观测，再建功能。"],
 pass:"能讲清一个项目的背景、方案和自己在其中的角色。",
 good:"能讲出真实的两难与明确的 trade-off，有数据支撑的决策过程，考虑了团队/成本/合规等非技术因素，并主动说明放弃了什么以及事后的反思修正。",
 gl:"我讲一个我主导的企业知识库问答项目。最难的技术决策是：要不要为了效果引入 GraphRAG。当时我们的基线向量 RAG 在某些「全局归纳类」问题上表现很差，比如「总结这些合同里常见的风险条款」，团队倾向直接上 GraphRAG。我做的决策是「先不上，但先花两周把基线做扎实并量化」。具体过程是这样的：我们先花两周系统性做了三件事——按文档类型重做解析和切分、加混合检索和重排、以及建一个 150 条的评测集。结果 __ 评测集显示，原本的 bad case 里有六成是「正确材料没被召回」，其中大部分是切分和表格解析的问题，修完之后这一类问题效果提升了约二十个百分点，全局归纳类的占比其实只有不到 5%。基于这个数据，我把 GraphRAG 降级为一个「有明确触发条件才做」的后备方案，把资源投到了更有产出的地方。放弃的是：短期内的「技术先进性」，以及可能在评测上拿到更好看的全局问答分数。换来的是：更低的运维成本、更快的迭代速度、以及一个能被持续优化的系统——这两年的经验让我确信，大多数 RAG 项目的瓶颈在解析和切分这些脏活上，而不是在图这种高级结构上。重来一次我会做两件事：一是更早建评测集（当时到了中期才做，前期的优化基本靠感觉），二是更早引入灵活的模型切换网关抽象。这个决策的非技术因素我也考虑了：团队只有三个人，GraphRAG 的构建和维护复杂度是我们长期吃不消的，维护成本在这个决策里的权重其实比效果更高。",
 red:"只讲业务效果不讲技术决策；说不出任何代价；把决策全归因于他人；零反思。"},

{cat:"软技能",sub:"",diff:"进阶",type:"开放",tags:["需求沟通","期望管理"],
 q:"业务方要求「AI 准确率达到 99%」，你怎么沟通？",
 intent:"AI 项目最常见的期望管理难题。考察沟通与技术判断的结合。",
 ans:[
  "先不要答应也不要直接拒绝。99% 这个数字本身需要先被拆解——「准确率」在不同场景的定义完全不同。",
  "第一步：定义指标。和业务方一起明确「什么算对」。分类任务有明确答案（容易定义）；生成式任务（客服回答、摘要、写作）没有唯一正确答案，需要定义 rubric（事实正确、覆盖完整、语气合适、无幻觉）并约定判定方式（人工标注 / LLM 裁判 / 用户点踩）。",
  "第二步：摸清基线。在真实数据上测当前水平。关键是要用真实分布的样本，而不是挑几个好例子。基线往往远低于预期（比如 60%），这个数字是后续所有沟通的基础。",
  "第三步：把「准确率」翻译成可决策的选项。核心话术是给选择而不是给拒绝——「99% 在当前数据和成本下做不到，但我们有三个选项：A) 85% 准确率全自动，覆盖 100% 流量；B) 98% 准确率 + 15% 转人工，覆盖全部流量；C) 99% 准确率但只覆盖 30% 的简单场景，其余转人工。你选哪个？」",
  "关键技术手段：置信度分级 + 人工兜底。不追求每个都答对，而是让模型「知道自己不知道」，低置信度的转人工。这样整体准确率可以提到很高，代价是一部分转人工率。这是把「不可能的 99% 全自动」变成「可行的 99% + 部分人工」的通用解法。",
  "第四步：约束边界要讲清楚——「99% 是在这个评测集、这批数据、当前知识范围下的数字。业务扩展、知识更新、场景变化后需要重新评估。」避免把一次性数字变成永久承诺。",
  "第五步：建立持续度量的机制而不是一次性验收——上线后用真实反馈持续跟踪，定期同步。这样准确率变成一个共同改进的过程，而不是一次性的交付验收。",
  "红旗：直接答应 99%（做不到会失信）；或直接说「做不到」而不给替代方案；或拒绝沟通说「这个需求不合理」。"
 ],
 follow:[
  "业务方坚持 99% 且不允许转人工，你怎么办？",
  "你怎么定义「答对了」？谁来判定？",
  "上线后准确率从 85% 掉到 70%，你怎么向业务方解释和处理？"
 ],
 fa:["我会先确认这是「目标」还是「约束」，然后把它翻译成可选的技术方案。我的沟通路径是：明确告诉他们 99% 在当前技术条件下意味着什么——不是做不到，而是要靠极高的保守度换来的，具体做法是把置信度阈值提到极高，结果是大量请求被拒答（覆盖率可能掉到 20%），或者需要人工全量复核（那就失去了自动化的意义）。所以我给的是「二维光谱」而不是「行或不行」：横轴是准确率，纵轴是覆盖范围（或者转人工率），让业务方在光谱上选点，而不是对着一个单点目标僵持。具体来说我会给三个选项：一是保守版——准确率 95% 但只覆盖 40% 的请求，其余转人工；二是均衡版——准确率 85%、覆盖 70%；三是激进版——全覆盖但准确率 70%，并且错误可追溯。这样业务方就从「要不要 99%」变成了「愿意用多少覆盖率换多少准确率」——这是一个他们可以基于自己业务目标做的决策。如果他们仍然坚持，我会要求一个验证：用我们的评测集跑一遍，看看 99% 阈值下的实际覆盖率是多少，让数据说话比我说服有效得多。最后我还会争取一个灰度试点而不是全量承诺。","这是我一定会先做的第一步，因为「准确率」三个字在不同人脑子里含义完全不同。我的定义过程有三层：一是明确判定标准——什么叫答对？是包含正确答案、还是完全精确无多余信息？参考文献是否正确？对于开放式问答不存在唯一的「正确答案」，所以我会用可判定的子项来定义：事实正确性、是否有依据、是否回答了用户的问题、是否缺关键信息。二是明确判定人——谁来判定？业务专家最快今天就能给出判断但不可规模化；LLM 裁判可规模化但需要先和人工做一致性校准（这点很重要，通常用 Kappa 系数或吻合率衡量）；最终用户的行为（是否采纳、是否追问）是最真实的信号但滞后。所以我会三者结合并用人工校准裁判。三是划清PR难题——边界case必须明确，比如「答案正确但格式难看」算不算对。这个过程本身很有价值，因为很多时候争论准确率数字的分歧其实是定义不一致，一旦定义清楚，目标往往会自然调整到一个合理的值。最后我会把这些定义落成一份文档化的 rubric 和一个可复用的评测集。","处理这类骤降我的语序是「先止血、再归因、后沟通」。第一步立刻确认是不是系统性问题：先看技术指标（错误率、延迟）排除硬故障，再看是不是某次变更引入（模型版本、提示词版本、知识库版本）——这个版本的下钻能力就是我前面强调的那套可观测，此刻它的价值就体现了；如果是知识库刚做了一次大批量导入，很可能就是数据污染。第二步归因：把退化的 case 聚类，看集中在哪一类——通常是「流量分布变了」（进来了很多我们没优化过的长尾问题）或者「数据源变了」。第三步沟通：我不会用「准确率下降」这种抽象语言，而是用业务方能感知的语言——「这意味着每天大约 X 条回答可能有问题，其中 Y 类需要人工复核」；同时给出明确的三件事：根因是什么、什么时候能修好、在修好之前怎么补救（通常是加一道置信度过滤，把低置信度的请求转人工，用覆盖率换回准确率）。第四步是建立长期防线：把这个能力做进回归集，并且以后每次知识库或模型变更都要跑回归。我要强调态度上不要回避——主动通报比被业务方发现要好得多。"],
 pass:"知道要先定义指标、测基线。",
 good:"能给出「定义指标 → 摸清基线 → 给选项而非拒绝 → 置信度分级+人工兜底 → 明确边界 → 持续度量」的完整沟通路径，并把准确率问题转化为转人工率与覆盖率的业务权衡。",
 gl:"我的沟通路径是一个完整的六步，而不是直接说「做不到」。第一步「定义指标」——先对齐什么叫「答对」，因为开放式问答没有唯一正确答案；我会把它拆成可判定的子项：事实正确、有依据、回答了用户的问题、以及没有多余的误导信息；同时明确判定人是谁——人工专家的口径、LLM 裁判的口径、以及用户行为信号三者要对齐，其中裁判必须先用人工标注做一致性校准。第二步「摸清基线」——用评测集跑出当前真实水平，很多时候业务方以为的 95% 实际只有 70%，把真实数据摆出来比任何说理都有效。第三步「给选项而非拒绝」——这是沟通的核心：我不说「做不到 99%」，而是画一条「准确率对覆盖率」的权衡曲线，给出三个方案：保守版（准确率 95% 但只覆盖 40%，其余转人工）、均衡版（85%/70%）、激进版（全覆盖但 70%）。这样把对话从「能不能」变成「愿意用多少覆盖率换多少准确率」，让业务方基于自己的业务目标做选择——通常他们会发现均衡版才是真正想要的。第四步「置信度分级加人工兜底」——这是把准确率做上去的工程手段：用置信度（可以来自模型自评、裁判打分、或者检索相似度）把请求分流，高置信直接答、低置信转人工或者走更保守的分支（比如只引原文不给结论），这是绝大多数生产系统的真实做法。第五步「明确边界」——清楚地列出系统做不到的事情并写进产品文档，让所有人知道哪些问题不要指望它。第六步「持续度量」——上线后每周出一份质量报告，包含准确率、覆盖率、转人工率三个数字，让这件事变成一个被持续管理的指标而不是一次性的争论。归根结底，AI 准确率不是单点目标，而是「准确率、覆盖率、成本」三者的生意权衡。",
 red:"直接答应或强硬拒绝；不定义指标就开始做；承诺一个没有边界的数字。"},

{cat:"软技能",sub:"",diff:"进阶",type:"开放",tags:["需求判断","场景选择"],
 q:"你怎么判断一个需求该不该上 AI？举一个你判断「不该用 AI」的例子。",
 intent:"反向判断力比正向更能体现水平。考察是否会为了用 AI 而用 AI。",
 ans:[
  "先给判断框架（四个问题）：① 有没有确定性的规则解法？如果有且规则能枚举 → 用规则，不要用 AI（更快、更准、更便宜、可解释、可测试）。② 是否需要 100% 准确且出错代价极高？如金额计算、库存扣减、法律条款生成 → 不该让生成式模型做最终决策，最多做辅助。③ 输入是否模糊、多样、需要理解语义？是 → AI 有价值。④ 是否容忍不确定性？如果用户完全无法接受错误 → 需要人工兜底或改用确定性方案。",
  "不该用 AI 的典型场景（能举出具体例子是加分项）：① 精确计算——用 AI 算工资、算税费、做统计聚合（应该用代码/SQL）；② 重复性结构化任务——固定格式的字段提取，用正则/模板就能解决；③ 高频简单的规则判断——如「订单金额大于 100 且是新用户」，一条 if 就够了，用 LLM 是浪费且更慢更贵；④ 有严格 SLA 和可解释要求的场景——如风控拒绝贷款，必须给出明确规则依据，LLM 的黑盒不可接受；⑤ 数据量极小且模式固定的场景——几百条固定模板的映射，写规则更快。",
  "该用 AI 的信号：输入是自然语言且表达多样、需要理解语义或意图、需要生成开放内容、规则无法穷举、人工处理成本高且量大、允许一定误差或有人工复核环节。",
  "成本视角：算一笔账——人工处理一次的成本 × 量 vs AI 的单位成本 × 量 + 错误导致的返工成本 + 人工复核成本。很多场景算完会发现 AI 并不划算（尤其是低频、高准确率要求的场景）。",
  "折中方案（常常是最优解）：AI 做前置处理/辅助，人来最终确认（copilot 模式）；或 AI 处理高置信度部分，不确定性高的走规则或人工。",
  "红旗：认为所有需求都能上 AI；举不出任何一个「不该用 AI」的例子；或判断只看技术可行性不看成本与风险。"
 ],
 follow:[
  "你拒绝过业务方的 AI 需求吗？怎么说服的？",
  "一个需求用规则能做到 90%，用 AI 能做到 95%，你选哪个？",
  "AI 做辅助、人做决策（copilot）和 AI 全自动，你怎么选？"
 ],
 fa:["拒绝过几次，我用的说服方式是「把 AI 的方案和替代方案放在同一张成本表上对比」，而不是讲 AI 的哲学。举个具体的例子：业务方要求做一个智能表单核验，希望 AI 自动判断用户上传的材料是否齐全。我给出的对比是：这套规则其实非常明确（哪几项必填、什么格式有效），用规则加正则能达到 98% 的准确率、延迟几乎为零、成本可以忽略、而且出错能被明确归因；而用 AI 的方案准确率大概 92%、单次调用要钱、有几百毫秒延迟、偶尔会莫名拒掉合规材料，并且用户投诉时你无法解释为什么。当业务方看到「更贵、更慢、更不准、还不可解释」这四条之后，通常自己就会改口。另一个有效手段是「给一个更优的 AI 用法」——说服不等于否定，我会说「核验用规则，但用户被拒之后不知道怎么改，那里可以用 AI 生成具体的修改指引」——这也是 AI 更擅长的地方。最后我会留一个口子：先上线规则方案，如果用数据发现确实有长尾问题规则搞不定，我们再针对那部分加 AI。这种「条件性承诺」比直接拒绝更容易被接受。","大多数情况下我会选规则做到 90% 的那个。判断依据不是那 5 个百分点本身，而是四个附带属性：一是「确定性」——规则错了你可以复现、可以定位、可以修复；AI 错了你可能连为什么会错都不知道，而且同样的问题下次结果可能不同。二是「成本」——规则几乎零边际成本且延迟极低，AI 每次调用都要钱和时间。三是「可解释性」——在金融、医疗、合规场景，你必须能给 regulator 或者用户一个解释，这一点规则完胜。四是「剩下那 5% 的价值」——如果这 5% 是极低频的长尾，那用 AI 去覆盖它的性价比很低。什么时候我会选 AI？当这 5% 的差距带来巨大的业务价值（比如每条错误都要人工处理且成本很高），或者当规则难以穷举（维护规则的人力已经超过了容忍 AI 不确定性的人力）。我更推荐的其实是混合方案——用规则覆盖 90% 的高频确定情形，把剩下的疑难表示给 AI，因为那部分恰恰是规则搞不定的；然后用 AI 处理的结果反过来补充规则。这种「规则打底、AI 补漏」的组合在我们实际项目中收益最好。","我的默认选择是 copilot 模式，也就是 AI 做辅助、人做决策，除非同时满足几个条件才会走向全自动。判断时要看三个因素：第一是「错误的代价」——如果 AI 判错了，后果是否可逆？能不能被发现？发送一封客户邮件、生成一份内部草稿、推荐一段代码，这些都是低代价的，错了很容易被人发现并纠正；而涉及资金划转、法律承诺、医疗建议、对外发布，一旦出错代价难以挽回，必须保留人的决策权。第二是「人的监督成本」——如果让人复核每一条所花的时间几乎等于他自己做，那自动化的收益就被抵消了；所以好的 copilot 设计要让人复核的成本远低于自己从头做（比如给出可一键采纳的草稿、给出明确的 diff、给出风险标注）。第三是「验证的可能」——能否自动化地验证 AI 的输出（比如生成的代码可以跑测试、生成的 SQL 可以 EXPLAIN、抽取的结构可以做勾稽校验），可以验证的场景更容易自动化。所以我的路径通常是：先做 copilot 并用数据积累 confidence，当低置信的比例足够小并且我们在某类问题上持续表现稳定时，再逐步把那一类放开为全自动——按场景分级自治而不是一刀切。"],
 pass:"能说出几个不适合 AI 的场景，知道规则优先。",
 good:"能给出四问判断框架 + 五类不该用的典型场景（带具体例子）+ 该用的信号 + 成本账的算法，并提出「AI 辅助 + 人决策」的折中方案和置信度分流。",
 gl:"我的判断框架是四问。第一问「是否规则可解」——如果能用明确规则解决且规则可维护，就不要用 AI；很多需求本质上就是一堆 if-else，用 AI 是又贵又不可控。第二问「是否需要理解自然语言」——AI 的核心优势是处理非结构化输入和语义理解，如果这个任务的核心是格式转换、数值计算、确定性查询，AI 是错的工具。第三问「错误是否可容忍」——能否接受 5% 到 10% 的错误率？错误是否可逆、是否被用户即时发现？像「给用户推荐一些可能感兴趣的内容」可以容忍，而「决定这笔交易是否放行」很难容忍。第四问「成本账是否算得过来」——这个我要具体算：AI 的单次调用成本乘以日请求量，加上延迟，加上评测和维护的人力，与人工处理的成本相比，看几年能回本；我见过太多项目单个调用几分钱看着不贵，乘以每天几十万次之后账单很惊人，而它替代的人工其实只需要不到一个人。然后是五个我认为不该用 AI 的典型场景：确定性的规则校验（表单、资质审核）、纯数据聚合查询（直接写 SQL）、高精度数值计算、已经有成熟且便宜的传统方案（OCR、正则抽取）、以及完全没有评测手段无法验证效果的场景。反过来该用的信号是：输入高度非结构化、需求覆盖长尾且难以穷举规则、允许有一定的不完美、以及人力成本确实很高。最后是那个重要的折中方案——AI 辅助加人决策的 copilot 模式：它把 AI 的不确定性交给人来兜底，同时保留了大部分效率收益；配合置信度分流，高分自动通过、低分转人工，这其实是绝大多数生产 AI 系统真正的形态。我记得举个具体例子：曾经有人提议用 AI 自动审核合同条款合规性，我判断不该全自动——因为误判代价高且难以解释，最终做成「AI 标出可疑条款和依据，律师复核」，合规率达到要求的同时把人工时间压缩了一半。",
 red:"认为 AI 什么都能做；举不出不该用的例子；判断只看技术可行性不看成本与风险。"},

{cat:"软技能",sub:"",diff:"进阶",type:"开放",tags:["技术推动","协作"],
 q:"不确定性强的技术方案（比如引入 Agent），你怎么推动落地？",
 intent:"考察影响力与推进能力。5 年经验不能只会被动接需求。",
 ans:[
  "先降低不确定性再谈推动。AI 方案之所以难推动，是因为「效果说不准」。所以第一步永远是用最小成本把不确定性量化——做一个 PoC，在真实数据上跑出数字。有了数字，讨论就从「你觉得行不行」变成「85% 通过率，够不够」。",
  "小步验证：不要一上来提一个宏大的方案。切成阶段——第一阶段只做一个场景、只服务一小部分用户、只读不写。用最小的风险拿到真实的反馈和数据。",
  "用数据说话的推进方式：准备一份包含「现状痛点（量化）→ 方案 → 预期收益（量化）→ 成本 → 风险与兜底 → 验证计划」的一页纸。决策者需要的是可判断的信息，不是技术热情。",
  "争取盟友：先说服一个业务方（找一个痛点最强烈、愿意配合的），做出成果后用它说话，比自上而下推更容易。同时提前找架构/安全/法务对齐（AI 项目常卡在合规和安全评审），不要等到最后才被发现拦下。",
  "管理预期与风险：主动说明「可能做不成」，并约定验收标准和止损点（如「两周内 PoC 达不到 70% 就放弃这个方向」）。主动设置失败条件反而更容易获得支持，因为它降低了对方的决策风险。",
  "应对阻力：理解阻力的来源——通常不是「新技术不好」，而是「运维负担」「出问题谁负责」「影响现有排期」。针对具体顾虑给方案（谁 oncall、怎么回滚、灰度多久），比强调技术先进性有效得多。",
  "落地后的收尾：量化收益并主动同步（上线后节省了多少人力/提升了多少指标），让当初支持你的人有交代，也为下一次推动积累信用。",
  "红旗：靠「这是趋势/竞品都在做」来推动；没有 PoC 就要大资源；回避风险和失败可能性；上线后不追踪收益。"
 ],
 follow:[
  "团队里有人强烈反对，你怎么处理？",
  "PoC 效果不及预期，你是放弃还是继续要资源？",
  "上线后你怎么证明这件事做对了？"
 ],
 fa:["我的第一反应不是说服而是理解——因为强烈反对背后通常有我没看到的经验或者合理的顾虑。具体做法有三步：一是先私下单独聊，请他把顾虑讲透，而不是在会议上对峙；二是把顾虑翻译成具体的、可验证的风险点（比如「Agent 的不可控会导致线上事故」就是一个可以针对的风险），然后逐个给技术方案——调试难度大就先做可观测、不可控就只在只读场景先用、成本高就设 token 预算和熔断。三是给反对者一个位置——邀请他参与 PoC 的设计并让他明确说出「什么样的数据能让我同意」，这比我和他辩论有效得多，也让他成为决策的一部分而不是对立面。我的经验是：大多数强烈反对其实不是反对技术本身，而是反对「没有约束地被引入」。所以当我主动设了止损点和边界后，反对通常会变成「有条件支持」。如果聊完仍有分激并且他有相当的资历，我会把决策升级——要么拉上更资深的人一起评估，要么缩小试验范围降低单次赌注。我不会用职级压人，因为我见过压出来的结局往往是对方消极执行，事后出了问题更难收拾。","我的决策依据是「学到了什么」而不是「效果好不好」。具体看三点：第一，这次 PoC 有没有证伪关键假设——比如我们想验证「Agent 能否把这类任务的任务完成率从 X 提到 Y」，即便没达标，如果我们明确了它在哪些子任务上强、哪些上弱，那也是有价值的负向知识。第二，差距有多大——如果差一点点，可能只是调参和工具设计的问题，值得再给一轮；如果差得很远（比如完成率只有预期的三分之一），那多半是路线问题，继续投入是沉没成本。第三，有没有出现「意外收获」——很多时候 PoC 会发现新的价值点，它可能比原目标更有价值但需要换个方向。我的行动框架是提前设止损点：在 PoC 开始前就和大家约定「达到 X 继续投入、达到 Y 缩小范围、低于 Z 就停止」，这样到了决策点时不需要临场博弈，也避免了「再给一次机会」的无底洞。诚实地讲，我确实放弃过 PoC——那次我们验证了 Agent 在当时的模型能力下无法稳定完成多步写操作，转而把同样的技术用在只读的分析场景，后来反而做得不错。所以我的结论是：坦然地承认假想不成立并换一个更小的切口，比硬撑着要资源更专业。","我会事先就把衡量标准定义好并且在 PoC 之前就对齐，这是关键——事后找指标就变成了自我辩护。标准我通常分三层：业务结果指标（任务完成率、人工处理时长下降多少、用户采纳率）、质量与稳定性指标（幻觉率、错误分解到子任务的成功率、P95 延迟）、以及成本指标（单次任务的平均 token 消耗和费用），三者缺一不可，因为很多 Agent 项目效果是上去了但成本不可控。另外我会强调「和基线的对比」——不是看绝对值，而是看相对旧方案（人工或者单轮 RAG）提升了多少、是否达到 PoC 前设定的目标阈值。验证方式上我要保证是「线上真实流量加对照」而不是演示 case——会做一个小流量的灰度并且设置对照期。最后我会做一个「可持续性」的证明：上线三个月后这套东西的维护成本如何、bad case 是否在收敛、团队能否独立迭代——如果只有我一个人能维护它，那说明落地是失败的。我还会把整个过程写成一份决策复盘，包含当初的假设哪些被验证了、哪些错了，这对团队的价值往往大于项目本身。"],
 pass:"知道要做 PoC 验证、小步试。",
 good:"能给出「PoC 量化不确定性 → 小步只读场景 → 一页纸决策材料 → 找盟友+提前对齐安全法务 → 主动设止损点 → 针对具体顾虑给方案 → 上线后量化收益」的完整推进路径。",
 gl:"我的推进路径是「用 PoC 把不确定性量化，而不是用嘴争」。第一步，明确定义这个方案要验证的核心假设是什么、成功阈值是多少——比如「Agent 方案能把这类任务的任务完成率从当前的 45% 提到 70%，同时单次成本控制在 X 以内」；这个阈值必须事先定量并且和相关方对齐，否则事后无法判断。第二步，做最小 PoC 但必须可度量：用真实数据的一个子集、搭建最小可用链路、并且要有可观测——每一步的耗时、token、成功率都要能看； PoC 的价值不在于跑通而在于产出数据。第三步，带着数据做一页纸的决策材料：背景、方案对比、数据结论、风险与止损点、需要的资源、以及「什么情况下我会建议停止」——这一条我认为很重要，主动设止损点反而更容易获得支持，因为它把风险变得可控。第四步，推进前先找盟友并提前对齐安全、法务和运维——很多技术方案不是死在技术而是死在上线的合规审查上，提前把他们的顾虑变成设计约束，他们就会从 blocker 变成支持者。第五步，针对具体的顾虑给具体的方案而不是抽象的担保：怕不可控就先上只读场景（推荐/分析而非写操作），怕成本高就设 token 预算和自动熔断，怕出事故就加人工确认和审计日志。第六步，选一个小但真实的上线场景做出结果——不要一上来啃最难的，先在一个边界清晰、容错度高、有明确业务负责人愿意配合的场景拿到胜利。最后是上线后的量化证明：对照组的业务指标对比、稳定性的长期数据、以及成本曲线，并且把这些写进复盘。整个过程的本质是：把「信不信」变成「数据怎么说」。",
 red:"靠「技术趋势」说服；没有验证就要大资源；不设止损点；上线后不追踪收益。"},

{cat:"软技能",sub:"",diff:"基础",type:"开放",tags:["技术跟进","学习方法"],
 q:"你如何跟进 AI 领域的快速变化？最近在关注什么？",
 intent:"考察学习习惯与技术敏感度。AI 领域半年不学就落后。",
 ans:[
  "听什么：是否有稳定的信息渠道（而不是刷到什么看什么）、是否能区分「值得跟的」和「噪音」、以及是否有把新东西落到实践的习惯。",
  "好的信息源结构：① 一手信息——论文（arXiv，关注 cs.CL/cs.AI）、厂商官方发布与文档（OpenAI/Anthropic/Google/DeepSeek/Qwen 的 blog 和 model card）、开源项目 release note；② 二手信息——高质量的 Newsletter（如 Import AI、The Batch）、技术社区（Hugging Face、Reddit r/LocalLLaMA、中文社区）、会议（NeurIPS/ICML/ACL 的 workshop）；③ 实践——自己动手跑，这是最可靠的学习方式。",
  "过滤噪音的方法（重要）：AI 领域每天都有大量「新突破」，但大部分活不过三个月。判断标准：① 有没有可复现的结果（有 benchmark、有开源代码）；② 是不是解决了一个真实的痛点；③ 在你的场景下是否适用。很多热点在特定场景根本用不上。",
  "深度与广度的平衡：基础原理（Transformer、注意力、RLHF、推理优化）是长期不变的，值得深挖；具体工具和框架变化快，知道「有哪些、各自解决什么问题」即可，用到时再深入。不要把时间都花在追新框架上。",
  "落地习惯：看到有价值的东西要动手验证——在自己的评测集上跑一遍，而不是只看别人的结论。建立自己的「技术雷达」（哪些在评估中、哪些已采用、哪些该淘汰）。",
  "红旗：① 说不出任何具体的信息源；② 只关注模型排行榜（「又出新模型了」）；③ 最近关注的东西和岗位完全无关；④ 只关注工具框架，对原理一无所知；⑤ 说「没时间学」（AI 领域这个说法基本等于放弃成长）。"
 ],
 follow:[
  "最近有哪个新技术你是判断「不值得跟」的？为什么？",
  "你看到一个新模型，怎么快速判断要不要在你的场景里试？",
  "你最近把学到的什么东西真正用到生产里了？"

 fa:["我说一个具体的：某些「全自动 Agent 帮你完成一切」的框架我判断不值得跟。理由不是技术不好，而是在我当前的业务场景下性价比不成立：这类框架的效果高度依赖模型的基础能力，而模型能力本身在快速迭代，意味着你基于今天的框架做的大量适配可能在半年后被模型原生能力覆盖；同时它带来的调试复杂度和成本不确定性，在我这个阶段比它解决的那部分问题更大。我的过滤标准是三问：它解决的是不是我的真实痛点（还是别人赚钱出来的需求）、验证它需要多少成本（能不能用一天的小实验证伪）、以及它的保质期有多长（会不会被下一次模型升级吸收掉）。我同时也承认自己判断错过——曾经低估了结构化输出约束解码的价值，觉得只是小优化，后来发现它对生产可用性的影响是根本性的。所以我的态度是：不跟但可以保持低成本的关注——订阅它的更新、在评测集里留一块地方，一旦它的能力跨越某个阈值或者我的痛点变了，能立刻重新评估。这个「低成本保持更新」我觉得比「要么全情投入要么完全不看」更务实。","我有一套固定的三步，大概一天内能出结论。第一步是「看它声称的能力在我的评测集上的表现」——这是最重要的一步，也是最容易被跳过的一步。我不会看公开的 benchmark，而是直接用我们自己的评测集（几十到一两百条真实 case）跑一遍，因为公开榜单的分布和我们的业务差异太大；这一步如果显著超过当前在用的模型，才值得继续。第二步是「看工程属性而不只看效果」——上下文长度、输出速度、结构化输出的稳定性、是否有靠谱的托管、单价、以及许可协议；很多模型分数很高但输出慢一倍或者缺乏稳定的 API，那在生产上就是不可用的。第三步是「算总账」——把效果提升折算成业务价值，和成本增加做对比；同时评估替换的隐性成本（如果提示词要重写一遍，那笔人力也要算进去）。我还会做一个约束检查：数据安全（能否私有部署或者对方条款是否允许）、以及供应商稳定性。最后是灰度：即便前面都通过，我也会先在小流量上线并保持快速切回的能力。我的习惯是「看得到的都先记账，不是每个都试」——我会维护一个候选清单，只有真正解决当前痛点的才进入实际评测。","我说一个最近真正落地的：把「评测前置」变成了团队的开发流程。以前我们的流程是「改提示词→上线→看用户反馈」，现在改成了「改提示词→先在我们的评测集上跑→对比变异例→再灰度」。这个变化看起来是流程调整，背后的认知转变是：把 LLM 的输出当成不可预测的实验对象来管理，而不是当成确定性的代码。具体做法包括三件事：一是建了一份 150 条左右、来自真实日志的评测集，并且按意图类型分层；二是写了自动化的跑分脚本，任何关于提示词或模型的改动都能在几分钟内得到对比结果；三是把这个流程接进了 CI，设置了「变异例占比」的阈值。落地之后最明显的收益是：我们不再发生「改了一处把另一处搞坏」的事故，而且每次改动到底是好是坏有了客观依据，团队内部争论也少了——以前争论常沦为「我觉得这样更好」。另一个我学到的东西也用上了：把-temperature 设为 0 和固定模型版本来保证评测的可复现性，这个是知道容易做到难，因为我们生产环境其实一直没 pin 版本。这个是真正改变我工作方式的一条：在评测可复现之前，讨论效果没有意义。最后一个我正在推动的是：把线上的 bad case 定期回流进评测集，形成闭环。"],

 gl:"我的信息源分三层，各有用途。第一层是一手的原始来源——重要模型的论文和技术报告、厂商的文档和 release notes、以及少量核心仓库的源码和 issue；这层密度最低但可信度最高，我固定每周扫一遍重点对象。第二层是二手的筛选与解读——我关注少数几个质量高的 newsletter 和技术博客，以及社区里的实践复盘；这层的作用是告诉我「本周发生了什么值得看」，我特别注意避开那种「震惊体」式的资讯聚合，因为它们常常把一篇论文的初步结论说成革命。第三层也是最容易被忽略的——实践验证：任何我觉得有价值的东西都必须落到自己的评测集上验证一遍，这是过滤噪音的唯一有效手段，因为大部分「突破」在我们自己的场景里带来的提升往往远小于宣称。我的噪音过滤标准有三条：它解决的是不是我的真实痛点、验证它需要多少成本、以及它的保质期有多长。深度和广度的平衡上，我的策略是「T 型」——对一到两个与当前工作强相关的方向做深度跟进（比如我现在关注的就是推理优化和 Agent 的可观测），其余方向只保持「知道有这回事、需要时能快速捡起来」的广度。具体到最近在关注的技术点，我会说几个并带上自己的判断：一是推理侧的成本优化（prefix caching、推测解码这些已经实实在在影响成本管理的重要)；二是 Agent 的可观测与评测标准体系的演进；三是对小模型能力的重新评估——现在很多以前必须用大模型做的任务，用便宜的小模型加上好的流程也能达到可接受的效果，这直接影响很多产品的成本结构。最后我强调自己的习惯：看到新东西先在评测集上跑一遍再决定是否投入，这一个习惯帮我过滤掉了绝大部分噪音。",

 fa:["如果只能招一个人，我会招一个「能把 AI 应用端到端做出来」的全栈工程师。理由很直接：AI 应用早期最大的风险不是某个技术点做不深，而是「能不能在两周内做出一个能用、可评测、可迭代的东西来验证需求」。所以这个人要能写后端接口、能做前端 demo、能搭 RAG 链路、能写评测脚本——不需要每一项都顶尖，但必须能对端到端的链路负责。我特别看重的三个能力：一是「工程的严谨」——知道模型输出不可靠所以要校验、要兜底、要埋点；二是「评测的意识」——改动之后知道用数据说话而不是靠感觉；三是「产品同理心」——理解用户到底要什么。为什么不是先招算法专家？因为绝大多数 AI 应用团队做的事情是「组合现有技术解决业务问题」，而不是训练模型；招一个深度学习背景但不做应用交付的人，早期产出会很有限。第二个我会招的是「知识工程/数据方向」的人，因为 RAG 的效果七成取决于文档处理和的数据质量。早期我不建议招的角色：专做模型训练的人、专职提示词工程师（后面会解释）、以及过早引入的运维专家。","我的答案可能会让人意外：给工程师为主，但需要产品经理深度参与并提供标准。原因是提示词在这个阶段本质上是「业务逻辑的一种表达方式」，它和模型的能力边界、上下文预算、工具定义、数据格式强耦合——这些都要求写它的人理解系统在怎么跑。交给不懂工程的产品同学单独写，常见结果是提示词越写越长、加了大量冗余指令、并且改完之后没人知道为什么会变好或变坏。但产品角色不可替代的地方在于：产品的同学最清楚「什么算好答案」，所以正确的协作模式是「产品定义标准（包括给出好的回答示例、定义什么情况必须拒答、以及验收 rubric），工程师把标准实现成提示词并做版本管理、评测和上线」。我还会加一个制度：提示词进代码仓库、走 code review、和评测集绑定。另外我认为有一个专业领域知识很深的同事（不一定是工程师）应该被拉进来做样例设计，因为很多行业的「好答案」标准外行人写不出来——所以对知识的所有权在业务侧，对实现的 ownership 在工程侧。","我的答案是：早期不设专职，但必须有人明确兼负这个责任；当团队超过一定规模或者评测成为瓶颈时立刻设专职。具体的转折点我认为有两个信号：一是，当有多个产品线在同时迭代，评测集的维护和 dispute（比如「这个 case 到底算不算对」）开始占用大量时间时；二是当我们的质量指标开始出现瓶颈、而工程师们忙于功能迭代没精力系统性地做归因时。这个角色的重要性被严重低估——在 AI 应用里，评测体系是整个团队的方向盘，没有它所有的优化都是盲飞；而它又确实需要专职：要维护评测集的代表性、要校准 LLM 裁判和人工的一致性、要做 root cause 归因分析、要把线上 bad case 回流、还要防止团队对着评测集刷分。这个角色需要的能力比较特殊：既懂技术可以读懂 trace，又要有产品判断力能定义「什么算好」，还要有统计素养防止被假指标误导。所以在只有三五个人时，我倾向于由我或者最资深的工程师兼任并把它做成团队流程；到八到十个人的时候，我认为这个专职角色的投资收益是最高的，甚至高于再招一个开发。"],

const CATCLS={"LLM应用工程":"cat-llm","前端":"cat-fe","后端与数据":"cat-be","架构与运维":"cat-infra","软技能":"cat-soft"};
const F={cat:"",diff:"",type:"",sub:""};
let kw="", onlyUndone=false;
const done=new Set(JSON.parse(localStorage.getItem("aiq_done")||"[]"));

const list=document.getElementById("list");
const empty=document.getElementById("empty");
const sCount=document.getElementById("sCount");
const sHint=document.getElementById("sHint");

var AMP=String.fromCharCode(38);
function esc(s){return String(s).replace(/&/g,AMP+"amp;").replace(/</g,AMP+"lt;").replace(/>/g,AMP+"gt;");}

function match(it){
  if(F.cat && it.cat!==F.cat) return false;
  if(F.diff && it.diff!==F.diff) return false;
  if(F.type && it.type!==F.type) return false;
  if(F.sub && it.sub!==F.sub) return false;
  if(onlyUndone && done.has(it.q)) return false;
  if(kw){
    const k=kw.toLowerCase();
    const hay=(it.q+" "+it.cat+" "+it.sub+" "+it.diff+" "+it.type+" "+it.tags.join(" ")+" "+it.ans.join(" ")
      +" "+(it.fa?it.fa.join(" "):"")+" "+(it.gl||"")).toLowerCase();
    if(hay.indexOf(k)<0) return false;
  }
  return true;
}

function render(){
  const items=DATA.filter(match);
  sCount.textContent=items.length;
  let hint="";
  const parts=[];
  if(F.cat) parts.push(F.cat); if(F.sub) parts.push(F.sub);
  if(F.diff) parts.push(F.diff); if(F.type) parts.push(F.type+"题");
  if(kw) parts.push("关键词「"+kw+"」");
  if(onlyUndone) parts.push("未问过");
  sHint.textContent=parts.length?(" · "+parts.join(" / ")):"";
  empty.style.display=items.length?"none":"block";
  list.innerHTML=items.map(it=>{
    const i=DATA.indexOf(it);
    const isDone=done.has(it.q);
    const tags=it.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join("");
    return '<div class="card'+(isDone?" done":"")+'" data-i="'+i+'">'
      +'<div class="qhead"><div class="num">'+(i+1)+'</div><div class="qmain">'
      +'<div class="qtext">'+esc(it.q)+'</div>'
      +'<div class="qmeta"><span class="tag cat '+CATCLS[it.cat]+'">'+esc(it.cat)+'</span>'
      +(it.sub?'<span class="tag">'+esc(it.sub)+'</span>':"")
      +'<span class="tag diff-'+it.diff+'">'+it.diff+'</span>'
      +'<span class="tag">'+it.type+'题</span>'+tags+'</div></div>'
      +'<div class="arrow">▶</div></div>'
      +'<div class="qbody">'
        +'<div class="sec intent"><h4>考察意图</h4><p>'+esc(it.intent)+'</p></div>'
        +'<div class="sec ans"><h4>参考答案要点</h4><ul>'+it.ans.map(a=>"<li>"+esc(a)+"</li>").join("")+'</ul></div>'
        +'<div class="sec follow"><h4>追问链 × 参考回答</h4>'
          +it.follow.map((f,i)=>'<div class="fitem"><div class="fq">'+esc(f)+'</div>'
            +((it.fa&&it.fa[i])?'<div class="fa">'+esc(it.fa[i])+'</div>':'')+'</div>').join("")
        +'</div>'
        +'<div class="sec rubric"><h4>评分要点</h4><div class="rgrid">'
          +'<div class="rbox pass"><div class="rt">及格线（3 年水平）</div><div class="rd">'+esc(it.pass)+'</div></div>'
          +'<div class="rbox good"><div class="rt">期望线（5 年应达到）</div><div class="rd">'+esc(it.good)+'</div></div>'
          +'<div class="rbox red"><div class="rt">红旗信号（扣分）</div><div class="rd">'+esc(it.red)+'</div></div>'
          +(it.gl?'<div class="rbox gl"><div class="rt">期望线 · 示范作答（面试口吻，可直接陈述）</div><div class="rd">'+esc(it.gl)+'</div></div>':'')
        +'</div></div>'
        +'<div class="actions"><button class="btn act-done">'+(isDone?"标记为未问":"标记为已问")+'</button></div>'
      +'</div></div>';
  }).join("");
}

list.addEventListener("click",e=>{
  const head=e.target.closest(".qhead");
  if(head){ head.parentElement.classList.toggle("open"); return; }
  const btn=e.target.closest(".act-done");
  if(btn){
    const card=btn.closest(".card");
    const it=DATA[+card.dataset.i];
    if(done.has(it.q)) done.delete(it.q); else done.add(it.q);
    localStorage.setItem("aiq_done",JSON.stringify([...done]));
    render();
  }
});

document.querySelectorAll(".chip").forEach(ch=>{
  ch.addEventListener("click",()=>{
    const f=ch.dataset.f;
    document.querySelectorAll('.chip[data-f="'+f+'"]').forEach(c=>c.classList.remove("on"));
    ch.classList.add("on");
    F[f]=ch.dataset.v;
    render();
  });
});

document.getElementById("q").addEventListener("input",e=>{ kw=e.target.value.trim(); render(); });

let allOpen=false;
document.getElementById("btnExpand").addEventListener("click",function(){
  allOpen=!allOpen;
  document.querySelectorAll(".card").forEach(c=>c.classList.toggle("open",allOpen));
  this.textContent=allOpen?"全部收起":"全部展开";
  this.classList.toggle("on",allOpen);
});

document.getElementById("btnDone").addEventListener("click",function(){
  onlyUndone=!onlyUndone; render(); this.classList.toggle("on",onlyUndone);
});

document.getElementById("btnReset").addEventListener("click",function(){
  done.clear(); localStorage.removeItem("aiq_done"); render();
});

/* ---------- Toolbar collapse: manual toggle + auto-collapse on scroll ---------- */
const toolbar=document.querySelector(".toolbar");
const btnCollapse=document.getElementById("btnCollapse");
const btnCollapseLbl=document.getElementById("btnCollapseLbl");
let userOverride=false;
const COLLAPSE_AT=120,EXPAND_AT=80; // hysteresis: deadband 80–120 avoids flicker
function setCollapsed(on){
  if(toolbar.classList.contains("collapsed")===on) return;
  toolbar.classList.toggle("collapsed",on);
  btnCollapse.classList.toggle("open",!on);
  btnCollapse.setAttribute("aria-expanded",String(!on));
  btnCollapse.setAttribute("aria-label",on?"展开筛选栏":"收起筛选栏");
  btnCollapseLbl.textContent=on?"筛选":"收起";
}
btnCollapse.addEventListener("click",()=>{
  userOverride=true; // manual wins; auto re-engages only after scrolling back near the top
  setCollapsed(!toolbar.classList.contains("collapsed"));
});
window.addEventListener("scroll",()=>{
  const y=window.scrollY;
  if(y<EXPAND_AT){ userOverride=false; setCollapsed(false); }
  else if(y>COLLAPSE_AT&&!userOverride){ setCollapsed(true); }
},{passive:true});

const toTop=document.getElementById("toTop");
window.addEventListener("scroll",()=>{ toTop.style.display=window.scrollY>400?"flex":"none"; });
toTop.addEventListener("click",()=>window.scrollTo({top:0,behavior:"smooth"}));

document.getElementById("mTotal").textContent="共 "+DATA.length+" 题";
render();
</script>
</body>
