{cat:"前端",sub:"",diff:"进阶",type:"设计",tags:["流式渲染","Markdown","性能"],
 q:"前端要流式渲染 Markdown + 代码高亮，如何保证长回答时性能不崩？",
 intent:"AI 应用前端最典型的性能挑战。考察渲染优化功底。",
 ans:[
  "问题本质：每收到一个 token 就把累积的完整文本重新解析 Markdown + 重新高亮代码，是 O(n²) 的操作。回答到 3000 字时会有肉眼可见的卡顿。",
  "方案一 节流批量渲染：不要每个 chunk 都渲染。用 requestAnimationFrame 或 30–60ms 的节流把收到的增量攒起来批量 set，把渲染次数从几百次降到几十次。",
  "方案二 增量渲染（治本）：只对「最后一个未完成的块」做重新解析，前面已经确定的块用 memo 缓存的渲染结果（React 里用 React.memo + 按块 key）。把 Markdown 按块（block）切成数组，只更新最后一块。",
  "方案三 代码高亮延迟化：流式过程中先按纯文本渲染代码块（等一个反引号块收完整再高亮），或者对未完成的代码块用轻量着色。高亮库（如 Shiki、Prism）对大代码块开销很大，是主要瓶颈。Shiki 可以用异步 + Web Worker 避免阻塞主线程。",
  "方案四 虚拟滚动：回答非常长或消息很多时，只渲染视口内的消息。配合动态高度测量（ResizeObserver）。",
  "方案五 解析库选择：markdown-it / marked 的增量能力有限，可以考虑流式友好的方案（如 streamdown 思路）或自己按块解析。避免在渲染路径上做正则回溯灾难。",
  "方案六 卸载非关键工作：数学公式渲染（KaTeX）、Mermaid 图表这类重计算，用 IntersectionObserver 懒渲染，进入视口再算。",
  "指标：用 INP（Interaction to Next Paint）与长任务（Long Task）监控，目标是没有超过 50ms 的长任务；实测用 Performance 面板录制一次完整长回答。"
 ],
 follow:[
  "用户滚动到历史消息时新消息还在流，怎么不打断滚动？",
  "代码块半截（还没收到结尾的 ```）时怎么渲染？",
  "你怎么量化「不卡」？用什么指标？"
 ],
 fa:["这里有两件不同的事要分开处理。第一件是「滚动锚定」：只有当滚动条处于接近底部的位置时，新内容到达才自动滚动到底；一旦检测到用户向上滚动（距离底部超过某个阈值，比如 50 到 100 像素），就停止自动跟随，并显示一个「有新内容」的提示气泡让用户决定是否跳回去。判断依据是「用户是否在跟随」这个状态，而不是简单的时间判断。第二件是「布局抖动」：新 token 到达导致 DOM 变化，如果消息插入到滚动容器中间会引起滚动位置跳动，常见解法是用 CSS 的 overflow-anchor 属性（现代浏览器支持滚动锚定，能自动保持视觉位置），配合 transform 技巧处理不支持的情况。另外我会加一个「用户正在主动滚动」的锁——检测到用户有 wheel 或 touchmove 动作后短时间内禁止自动滚动，避免和用户的操作对抗。最后还有一个体验细节：如果用户正在阅读历史内容，新消息的预览不要直接插入 DOM 造成重排，而是在底部浮层显示，等用户回到底部再合并进去。","我的处理分两个层面。渲染层面：Markdown 解析器对未闭合的代码围栏通常会被动容错]],]] 在这种情况下的处理是自己补一个闭合标记——在增量文本后面追加 \"\\n```\" 让解析器能正常识别出代码块并给出高亮，同时在UI上给这个区块一个「生成中」的状态样式（比如光标闪烁或者右侧的进度指示），让用户知道它还没完成。这里的关键是要避免「半成品状态每来一个 token 就闪一次」——所以我会给代码块做「块级惰性渲染」，即代码块在收到完整闭合标记前，只做轻量的文本容器更新，等高亮所需的内容稳定后再交给高亮库处理。另一个坑是语言标识符：第一行的语言标记可能还没到齐，最好等第一行确定后再决定用哪个语言的词法规则。最后是记忆两条经验：一是用 requestAnimationFrame 或节流控制渲染频率，二是把「已渲染块」和「流式尾巴」分开管理，只对尾巴做高频更新。","我会用三个层次的产品指标而不是单纯用 fps。第一是 Google 定义的核心网页指标里的 INP（交互到下次绘制），它直接度量用户操作到界面产生视觉反馈的时间，目标是低于 200 毫秒；这是目前最能代表「用户感觉卡不卡」的指标。第二是 Long Task——统计主线程上超过 50 毫秒的任务数量和时长，流式渲染的性能问题本质就是频繁的重解析和重高亮产生了长任务。第三我会补充更贴场景的自定义指标：「消息渲染耗时」（从拿到数据到 DOM 更新完成）和「流式帧率抖动」（两次渲染间隔的最大值）。在工程上我还会监控重排重绘次数和 DOM 节点总数。我会设置两个门槛：开发阶段用 Performance 面板和长任务列表做 profile，线上通过 web-vitals SDK 采集真实用户数据并按 P75 看分布——注意是看 P75 而不是平均值，因为少数低端设备的体验常常被平均值掩盖。最后我倾向于把这些指标做成发布门禁。"],
 pass:"知道要节流，知道代码高亮是瓶颈。",
 good:"能指出 O(n²) 的本质问题，给出节流 + 增量块级渲染 + 高亮延迟化 + 虚拟滚动 + 懒渲染重计算的组合方案，并用 INP / Long Task 做量化验证。",
 gl:"我先点出本质问题：长回答流式渲染的性能瓶颈是一个 O(n²) 问题——每来一个 token 就重新解析整篇 Markdown、重新做一次全量语法高亮、再整体替换 innerHTML，随着消息变长，单帧开销线性增长，帧数就变成平方级增长，最终表现为「越到后面越卡」。所以核心思路是把「全量重算」改成「增量最小更新」。组合方案我讲五点：第一是节流——不要用每个 token 触发一次渲染，用 requestAnimationFrame 或者定时器按帧合并，把高频更新降到每 16 到 50 毫秒一次，肉眼几乎感知不到差别但主线程压力大幅下降。第二是增量块级渲染——把已经稳定的内容（比如已经解析完成的段落、已闭合的代码块）固化成 DOM 节点并缓存其渲染结果，后续只追加或只更新最后一个「流式尾巴」节点，避免整棵子树重建。第三是高亮延迟化——语法高亮是这里面最贵的操作之一，我不在流式过程中做高频高亮，而是等代码块闭合后再一次性高亮，未闭合时只做纯文本展示加生成中样式。第四是虚拟滚动——当会话里消息很多时，只渲染视窗附近的消息，离开视窗的节点卸载或者降级为占位。第五是懒渲染与重计算的权衡——惰性给水合:对折叠的、或者用户没在看的消息延迟给它 hydrate/重计算，并配合 IntersectionObserver 按需激活。验证上我用三个具体指标：INP 目标低于 200 毫秒；Long Task 数量和总时长的 P75；以及自定义的「单帧渲染耗时」和「流式帧抖动」。这些要用真实低端设备看 P75 而不是看平均值，因为平均值会把卡顿掩盖掉。",
 red:"每个 chunk 直接 setState 全量重渲染；没有做任何优化且没意识到有问题。"},

{cat:"前端",sub:"",diff:"进阶",type:"设计",tags:["状态管理","会话"],
 q:"AI 会话的状态管理：会话列表 + 流式消息 + 多标签页 + 离线缓存，怎么设计状态结构？",
 intent:"考察前端架构能力，AI 应用的状态复杂度远高于普通 CRUD。",
 ans:[
  "状态分类：① 服务端状态（会话列表、历史消息）——用 TanStack Query / SWR 管理，带缓存、失效、重试，不要塞进全局 store；② 客户端状态（当前会话 ID、输入框草稿、UI 状态）——用 Zustand / Redux；③ 流式瞬时状态（正在生成的消息）——单独管理，不混入持久状态，生成结束后再落库并合入历史。这个三分法是关键。",
  "数据结构：消息用「规范化存储」（normalized）——messages: Record<id, Message> + messageIdsBySession: Record<sessionId, id[]>。避免深层嵌套数组带来的更新性能问题和不可变更新的复杂度。",
  "流式消息处理：正在生成的消息用一个单独的 streamingMessage 字段，生成过程中只更新它；生成完成后 dispatch 一条完整消息进列表并清空 streaming。避免「每收到一个 token 就更新整个消息数组」。",
  "乐观更新：用户发消息后立刻在 UI 显示（乐观插入），请求失败再标记失败并允许重试。流式场景下尤其重要，否则用户会感觉点击没反应。",
  "多标签页同步：用 BroadcastChannel 或 storage 事件同步（如「另一个标签页正在生成」）；更严格的场景用服务端推送 + 本地事件总线。要防止两个标签页同时触发同一个会话的生成请求（用一个锁或服务端幂等）。",
  "草稿与离线：输入框草稿存 localStorage（按会话 ID），刷新不丢；离线时提示不可用而不是让用户白写。",
  "持久化：会话列表与最近消息可以存 IndexedDB（localStorage 容量不够）；敏感内容要注意——浏览器端持久化用户对话有隐私风险，需评估是否加密或干脆不存。",
  "清理：会话切换时要中止上一个会话的流式请求（AbortController），否则会出现「切走了还在往旧会话里塞内容」的 bug。"
 ],
 follow:[
  "两个标签页同时发消息，怎么避免重复生成？",
  "会话历史有几千条消息，一次性加载会卡，怎么处理？",
  "刷新页面时正在生成的消息怎么处理？"
 ],
 fa:["这需要服务端加客户端两层配合。最可靠的防线在服务端：每条用户消息都由客户端生成一个幂等的 message_id（UUID），服务端以它为唯一键做去重——重复的 message_id 直接返回已存在的那条 assistant 消息的流，而不是再生成一次。这样即便两个标签页同时发出，物理上也只会有一条生成流。客户端层面，我会给「某个会话正在生成」这件事加一个共享锁：可以用 BroadcastChannel 或者 storage 事件在多标签页之间同步状态，先抢到锁的标签页负责发起请求，另一个页面显示「正在生成中」并订阅结果；也可以用 leader election 的方式选出一个主标签页统一持有连接。另外从体验上，我会避免两个标签页同时自动触发（比如都在自动重试或自动续写），这类场景要加去抖。我还会提醒一个隐蔽的坑：两个标签页如果各自持有不同的本地状态，合并时容易产生消息错乱，所以消息列表的最终真相必须在服务端，客户端只做投影。","这是典型的虚拟列表加分页拉取。渲染层面必须用虚拟滚动——只渲染视窗附近的几十条消息，不要试图一次渲染几千个 DOM 节点，这是能不能跑的根本。数据层面做分页和预取：初次进入只拉最近的一屏加少量缓冲，向上滚动时按需拉取更早的历史；可以利用已知的容器高度和估算的消息高度先撑出占位，拉取完成后再替换为真实内容。这里有一个关键设计是「滚动位置的保持」——向上加载历史时会插入大量节点导致滚动跳变，要用 height 补偿或者锚定到某个 reference 消息的 offset。另外我会做两类优化：一是把历史消息的「重解析」推迟到空闲时间处理，避免首次渲染阻塞；二是搜索、引用跳转这类功能走服务端或者 Web Worker，不在主线程遍历几千条。最后提醒：不要把所有历史都放进客户端状态树做响应式监听，那会导致每次更新都全量 diff，应该分区存储并只对活跃区做响应式。","这道题的关键是把「正在生成」当成服务端的任务状态而不是客户端的内存状态。我的设计是：消息在创建时就落库并带上 streaming / completed / failed / interrupted 状态，流式的内容持续追加写到服务端（或者至少在生成结束后立刻持久化），客户端任何时候重新加载都能拿到当前已生成的部分。刷新之后有三种处理方式，我按推荐度排列：一是「自动续接」——如果服务端还在生成，重连后继续接收剩余部分（这需要 SSE/WebSocket 支持游标或 Last-Event-ID）；二是「保留部分内容并给出继续/重生成按钮」——服务端生成已中断或不可续接时，把已生成部分展示出来，让用户决定是接着生成还是重新来过；三是「标记为未完成」但保留内容，避免用户以为内容丢了。这里还要处理一个细节：本地可能有刷新前缓存的草稿和未发送消息，要做草稿恢复。另外要幂等——重连时不能重复触发一次生成，所以用同样的 message_id 去「订阅」而不是「创建」。"],
 pass:"知道要区分服务端状态和客户端状态，知道流式消息要单独管理。",
 good:"能给出「服务端/客户端/流式瞬时」三分法、规范化存储结构、乐观更新、多标签页同步与并发锁、切换会话时中止流的完整设计，并考虑到端上持久化的隐私风险。",
 gl:"我的核心设计是把状态分成三类来存放，混在一起一定会出问题。第一类是服务端权威数据——会话列表、完整消息历史、消息状态，它的特征是持久、可多端共享、是最终真相；第二类是客户端视图状态——当前选中会话、滚动位置、草稿、UI 层的展开折叠，它的特征是本地、易失但不重要；第三类是流式的瞬时状态——正在生成的这一段增量文本、连接状态、当前 token 缓冲，它的特征是高频变化、不应进入持久化的主状态树，我通常会用一个独立的 ref 或者一个非响应式的缓冲来承接它，避免每来一个 token 就触发整个应用的 diff。存储结构上我会用规范化形态：conversations 和 messages 分表（用 Map 而不是数组），消息按 conversationId 索引，避免深层嵌套和 O(n) 查找。交互上有几个必须做对的点：一是乐观更新——用户发消息后立即本地插入一条 sending 状态的消息，服务端确认后替换，失败则标记失败并保留重试入口；二是多标签页同步——用 BroadcastChannel 或者 storage 事件同步「某会话正在生成」的状态，配合服务端的幂等 message_id 做去重，双保险避免重复生成；三是切换会话或离开页面时要显式中止流式连接并保留已生成内容，不能泄漏连接。最后是隐私考虑：端上持久化要用 IndexedDB 并加密或至少随登出清除，因为聊天记录常常包含敏感信息，缓存在浏览器里本身就是风险。",
 red:"所有状态塞进一个全局对象；每个 token 更新整个消息数组；切换会话不中止旧请求。"},

{cat:"前端",sub:"",diff:"基础",type:"概念",tags:["SSE","WebSocket","协议"],
 q:"SSE、WebSocket、长轮询在 AI 会话场景怎么选？各自的坑是什么？",
 intent:"基础协议题，考察对 AI 场景特殊性的理解。",
 ans:[
  "AI 会话的通信特征是「客户端发一次，服务端持续推一段，直到生成结束」，本质是单向流。SSE 最契合：基于 HTTP/1.1（或 HTTP/2）、浏览器原生支持自动重连、协议简单、能过绝大多数代理和网关。",
  "WebSocket 是全双工，优势在于客户端也要持续高频上行——AI 场景里对应的是语音实时流、实时协同编辑、需要服务端主动推送非请求触发的消息（如后台任务完成通知、多人协作广播）。为了单向流式而上 WebSocket 是过度设计，且要自己处理心跳、重连、断线续传。",
  "长轮询：兼容性最好（能过最严格的防火墙/老代理），但延迟和资源开销都大。只作为兜底（检测 SSE 不可用时降级）。",
  "SSE 的坑：① 原生 EventSource 不支持 POST 和自定义 Header（无法带 Authorization），AI 请求通常需要带 body 和鉴权——解法是用 fetch + ReadableStream 自己解析 SSE 格式，或用 query 参数带短期 token；② 浏览器对同一域名的 HTTP/1.1 并发连接有上限（6 个），开多个会话流会互相阻塞——HTTP/2 可缓解；③ Nginx 默认 proxy_buffering 会缓冲数据，必须关闭；④ 负载均衡器/网关的空闲超时会掐断连接，要发心跳。",
  "WebSocket 的坑：① 某些企业代理和防火墙会阻断 Upgrade 请求；② 需要自己实现心跳、重连、消息序号与去重；③ 负载均衡需要会话保持或专门的 WS 支持；④ 移动端弱网下频繁重连。",
  "兜底策略：优先 SSE，失败降级到长轮询；错误信息要可诊断（前端能区分是网络断、服务端错、还是流被掐断）。",
  "补充：HTTP/2/3 下 SSE 的并发限制问题消失，但现在很多中间设备仍会缓冲，生产上要在真实网络环境下验证。"
 ],
 follow:[
  "企业客户的网络环境里 SSE 经常不通，你怎么处理？",
  "同时开 10 个会话流，浏览器并发限制怎么办？",
  "你怎么区分「生成结束」和「连接异常断开」？"
 ],
 fa:["这在国内企业环境里非常常见，我在上份工作就遇到过几次。根因通常有三个：企业代理或 WAF 把长时间无数据流的连接掐断、把 text/event-stream 这种 Content-Type 挡掉、或者网络设备对小众响应类型处理不好。应对我按优先级：第一是「自动降级」——这是最实用的：前端先尝试 SSE，如果在一定时间内（比如 10 秒）没有收到任何数据或者连接建立失败，自动降级到 WebSocket，再不行降级到轮询取结果；并且把降级结果记忆到这个客户的配置里，下次直接用可用的通道。第二是「保活」——服务端定期发送心跳或注释行（SSE 规范里以冒号开头的行会被忽略）保持连接活跃，避免被中间设备判为闲置。第三是「关闭缓冲」——很多时候不是 SSE 不通而是被 Nginx 或代理缓冲了，需要设置 X-Accel-Buffering: no 并关闭 proxy_buffering。第四是对长任务干脆改成异步轮询——把任务提交后返回 task_id，前端轮询状态，这种方式穿透性最好，几乎不受企业网络策略影响，代价是实时性差一些。","这个问题要区分 HTTP/1.1 和 HTTP/2。HTTP/1.1 下浏览器对同一域名有约 6 个并发连接的上限，10 个 SSE 连接会直接把连接池占满，导致页面其他请求排队卡顿——这是很多人踩的坑。解决办法主要有三个：一是「 multiplexing」——上 HTTP/2 或者 HTTP/3，多条流可以复用同一个 TCP 连接，从根本上解决连接数限制，这是最推荐的；二是「单连接多路复用」——在应用层做，所有会话的流合并到一条 SSE 或 WebSocket 连接上，每条事件带 conversation_id，前端按 id 分发，代价是服务端改造；三是产品层面「限制同时活跃的生成数」——真实的产品里同时跑 10 个生成任务既不合理也浪费钱，我会限制为 1 到 3 个并发，其他的排队或者提示用户等待。我还会做一个细节：断开不用的连接，比如切到别的会话或者页面不可见时（visibilitychange）主动关闭空闲流，避免无谓占用。","这个区分在流式协议里是必须的，靠三件事保证。第一是「显式结束标记」——正常结束一定要发送一个明确的 done 事件（带 usage 统计和 finish_reason），绝不能依赖「连接关闭」来推断结束，因为连接关闭既可能是正常结束也可能是网络中断。第二是「心跳或超时」——如果连接在没有收到 done 的情况下静默断开，那是异常；服务端还可以定期发送心跳，超过一定时间没有收到任何字节（包括心跳）就判定为连接已断。第三是「查询补偿」——这是我强烈建议加的一层：每条消息有一个 message_id，前端在检测到异常断开后可以主动调用一次「查询消息状态」的接口，服务端告诉它这条消息是已完成、生成中还是失败；如果已完成就把完整内容拉回来。这个「查询补偿」的设计能把绝大多数断线场景优雅地兜住，因为它不依赖那条脆弱的流式连接。另外我会提醒：断开时保留已收到的内容，给用户重试而不是清空。"],
 pass:"知道 SSE 适合 AI 流式，WebSocket 是双向的。",
 good:"能给出明确的选型结论与理由，讲清 SSE 的四个实战坑（EventSource 不能带 header、并发上限、Nginx 缓冲、网关超时）和 WebSocket 的适用边界，并有降级策略。",
 gl:"我的选型结论是：AI 会话场景优先选 SSE，特殊场景才用 WebSocket，长轮询作为保底降级。理由是这样：LLM 对话本质是服务端到客户端的单向推送，SSE 基于普通 HTTP，实现简单、自动重连内置（Last-Event-ID）、运维友好、不需要心跳维持，服务端用标准的流式响应就能实现；WebSocket 适合真正双向交互的场景——比如语音实时对话需要边说边传音频、多端协同、或者客户端需要持续回传数据。用 WebSocket 做单向对话是过度设计，会引入连接管理、心跳、粘性会话这些额外负担。长轮询的优势是穿透性最好、实现最简单，很多企业内网环境只有它能通，所以它是必需的降级通道而不是主力。SSE 的四个实战坑我一定会讲清楚：第一，原生 EventSource 不能带自定义请求头，鉴权要用一次性 ticket、Cookie 或者改用 fetch 加流自行解析；第二，HTTP/1.1 下同域并发连接上限约 6 个，多会话场景要么上 HTTP/2、要么做应用层多路复用、要么限制并发生成数；第三，反向代理默认会缓冲响应导致流式失效，Nginx 要设 proxy_buffering off 和 X-Accel-Buffering: no，很多网关也有各自的超时配置要调；第四，SSE 连接长时间空闲会被中间设备掐断，需要服务端定期发心跳或注释行保活。此外还要有正确的结束判定——必须发送显式的 done 事件，并提供「按 message_id 查询状态」的补偿接口来应对断线。最后是降级策略：SSE 失败自动降级到 WebSocket、再降级到轮询，并把结果记住以适配不同客户端环境。",
 red:"不加区分地说「用 WebSocket」；不知道 EventSource 不能自定义 header；不知道要关代理缓冲。"},

{cat:"前端",sub:"",diff:"进阶",type:"设计",tags:["虚拟滚动","长列表"],
 q:"聊天窗口积累了几千条消息，怎么保证滚动和渲染性能？",
 intent:"长列表是 AI 对话应用的标配难题。",
 ans:[
  "核心方案：虚拟滚动（Virtual Scrolling）——只渲染视口内及缓冲区内的消息，DOM 节点数保持在几十个而不是几千个。用 react-window / react-virtuoso 等库。",
  "AI 场景的特殊难点：消息高度不固定（长短差异大、有代码块、有表格、有图片），且流式过程中最后一条消息高度在持续增长。解决方案是动态高度测量——渲染后测量实际高度并缓存（ResizeObserver），用估算高度做初始占位。react-virtuoso 对这类场景支持较好。",
  "滚动锚定（关键体验点）：① 流式生成时，如果用户已经在底部，要自动跟随滚动；如果用户往上翻看历史，绝不能强制拉回底部（这是最常见的糟糕体验）。判断依据：滚动位置距底部是否小于某阈值。② 加载历史消息（向上无限滚动）时，要保持当前视觉位置不跳动——需要记录锚点消息的位置偏移，加载后恢复。",
  "分页加载：历史消息按游标分页，向上滚动到顶部时加载上一页。要注意加载时不要触发连锁加载，以及重复消息的去重（按消息 ID）。",
  "图片/富媒体的影响：图片加载完成后高度变化会导致跳动。解决：在 Markdown 里给图片预设宽高比占位（从 Markdown 语法或服务端返回的尺寸信息），或在 img onload 后校正位置。",
  "渲染优化：消息组件用 React.memo 避免无关重渲染；避免在渲染路径做重计算（Markdown 解析结果缓存）；代码高亮结果缓存。",
  "搜索：几千条消息里搜索，前端全量过滤会卡。做法是用 Web Worker 做搜索，或把搜索下放到服务端（更实际）。"
 ],
 follow:[
  "流式生成时用户往上翻，怎么不打断他？",
  "消息里有图片，加载后高度变化导致跳动，怎么解决？",
  "向上加载历史消息后滚动位置跳了，怎么修复？"
 ],
 fa:["处理方式的核心是把追随做成条件性行为。我会维护一个「是否应该自动滚动」的状态，判断条件是滚动条距离容器底部是否在一个小阈值内（比如 100 像素以内）。当用户向上翻阅导致距离超过阈值，就关闭自动跟随，这时新 token 到达时不动滚动位置；用户滚回底部附近再自动恢复跟随。这里必须注意一个细节：不要用 scrollHeight 的简单判断，因为用户可能只是微调滚动一点点，要用带阈值的迟滞判断避免来回抖动。另外为了体验我会加一个「有新内容」的浮动提示，让用户知道下面还在生成并且可以一键跳回去。技术上还要防止插入 DOM 造成的重排：用 CSS overflow-anchor 让浏览器自动维持视觉位置，或者在某些情况下把新增内容 append 到不影响当前视口的区域。最后是实践中的一个坑：流式更新频繁触发 scroll 事件会产生抖动感，要用 rAF 合并。","这是典型的累积布局偏移问题。解法的核心是「在图片加载完成前就占据确定的空间」。分层处理：一是在渲染时就确定尺寸——如果服务端返回了图片的宽高原数据，直接在 img 标签上设置 width 和 height 属性配合 CSS aspect-ratio，浏览器会预留等比高空间，这是最干净的方案；二是如果没有原数据，使用固定比例的占位容器（比如限定图片展示区的最大宽高比），加载完成后在容器内做 object-fit 适配，可能发生裁切但不会有跳动；三是缓存已经测量过的高度——同一张图片第二次渲染时直接套用已知高度。另一个关键点是不要把图片高度交给「加载完才知道」，可以在上传时就而是在写入消息时就携带尺寸信息。最后如果用户往上翻阅的位置在图片之上，图片加载撑高内容会把视口内容顶走，这时同样要用滚动锚定补偿——检测到上方内容高度变化时，同步调整 scrollTop 保持视觉位置不变。","这是虚拟列表或分页加载里最经典的问题，修复思路是「高度补偿」。具体做法是：在插入历史消息之前，先记录一个锚点元素以及它相对容器顶部的 offset（比如「某个 message_id 的元素当前距顶部 200px」）；插入完成后，找到同一个元素，再测量它的新 offset，两者之差就是你需要在容器的 scrollTop 上补偿的量。实现上有几个细节：一是锚点要选可见区域内的元素，因为 virtual list 可能会卸载不可见节点；二是补偿必须在同一帧内完成，要在 DOM 更新后用 useLayoutEffect 或者同步布局 flush 之后再调整 scrollTop，否则用户会看到一帧跳变；三是初始滚动条抖动的问题——如果历史消息还未测高就用估算高度撑占位，数据回来后高度变化会引起同样的跳动，也要做同样的补偿。另一个更工程化的替代方案是「先撑高度再填内容」：分页请求返回时把总条目数和估算总高度先写入，让滚动条位置稳定，再逐步填充真实内容。"],
 pass:"知道用虚拟滚动，知道要分页加载历史。",
 good:"能讲清动态高度测量与缓存、滚动锚定的两种场景（自动跟随 vs 不打断上翻 / 加载历史保持位置）、图片占位的高度稳定方案，以及渲染缓存与搜索的异步化。",
 gl:"我会先明确本质：聊天窗口里大部分 DOM 节点在任意时刻是不可见的，所以第一个答案是虚拟列表——只渲染视窗附近的消息，几千条也能保持流畅，这是能不能跑的根本前提。但这里真正的难点在于「动态高度」——不像表格行高固定，消息的 Markdown 内容高度不定，包含代码块、图片、表格，虚拟化所需的总高度是估算的。我的解法是动态测量加缓存：消息首次渲染时测量它的真实高度并写入缓存（按 message_id 索引），估算阶段用同类消息的平均高度，并在滚动过程中逐步校正估算值；已经测量过的不再重复计算。同时限制已渲染节点的 DOM 复杂度。滚动锚定我分成两种场景分别处理，这个区分很关键：第一种是流式生成时的「自动跟随」——只有当滚动条贴近底部（比如 100 像素内）才自动滚到底，用户一旦上翻就停止跟随并显示新内容气泡，避免打断阅读；第二种是加载历史消息时的「保持位置」——插入历史内容会导致上方高度变化把视口顶走，正确做法是在插入前记录锚点元素相对容器顶部的偏移，插入后重新测量同一元素的偏移，把差值补偿回 scrollTop，并在同一帧内完成以免闪动画面。图片导致的高度变化则用「预留尺寸」解决：优先让服务端在原数据里携带宽高并用 aspect-ratio 预留空间，其次是固定比例占位容器加 object-fit 适配，并把测量过的高度缓存复用。最后是渲染层面的异步化——Markdown 重解析和搜索这类重计算要移出主线程或者延迟到空闲处理。",
 red:"一次性渲染所有消息；流式时无条件拉到底部导致用户无法翻看历史。"},

{cat:"前端",sub:"",diff:"进阶",type:"排障",tags:["错误处理","降级","重试"],
 q:"前端错误处理：LLM 返回半截 JSON、网络中断、token 过期，如何优雅降级？",
 intent:"考察健壮性设计。AI 应用的失败模式比传统应用多得多。",
 ans:[
  "先分类：① 可重试的瞬时错误（网络中断、5xx、429）——自动重试 + 指数退避；② 需用户介入的（token 过期、权限不足、配额用完）——静默刷新 token 或引导重新登录/升级套餐；③ 内容类错误（模型输出非法 JSON、被安全过滤拦截、内容为空）——降级展示或转人工；④ 不可逆的（任务超时、服务端彻底失败）——保留上下文让用户重试。",
  "半截 JSON / 流式中断：前端要有「不完整状态」的展示能力——显示已生成的部分内容，并标注「生成中断」，提供「重新生成」和「继续生成」（若后端支持续传）两个选项。绝不能因为解析失败就把已收到的内容全丢掉。",
  "增量解析的容错：自己实现 SSE 解析时要能处理跨 chunk 的半个事件、半个 JSON；解析失败不应让整个流中断，而是跳过这一个事件继续。",
  "token 过期：用拦截器统一处理 401——静默刷新（refresh token）后自动重放原请求；刷新失败才跳登录，并保存当前草稿与会话位置，登录后恢复。流式请求比较特殊（已经发出去了），要从一开始就带有效 token 或在流开始前做一次预检。",
  "配额与限流：429 要展示明确的 Retry-After 倒计时和原因（「今日额度已用完」而不是「请求失败」），并给出升级入口。",
  "重试的用户体验：自动重试要给用户可见的提示（「网络波动，正在重试 1/3」），超过次数后转为手动。重试要幂等——用同一个 message_id 避免重复生成两条消息。",
  "全局兜底：Error Boundary 防止渲染崩溃导致白屏；关键路径（如发送消息）失败要有明确的失败态 UI 而不是静默无反应。",
  "可观测：前端错误上报（Sentry 类）要包含 session_id、请求 ID，方便与后端 trace 关联排查。"
 ],
 follow:[
  "生成到一半断了，用户之前的等待怎么不白费？",
  "自动重试导致重复生成了两条消息，怎么避免？",
  "你怎么做前端错误监控？能和后端 trace 打通吗？"
 ],
 fa:["我的原则是「已生成的内容是用户的资产，不要因为它不完整就丢弃」。具体实现：第一，流式缓冲要独立于最终渲染状态，收到多少就在 DOM 里保留多少，错误发生时把已生成部分固化成一条「未完成」的消息并在 UI 上明确标注——比如加上一句「生成中断于 12:30」和一个重试用例。第二，提供「续写/重新生成」的入口，并尽量让重试能利用上下文继续而不是从头再来；如果服务端支持用 message_id 续接是最好的。第三，本地要有兜底——如果连固化都来不及（比如页面已被关闭），把流式的中间产物写入 IndexedDB 作为草稿，用户回来时能恢复。这里还有两个我认为很重要但常被忽略的点：一是「降级要有诚实的文案」，不要让用户猜发生了什么，明确告诉他是网络中断还是模型出错还是内容策略拦截；二是「不要给用户一个半截 JSON 让他困惑」，对结构化输出场景要用部分解析提取出可用字段，实在不行就切换到文本视图。最后要说一句产品经验：保留内容的价值远大于重新生成的成本，尤其当它已经生成了几十秒的时候。","这个问题的本质是幂等。我的做法是「请求侧的幂等键加服务端去重」——客户端在用户发送消息时就生成一个 client_message_id 并随请求带出，重试时复用同一个 id 而不是生成新的；服务端以它为唯一键，发现已存在就直接返回已有消息。这样无论网络重试、套接字自动重试、还是用户在感知失败后手动重试，物理上都只产生一条消息。前端侧要做三件事：一是明确区分「自动重试」和「用户主动重试」，自动重试只针对明确的网络层失败且要限制次数；二是要有去重 link——即使在 UI 上短暂出现两条同 id 的消息渲染，也要按 client_message_id 收敛；三是要有可见的重试状态而不是静默重试，否则用户不知道发生了什么。另外一个常见的坑是「双触发」：用户在错误后急躁地连点，以及 useEffect 之类的逻辑重复执行——我会用一个发送中的锁加请求级别幂等来双保险。","我会从「能不能把它和后端的 trace 打通」这个目标倒推设计。前端监控我用 Sentry 这类 SDK 捕获异常（未捕获的 Promise rejection、渲染错误、资源加载失败），但对 AI 应用来说更重要的是「业务错误」——模型返回结构化错误、流式中断、内容安全拦截、ttft 超时，这些不会被普通异常捕获，需要显式上报。打通的关键是 trace_id：后端在创建请求时生成 trace_id 并通过响应头或者首个流式事件注入到前端，前端所有关于这次请求的上报都带上它；这样后端的调用链日志和前端的错误事件就能通过 trace_id 关联起来，形成一个端到端的视图。这也是我会把 trace_id 直接展示在 UI 错误提示里的原因——用户报问题时给到客服，我们就能一秒定位。此外我会区分错误的严重程度：网络类自动重试并静默处理；业务类（401、内容策略）走明确的用户引导；前端渲染错误才走告警。最后 index这类错误的监控必须和版本关联，最好能看到「某次发布后某类错误是否上升」。"],
 pass:"知道要区分错误类型、要有重试和友好提示。",
 good:"能给出四类错误的分类处理方式、流式中断保留已生成内容的降级 UI、增量解析容错、401 静默刷新与草稿恢复、幂等重试（同 message_id），以及前后端 trace 关联。",
 gl:"我会把 AI 应用的前端错误分成四类，它们的处理方式完全不同。第一类是「内容类错误」——模型返回半截 JSON、格式不合法、结构化输出不符合 schema。应对是增量解析加容错：用 partial-json 这类库做可容忍未完成结构的解析，拿到多少用多少；对残缺的部分做降级渲染——比如 Markdown 未闭合的代码块自动补闭合标记并标记「生成中」，半截 JSON 则切换成文本视图而不是白屏。第二类是「传输类错误」——网络中断、流式连接断开。应对是保留已生成内容加断点恢复：把流式产物固化成未完成的消息并提供继续/重试入口；重试必须用同一个 message_id 做幂等，避免产生两条重复消息；并且最好是「查询补偿」——用 message_id 去问服务端这条消息的最终状态，而不是盲目重新生成。第三类是「鉴权类错误」——token 过期。应对是 401 静默刷新：拦截请求、用 refresh token 换新、重放出失败的请求并让这个过程对用户透明；如果刷新也失败才引导重新登录，并且登录前的草稿要保留。第四类是「业务类错误」——内容安全拦截、配额不足、模型不可用。这些需要明确的、可理解的文案引导而不是技术报错，比如配额不足要给升级入口。最后所有错误都要有统一的降级 UI——保留上下文、给出原因、提供下一步动作（重试/继续/反馈），并且把 trace_id 展示出来，让前端错误监控能和后端调用链通过 trace_id 打通。",
 red:"所有错误都 toast 一句「请求失败」；解析失败就丢弃全部内容；重试会产生重复消息。"},

{cat:"前端",sub:"",diff:"进阶",type:"设计",tags:["嵌入式","SDK","跨域"],
 q:"做一个可嵌入客户网站的 AI 客服挂件（iframe 或 SDK），跨域和安全怎么做？",
 intent:"考察 B 端交付经验。嵌入式 AI 组件有独特的安全与兼容挑战。",
 ans:[
  "形态选择：iframe 方案隔离性最好（CSS 和 JS 完全隔离，不会和客户页面样式/依赖冲突），集成成本最低（客户贴一段 script）；SDK 方案（原生 Web Component + Shadow DOM）体验更好（没有 iframe 的高度、滚动、层级问题），但样式隔离要靠 Shadow DOM、且受客户 CSP 影响。B 端交付优先 iframe，对体验要求高的用 SDK。",
  "跨域通信：iframe 用 postMessage，必须校验 event.origin 白名单（否则任何页面都能给你的 iframe 发消息）；SDK 方案要注意 JS 全局污染（用 Shadow DOM 隔离样式、单一命名空间、不依赖全局库版本）。",
  "样式与布局冲突：iframe 是最彻底的隔离；SDK 用 Shadow DOM + CSS 变量暴露可配置项；避免使用 !important 和全局选择器；z-index 要给到一个足够高且有文档说明的值。",
  "鉴权与租户识别：嵌入代码里带一个「站点 ID / 公钥」用于识别租户，但敏感操作（如查询订单）的鉴权不能只依赖这个——它暴露在客户页面源码里，任何访客都能看到。正确做法是：挂件初始化时向服务端换取一个有时效的会话令牌，并且该令牌只拥有访客级权限；涉及用户身份的操作要用客户系统自己的登录态（通过签名 JWT 传递）。",
  "CSP 兼容：客户站点可能有严格 CSP，你的脚本需要 nonce 或要求客户把你域名加入白名单。要在文档里说明，并提供降级方案。",
  "性能：脚本异步加载（async/defer）、体积要小（挂件首屏 JS 控制在几十 KB）、不能拖慢客户站点；懒加载——用户点击挂件图标后才加载主体资源。",
  "隐私与合规：挂件会读到客户站点的 URL、可能读 cookie——要有明确的隐私声明和开关；不要在第三方上下文里存敏感数据。",
  "可观测：挂件在客户站点出错你看不到——必须内置错误上报，并带上站点 ID 和版本号，用于定位「是某个客户的定制环境导致的」。"
 ],
 follow:[
  "客户站点有严格 CSP，你的脚本加载不了，怎么处理？",
  "挂件里的 AI 要调用客户内部系统查订单，权限怎么设计才安全？",
  "iframe 高度自适应怎么做？"
 ],
 fa:["CSP 严格是第三方挂件的常态，我从三个层面解决。第一，脚本本身的合规性：不使用 eval、不使用内联 script 和内联 style、不动态 generation 注入 style 标签（改用 CSSOM 或者提前注入的 CSS 变量），避免 unsafe-inline 和 unsafe-eval 需求；这样客户的 script-src 只要允许我们的域名即可。第二，给客户提供明确的 CSP 接入文档，列出需要加入白名单的域名（静态资源域、API 域、可能的字体域），并尽量收敛到最少。第三，提供「无脚本降级」：如果一个前置 script-to-provided 方式被完全拒绝，我会退回到 iframe 方案——iframe 是通过 src 加载的独立文档，它的加载走 frame-src 而不是 script-src，很多时候更容易被接受，而且 iframe 天然隔离 CSS 和 JS 冲突。另外 React、Vue 等框架的富 UI 挂件我会优先推荐 iframe，SDK 形式只在客户明确要求深度集成 UI 时才用。还有一个实用建议：在客户接入前先做一次自动化的 CSP 探测，提前发现问题。","这里有一条绝不能破的红线：挂件拿到的任何凭证都不能等价于「可以查询任意用户的订单」。正确的设计是「客户服务端签名 + 短期会话令牌 + 服务端代理」。具体流程是：客户在自己的服务端用私钥签发一个 JWT，里面带上已登录用户的 ID、有效期（比如 15 分钟）和限定的权限 scope，把这个 JWT 交给挂件；挂件每次请求都带上它，我们的服务端验签后，代表这个特定用户去调用客户的内部系统。关键点有三个：一是签名必须在客户服务端做，不能在前端用共享密钥，否则密钥就泄漏了；二是令牌要短时效且绑定用户和一个 CSRF 防护的 nonce；三是所有查询必须由我们的服务端代理去客户系统，并且 server 侧还要做「该用户是否有权查这个订单」的校验，不能只靠前端传参。绝不能做的是把客户的 API key 或者一个通用凭证放到前端或者嵌入配置里——那种「嵌入口令」的做法等同于把客户整个数据库的读权限公开。","首选方案是 postMessage 加 ResizeObserver：iframe 内部用它自己的 ResizeObserver（或者 MutationObserver 加节流）监听 document 或 body 的尺寸变化，一旦变化就 postMessage 通知父页面新的高度，父页面收到后调整 iframe 的 style.height。这里有几个必须注意的实战细节：一是消息必须校验 origin 和 message 结构，父页面只接受来自我们 iframe 域名的消息，iframe 侧也要校验 parent origin 避免被嵌套钓鱼；二是节流——流式输出时内容高频增长，要用 requestAnimationFrame 或几十毫秒的节流合并，否则每秒几十条消息会拖垮性能；三是要设置合理的高度边界，避免无限增长撑爆页面，超出阈值时内部滚动；四是初始高度要给一个合理默认值并用 CSS transition 平滑变化，否则首屏会有明显跳动。更现代的可选方案是用 iframe 的 ResizeObserver 观察 cross-origin iframe 的尺寸（Chrome 已支持 Observe cross-origin iframe），但目前兼容性还不够好，所以 postMessage 仍是主流。我还会建议给父页面一个「高度锁」的配置项，允许客户固定高度。"],
 pass:"知道用 iframe 隔离，用 postMessage 通信。",
 good:"能对比 iframe 与 SDK 的取舍，讲清 postMessage 的 origin 校验、嵌入口令不能当鉴权（要换短期会话令牌 + 客户侧签名 JWT）、CSP 兼容、懒加载性能，以及第三方环境的错误上报。",
 gl:"我会先做形态取舍。iframe 的优势是隔离性：CSS 不会互相污染、JS 全局变量不冲突、客户的严格 CSP 更容易通过（走 frame-src 而非 script-src）、DOM 级的安全边界清晰，而且我们能独立发版不用客户升级；劣势是集成深度受限——UI 必须浮在最上层、无法自然地与客户页面联动、SEO 和 a11y 处理麻烦、以及上面提到的高度自适应问题。SDK 脚本注入的优势是能深度集成客户的 UI 和设计语言、体验更原生，劣势是要面对客户站点的各种上下文污染、依赖冲突、CSP 问题和更难的调试。我的选择倾向：默认是 iframe，只有当客户明确要求 UI 深度嵌入才提供 SDK，并且 SDK 内部也最好套一层 iframe 承载 UI，只把 SDK 用于通信和生命周期控制，这是两全的办法。跨域与安全上我要讲几条硬原则：一是 postMessage 必须双向校验 origin——父页面和 iframe 都要校验对方的源，这是最基本的；二是「嵌入配置里放口令」绝不能作为鉴权，正确做法是让客户服务端用私钥签一个短期 JWT（带用户身份和权限 scope），我们的服务端验签后代理调用客户内部系统，所有敏感查询都在服务端完成并由服务端做二次权限校验；三是所有请求都要校验 referrer/origin 里是否与客户配置的允许域名匹配，防止挂件被嵌到别人网站上盗用配额。此外我会提到两个工程要点：性能上脚本必须异步懒加载、体积要小、不能阻塞客户页面；错误上报要能上报到我们自己的系统并且不能污染客户的全局错误监控——用 try/catch 包裹并避免改动全局 handler。",
 red:"把租户密钥直接写在嵌入代码里；postMessage 不校验 origin；不做 CSP 兼容导致部分客户无法使用。"},

{cat:"前端",sub:"",diff:"基础",type:"概念",tags:["性能指标","Core Web Vitals"],
 q:"Core Web Vitals（LCP / INP / CLS）在 AI 应用里有什么特殊挑战？",
 intent:"考察是否把性能当工程指标而不是玄学。",
 ans:[
  "三个指标的含义：LCP（最大内容绘制，首屏加载）、INP（交互到下次绘制，响应性）、CLS（累积布局偏移，视觉稳定性）。",
  "LCP 在 AI 应用里的挑战：首屏往往是「等待 AI 返回」，LCP 元素可能是骨架屏或历史消息。优化重点是让首屏有价值内容尽快出现——历史会话本地缓存直出（不等网络）、骨架屏设计、关键资源预加载。",
  "INP 是 AI 应用最容易被拖垮的指标：流式渲染是持续的主线程占用（Markdown 解析、代码高亮、DOM 更新）。如果每次 token 到达都做全量重解析，会产生大量长任务，导致用户点击「停止」「复制」按钮无响应。这是最典型的 AI 应用 INP 问题。",
  "CLS 的特殊挑战：① 流式内容持续增长导致页面高度变化，如果用户正在阅读上方内容会被推走；② 图片/代码块加载完成后高度突变；③ 引用来源、追问建议等延迟出现的区块插入导致跳动。解法：预留空间（骨架占位）、稳定容器高度、延迟插入的模块用固定占位。",
  "测量方式：实验室数据（Lighthouse）只反映加载阶段，AI 应用的重头戏在交互阶段——必须用真实用户监控（RUM）采集线上 INP（web-vitals 库上报）。",
  "AI 特有的新指标（应该自己定义）：TTFT 感知时间（用户点击发送到看到第一个字的时间）、流式流畅度（是否有卡顿/跳跃）、首字时间到完成时间的分布。这些比通用指标更贴近真实体验。",
  "优化闭环：设定目标（如 INP P75 < 200ms）、线上监控、性能预算（JS 体积上限）、CI 里的 Lighthouse 门禁。"
 ],
 follow:[
  "你们的 INP 实际是多少？最差的操作是哪个？",
  "流式渲染导致 CLS，具体怎么解决？",
  "除了标准指标，你会为 AI 应用定义哪些自定义体验指标？"
 ],
 fa:["具体数字我不想编，但我可以讲清楚大概的位置和怎么测。我们的 INP 通常控制在 100 到 200 毫秒区间，符合「良好」的标准；但这个数字是看 P75 而不是平均值，而且是在低端设备上。表现最差的操作几乎总是「发送第一条消息后的首次渲染」——因为它要同时做很多事：状态更新、Markdown 解析命中的第一个 chunk、语法高亮初始化、以及大量 DOM 插入；第二差的是「超长消息的滚动」，因为一屏内的 DOM 节点过多导致每次 layout 都很贵。这也是我为什么在方案里强调「惰性高亮」和「虚拟滚动」——这两个优化针对的就是这两处瓶颈。我还会补充一个被忽略的点：上报 Istanbul 这种最差操作时，我会按「操作类型」维度下钻，而不是只看一个总数，因为不同交互的瓶颈完全不同。最后我一定会强调用真实用户数据（RUM）而不是实验室数据来做判断，因为实验室环境通常设备更好、网络更快，会掩盖真实用户的体感。","解决 CLS 的核心思路是「预留空间」，让内容增长不推动已有元素。具体四招：一是给消息容器预设最小高度——比如一条 assistant 消息至少预留一行的高度，这样从「无」到「有」不会产生突变；骨架屏也算这一类，在没有内容时有占位，内容到达时是替换而不是插入。二是图片和代码块必须预留尺寸——用 aspect-ratio 和已知的宽高属性占住空间，避免加载完成后顶开布局；代码块首行未闭合时也要保持最小高度稳定。三是工具栏、免责声明这类「生成完成后才出现的 UI」要在开始前就占位或者用绝对定位浮层，而不是流式结束后从文档流里插进来把内容顶上去。四是自动滚动策略——如果用户正在向上阅读，不要强制性改变滚动位置；流式追加的内容只要在视口下方就不会造成可见的 CLS 计入，所以关键是维持用户的视觉锚点，用 overflow-anchor 属性配合。另外我会提醒：CLS 只统计「用户不期望的」布局偏移，所以用户主动触发的展开折叠不计入，这也意味着我们可以通过设计把这些偏移变成用户预期内的。","我通常会定义四类自定义指标，因为它们比标准指标更贴近 AI 产品的体感。第一类是「感知首响时间」——从用户点击发送到屏幕上出现第一个字的时间，它和 TTFT 的区别在于包含了前端渲染和网络传输，这才是用户真正感受到的东西；我会把它拆成服务端 TTFT 加前端渲染两个段以便归因。第二类是「有效内容时间」——出现有意义内容（比如第一个完整句子或者足够理解的一段）的时间，因为前几个 token 往往是「好的、」这类无意义词，用它更贴近真实体感。第三类是「生成速率」——每秒生成的字符数或 token 数，低于某个阈值时用户会觉得「卡住了」，这个指标对 Agent 类应用尤其重要，因为工具调用期间可能长时间无输出。第四类是「中断率」——用户主动停止生成的比例，它往往和答案质量、长度、或者速度慢高度相关，是很好的负向信号。此外我还会跟踪「追问率」和「 copied率」作为质量侧的间接指标。所有这些指标我都会按 P75 看并按设备、网络、模型维度下钻。"],
 pass:"能说出三个指标的含义。",
 good:"能把三个指标映射到 AI 应用的具体挑战（尤其 INP 被流式渲染拖垮、CLS 因内容增长而跳动），区分实验室数据与 RUM，并提出 TTFT 感知时间等自定义指标。",
 gl:"我先把三个指标映射到 AI 应用的具体挑战上。LCP 最大的挑战是「首屏不是静态内容」——AI 应用的首屏通常包含历史会话列表，需要从服务端拉取并渲染大量 Markdown，这会拖慢最大内容绘制；而且新会话的空状态和 welcome 文案如果设计不当，会让 LCP 元素变成一张大图。应对是服务端渲染或预取历史会话的首屏数据、给历史消息列表做懒加载、以及优化那个 greeting 区域。INP 是 AI 应用最容易崩的指标，因为流式渲染本质是在主线程上高频做重活——每来一个 token 就可能触发一次 Markdown 重解析、语法高亮和全量 DOM 更新，产生大量超过 50 毫秒的长任务，用户点击任何东西都得不到响应。所以对应的是那套节流加增量渲染加惰性高亮加虚拟滚动的组合。CLS 的挑战在于 LLM 输出长度不可预测——内容在持续增长，「生成完成后显示的工具栏」「延迟加载的图片」「插入的引用卡片」都会推动已有内容，造成布局偏移。解决靠预留空间和视觉锚定。我还想强调一个方法论上的点：一定要区分实验室数据和 RUM。实验室里用高端设备测出来的数字通常很好看，而真实用户可能在低端安卓机上、弱网环境下使用 AI 产品，两个环境差异常常是几倍；所以我会用 web-vitals 采集真实用户数据并按 P75 分位和设备分层来看，把性能预算做成发布门禁。最后是上面提到的自定义指标——感知首响时间、有效内容时间、生成速率、中断率，这些才是真正度量 AI 体验的东西。",
 red:"只背了指标定义，说不出 AI 场景下的具体问题；或从未实际测量过线上指标。"},

{cat:"前端",sub:"",diff:"进阶",type:"设计",tags:["代码复用","组件库","多产品线"],
 q:"多条产品线要复用同一套 AI 能力（对话、知识库、Agent），前端代码怎么组织？",
 intent:"考察复用架构设计能力，5 年经验应能设计中台化的前端资产。",
 ans:[
  "分层复用：① 基础能力层（headless）——把 AI 会话的核心逻辑（流式请求、消息状态机、重试、中断、历史管理）抽成与 UI 无关的 SDK / hooks（如 useChatSession）。这一层不含任何视觉，各产品线用自己的 UI 渲染。这是复用率最高的一层。",
  "② 组件层——提供带默认样式的组件（消息气泡、输入框、引用卡片、思考过程折叠），但允许通过插槽（slot）/ render props / compound component 深度定制。B 端产品尤其需要「风格可定制但逻辑统一」。",
  "③ 产品模板层——直接可用的完整页面（会话页、知识库管理页），用于快速起量。",
  "交付形态：私有 npm 包 + 版本语义化（SemVer）+ changelog；组件库用 Monorepo（pnpm workspace / Turborepo）管理多个包，配合 Changesets 做版本发布。",
  "样式隔离与主题：用 CSS 变量 + design token，各产品线通过覆盖变量换肤；避免强依赖某个 UI 框架（Ant Design / MUI），否则产品线技术栈不一致就集成不了——核心逻辑层必须零 UI 依赖。",
  "跨框架复用：如果产品线用了 React / Vue 两种技术栈，逻辑层用纯 TS 实现（框架无关），再各包一层适配（React hooks / Vue composables）。这是多技术栈组织的现实解法。",
  "与后端中台的配合：前端 SDK 对接统一的 AI 网关协议（而不是各产品线各对接一套后端），这样后端换模型/加能力时前端只需要升级 SDK 版本。",
  "治理：明确每个包的 owner、breaking change 流程（提前通知 + 提供 codemod 自动迁移）、使用率看板（知道哪些组件真被用了，哪些该废弃）。反面教训：做一个大而全但没人用的组件库，比不复用更糟。",
  "边界：不是所有东西都该复用。业务逻辑差异大的部分强行抽象会得到一堆配置项地狱。判断标准——「三处以上重复」才抽象，且抽象的是机制不是策略。"
 ],
 follow:[
  "产品线用 React 和 Vue 两种技术栈，怎么复用？",
  "抽象出来的组件没人用，或者各产品线都在提定制需求，你怎么应对？",
  "SDK 发 breaking change，怎么让产品线低成本升级？"
 ],
 fa:["这取决于复用的层次，我的建议是把复用下沉到「不依赖框架的那一层」。具体做法是：核心逻辑用纯 TypeScript 实现（状态机、会话管理、流式解析、协议适配、工具编排的客户端部分），完全不依赖 React 或 Vue；然后在其上做薄薄的框架适配层——React 用 hooks 封装、Vue 用 composables 封装，适配层通常只有几十行。这比「写两套」或者「强制统一技术栈」都现实。UI 组件层面跨框架复用就很难了，我的做法通常有两种：一是 UI 复用下降到设计层面——用统一的 design token 和 CSS 变量，两个框架各自实现组件但视觉和行为一致；二是用 Web Components 承载真正重度的交互组件（比如富文本编辑器、聊天气泡），虽然它在 React 生态里有些集成摩擦，但对复杂组件是值得的。组织上我会成立一个小团队维护这层，并且要求每次迭代必须在两种栈上都能跑通，避免退化成只服务一方。还有一个务实建议：如果产品线数量不多，先统一技术栈的成本可能比做兼容层更低。","这是组件库团队的经典困境，我会从根因入手。抽象没人用通常是因为「抽象过早或者过窄」——我坚持「三处重复才抽象」的判断标准：只有看到三个以上产品线有同一个明确需求时才抽，否则就是在替别人想象需求。已经抽象出来没人用，要诚实评估是不是该砍掉或者退回各产品线自己实现。应对定制需求泛滥我靠三个机制：一是配置优先于 fork——把常见的定制（颜色、文案、是否显示某个按钮、回调钩子）做成配置项和插槽，覆盖八成需求；二是明确的 slots/render props/GPL 扩展点让产品线能替换局部 UI 而不是整个组件；三是治理——设立 maintainer 角色和 RFC 流程，所有定制需求进来先判断是否具有普遍性，非普遍的引导走扩展点而不是进核心。还有一个很重要的反模式要避免：不要让产品线直接 fork 代码，一旦 fork 就永远合不回来。最后我会用「使用率」和「定制率」两个指标衡量这套东西健不健康。","我的做法是一套组合。第一是严格的语义化版本和废弃策略——breaking change 必须升大版本，废弃期至少给两个次版本的过渡时间，并且在此期间同时支持新旧两套 API，用警告告知。第二是提供 codemod——这是真正降低升级成本的关键：用自动化脚本（jscodeshift 之类）把旧 API 调用自动改写成新的，能覆盖八成以上的机械性改动，剩下的再人工处理；我会在发布说明里提供具体的迁移命令。第三是迁移指南和示例——一个 diff 级别的 before/after 例子比十页文档有用。第四是结构上的建议：让 breaking change 尽量小并且一次集中做完而不是分散在十个小版本里；以及把破坏性最强的部分做成可选包，老产品线可以继续用旧包，避免一次性迁移的爆炸半径。第五我会强调沟通节奏——提前至少一个版本预告，并在产品线同意的时间窗口执行，不要突然发布。最后一个经验：维护一个「版本分布看板」，知道各产品线现在在哪个版本，否则你的升级推动是没有依据的。"],
 pass:"知道要抽公共组件和 hooks。",
 good:"能给出 headless 逻辑层 / 组件层 / 模板层的三层复用结构，讲清零 UI 依赖与跨框架适配（纯 TS + 适配层）、design token 换肤、对接统一网关协议，以及 owner/codemod/使用率看板的治理机制与「三处重复才抽象」的判断标准。",
 gl:"我会用三层结构来组织复用，这个分层是这套方案的核心。最底层是 headless 逻辑层——用纯 TypeScript 实现，完全无 UI 依赖：包括与后端 AI 网关的协议对接、SSE 流解析、会话与消息的规范化状态管理、工具调用的客户端处理、错误重试和中断控制。这层的作用是让所有框架、所有产品线共享同一份「正确且难写」的逻辑，它是复用收益最大的部分，因为它包含了绝大部分的复杂度和 bug 风险。中间层是组件层——提供带样式和交互的 UI 组件，但要保证它对底层逻辑层是「寄生」而不是「内嵌」，同时用 design token 支持换肤，因为不同产品线一定会有视觉差异。最上层是模板层或场景层——针对具体场景（客服、知识助手、代码助手）给出开箱即用的组合，允许产品线 fork 修改，因为这一层本来就应该是可变的。跨框架适配的关键是底层做到零依赖：纯 TS 加一层很薄的 hooks/composables 适配通常只有几十行，比为每个框架重写一遍划算得多。治理机制我认为和技术同等重要：明确的 owner 和 maintainer 机制，否则没人维护； RFC 流程处理定制需求； codemod 加清晰废弃策略来应对 breaking change；以及一个使用率看板——知道每个产品线用了哪些组件、在哪个版本，这既是衡量价值的依据也是升级推动的依据。最后我会强调「三处重复才抽象」这个判断标准，过早抽象是组件库最大的浪费来源。",
 red:"复制粘贴代码到各产品线；或做一个大而全的组件库但没人用；抽象出配置项地狱。"},

/* ============ H. 后端与数据 ============ */
{cat:"后端与数据",sub:"",diff:"进阶",type:"设计",tags:["异步","长任务","超时"],
 q:"一次 AI 请求可能超过 60 秒，同步 HTTP 会超时，架构上怎么改？",
 intent:"AI 应用后端的第一道坎。考察异步化设计能力。",
 ans:[
  "不要试图把同步链路撑到 60 秒以上——网关、负载均衡、CDN、浏览器、移动端都有各自的超时，任何一个掐断都会导致用户白等。正确做法是异步化 + 流式。",
  "方案一 流式（首选，适合交互式场景）：服务端边生成边推送（SSE），连接持续有数据传输就不会触发空闲超时。用户立刻看到内容，体验最好。需要网关/代理放行长连接（关缓冲、调大超时）。",
  "方案二 异步任务（适合重任务、Agent 长流程）：请求进来 → 创建任务记录（状态 PENDING）→ 立刻返回 task_id → 后台 worker 处理 → 客户端轮询任务状态或订阅推送（WebSocket / SSE / 客户端回调 webhook）→ 完成后拉取结果。",
  "方案三 混合（长 Agent 任务的最佳实践）：异步任务 + 流式进度。返回 task_id 的同时，客户端通过 SSE 订阅该任务的进度事件流，既能看到「第 3/8 步」的实时进展，又不依赖单条长 HTTP 请求。",
  "任务系统要点：任务表（id、状态、入参、结果、重试次数、创建/更新时间、超时时间）；worker 用队列（Celery / BullMQ / SQS）；心跳与超时回收（worker 挂了的任务要能被重新捞起）；优先级与公平调度（避免大租户饿死小租户）。",
  "幂等与去重：用户重复点击提交要返回同一个 task_id（用入参哈希 + 用户 ID 做幂等键），而不是创建多个任务烧钱。",
  "取消：用户取消要能真正停掉后台任务（设置取消标志，worker 在每步检查），而不是让它继续跑完烧完预算。",
  "超时分层：API 网关超时 > 应用超时 > 上游模型超时，要逐级收敛且留余量（如网关 120s、应用 100s、模型 90s），否则会出现「应用还在跑但网关已经断开」的资源浪费。",
  "补偿：任务超时或失败后要有明确的终态，不能永远卡在 PENDING——用定时任务扫描超时未更新的任务并置为失败。"
 ],
 follow:[
  "worker 挂了，正在处理的任务怎么不丢？",
  "用户提交了任务然后关掉页面，任务还要继续跑吗？",
  "任务排队很久，用户怎么知道前面还有多少？"
 ],
 fa:["靠「任务状态外置加心跳回收」来保证不丢。核心设计是：任务的每一次状态变化都写入数据库的任务表（pending → running → success/failed），worker 不在内存里持有唯一真相；同时 worker 定期更新任务的 heartbeat_at 字段。当 worker 挂掉时，它的任务会停留在 running 状态且心跳停止，这时候由一个「补偿扫描器」负责发现——扫描所有 running 状态且心跳超过阈值（比如 90 秒）的任务，把它们重新放回队列。这里有三个关键点：第一是幂等——重放的任务必须能保证不会因为重复执行而产生副作用（比如重复扣费、重复发消息），所以每个任务要有幂等键，重放时先检查是否已执行。第二是部分结果的复用——如果一个大任务已经跑了一半，重跑时应该能从检查点继续而不是从头再来，这要求我们把长任务拆成可独立重试的小步骤并记录阶段性产物。第三是区分 worker 崩溃和任务本身失败：如果是任务本身有 bug 导致每次都失败，反复重放会造成雪崩，所以要限制重试次数并进死信队列由人工介入。最后要有告警——心跳停止的任务数、死信队列长度都是必须监控的指标。","要继续跑，而且这也是我认为更好的产品设计。理由有三：一是成本已经发生——一个五分钟的任务用户等了三分钟关页面，如果我们就此放弃，那这三分钟的算力和花费全浪费了；二是用户可能只是不小心关了或者想去做别的事，生成结果对他仍然有价值；三是这让产品的体验可以做成异步模式——用户可以提交多个任务去做别的事。工程上要实现它，关键是「任务生命周期与 HTTP 连接解耦」——流式连接可能断开，但任务在服务端继续推进，状态写入持久化存储，用户回来时按 task_id 或者消息 ID 查询就能看到最终结果，并配合推送通知（站内信、邮件、IM）告知完成。这里要考虑的几个点：一是用户明确点了「停止」的时候必须真的停止，这是用户的指令，需要 AbortController 加服务端中断信号传播，并且计费应该按已生成部分结算；二是要有任务的过期和清理，避免无人领取的结果长期占用存储；三是费用归属要明确——用户关了页面但任务仍在消耗，这个成本需要有预算控制。","关键是给用户「可感知的进度和明确的预期」，而不是让他盯着一个转圈。我的做法按精度递增：第一层是明确的位置反馈——「你前面还有 3 个任务」，这个数字来自队列的实际排队数据。第二层是时间预估——基于最近同类任务的平均处理时长给出「预计还需 2 分钟」，这个预估要随队列情况动态调整并且给一个区间而不是精确值，避免预估不准反而造成更大的失望。第三层是部分进度——这个最重要：长任务应该输出阶段性产物，比如「已完成第 3/10 步：正在分析第 4 份文档」，让用户看到它在确实地推进而不是在假转圈。产品上我会配套做三件事：一是异步化——提交后明确告知「预计 2 分钟，完成后通知你」，让用户去做别的；二是给出取消入口并且在取消时明确退还或不计费；三是优先级机制——付费用户或紧急任务可以插队，这既是产品分层也是止损手段。最后技术上要有队列长度和等待时间的监控告警，排队本身就是容量不足的信号。"],
 pass:"知道要用异步任务 + 轮询或推送。",
 good:"能给出流式 / 异步任务 / 混合三种方案及各自适用场景，讲清任务表设计、心跳回收、幂等去重、真正取消、分层超时收敛与超时补偿扫描。",
 gl:"我会给出三种方案并说明适用边界。第一种是流式——只要可能就应该用它，因为它对简单请求最快且体验最好；但它不能解决 60 秒以上的长 Agent 任务，而且一条 HTTP 连接终究有时长上限（网关、负载均衡、CDN 都会杀长连接）。第二种是纯异步任务——提交后立刻返回 task_id，前端断开或者轮询/WebSocket 接收结果；它适合真正的长任务，代价是架构复杂度和交互模式的改变。第三种是我最常用的混合模式：默认走流式，因为它能实时返回 token 并支持中断；当检测到任务可能超时（比如预计超过某个阈值或者 Agent 进入多步循环）就自动切换成异步——服务端返回一个 task_id 并把后续结果通过 SSE/WebSocket 推送或者通过轮询获取。落地上的关键设计我讲几点：任务表要记录状态机（pending/running/success/failed/cancelled）、重试次数、心跳时间、阶段性结果和 token 消耗；worker 故障靠「心跳加补偿扫描器」发现孤儿任务并安全重放，前提是任务幂等且能复用已完成的子步骤；用户关页面的场景默认继续跑（成本已发生且结果有价值），但用户主动停止必须真正中断并结算已用部分；排队体验要给位置、预估时间和阶段性进度三类信息，并把长交互设计成异步加通知。最后是分层超时——连接层超时（比如 60 秒）和业务层超时（比如任务总预算 10 分钟）要分开设计，前者触发转异步，后者触发收敛产出部分结果；同时要有超时补偿扫描兜住那些「卡住不返回」的调用。",
 red:"把网关超时调到 300 秒硬扛；任务没有超时回收导致永远 PENDING；重复点击创建多个任务。"},

{cat:"后端与数据",sub:"",diff:"进阶",type:"设计",tags:["任务队列","Celery","BullMQ"],
 q:"任务队列（Celery / BullMQ 等）如何做去重、优先级、超时杀死？",
 intent:"考察异步任务系统的工程细节把控。",
 ans:[
  "去重：① 提交时用「业务幂等键」（如 hash(userId + 任务类型 + 关键入参)）查是否已有未完成的同任务，有则直接返回原 task_id；② 用 Redis SETNX + TTL 做分布式锁防并发重复提交；③ 队列层去重（BullMQ 的 jobId 唯一性、Celery 配合 Redis 锁）。",
  "优先级：① 多队列按优先级分（high / default / low），worker 按权重消费（如 70% 资源给 high）；② 队列内优先级（BullMQ 的 priority 选项、Celery 的 priority 参数，注意 RabbitMQ 支持优先级队列而 Redis 实现有限）；③ 公平调度——按租户哈希分片或者用「租户级并发限制」，防止一个大租户的批量任务饿死其他人（这是 B 端场景的刚需）。",
  "超时：① 软超时——任务内自己检查已运行时长，接近上限时优雅收尾（保存已完成的部分）；② 硬超时——队列层配置（Celery 的 soft_time_limit / time_limit、BullMQ 的 timeout），超时后 worker 强制终止。软硬结合：软超时给任务留出保存现场的机会，硬超时是最后防线。",
  "杀死任务：硬超时杀死要确认进程真的被回收（Celery 用 SIGTERM 后 SIGKILL）；GPU 任务尤其要注意——杀死 Python 进程时 GPU 显存可能没释放干净，需要额外的清理逻辑。",
  "重试：区分可重试（网络、限流、临时资源不足）与不可重试（参数错误、业务规则拒绝）。指数退避 + 抖动 + 最大次数；失败进入死信队列（DLQ）供人工排查，不能静默丢弃。",
  "可观测：队列长度、等待时长（这是用户可感知的排队体验）、处理时长分布、失败率、重试率、DLQ 大小——这些都要有监控和告警。队列长度持续增长是最直接的容量不足信号。",
  "优雅停机：部署时 worker 要支持 graceful shutdown（不再接新任务、处理完当前任务再退出），否则每次发版都会杀掉一批正在跑的 AI 任务。",
  "AI 场景特化：任务要携带预算（最大 token / 最大金额），执行中累计消耗，超预算就中止并保存中间结果。"
 ],
 follow:[
  "队列堆积了几千个任务，你怎么快速止血？",
  "一个任务卡了 30 分钟（模型挂起不返回），怎么发现和杀掉？",
  "部署发版时怎么保证正在跑的任务不中断？"
 ],
 fa:["止血我按紧急程度和副作用从小到大做。第一步是先看清楚——确认堆积的原因是流量突增、worker 挂了、还是某个下游（模型服务）变慢；同时按队列分组看积压分布。第二步是快速止损：一是扩容 worker（如果是云上且有余量这是最快的）；二是对低优先级队列暂停消费，把资源集中给高优先级任务；三是拒绝而非堆积——设置一个「队列深度」阈值，超过就直接拒绝新任务并返回明确的排队提示，因为无限堆积只会让延迟失控并且越积越多，这是很重要的一条取舍。第三步是防雪崩——如果下游模型服务在变慢，要立刻熔断降级，否则重试和超时会让堆积加速。第四步才是扩容 compute 资源。最后在处理完之后我会做复盘：是否需要给不同队列设置独立的资源池和配额，是否需要更激进的自动扩缩容策略，以及是否需要给某些场景设置更短的 TTL——超过一定时间的排队任务直接废弃可能比执行更合理。","发现靠三层监控。第一层是任务级超时——每个任务在入队时带一个 soft_timeout 和 hard_timeout，worker 侧用一个独立的看护线程或定时器检查运行时长；soft 超时先尝试优雅中断（发出取消信号让 LLM 调用断开），hard 超时则直接杀进程或线程。这里的关键认知是：不能依赖模型接口自己的 timeout，因为它可能不完全可靠或者底层 socket 卡住。第二层是队列级的巡检——定期扫描 running 状态任务的运行时长，超过 hard_timeout 仍未心跳的判定为僵尸任务并回收。第三层是 worker 健康监控——CPU、显存、吞吐在一段时间内异常就不健康。杀掉之后要做的三件事很重要：一是资源清理——这是 GPU 场景特有的坑，被杀的进程如果没有释放显存，几轮下来显存就耗尽了，所以要用子进程隔离执行，杀的时候连进程组一起清掉，并验证显存确实释放；二是任务进入死信队列并告警，而不是静默丢弃；三是排查根因——如果是模型服务挂起，要在调用侧加更严格的超时避免持续占用 worker。","靠优雅停机加长任务设计。流程是：发布时先给旧的 worker 发送 SIGTERM，它接收到后立刻停止从队列拉取新任务（退出消费循环），但继续处理手上正在跑的任务；等宽限期（比如 graceful_timeout，通常给到最长任务的超时时间）结束后，仍未完成的任务被标记回滚队列，然后进程退出。这里的关键点有三个：第一，任务必须支持「重放安全」——被中断的任务要么幂等重做、要么能从检查点继续，所以发布前的任务设计要满足这个；第二，滚动发布而不是一次性全换，保证始终有可用性；第三，如果是 Kubernetes 环境要注意 terminationGracePeriodSeconds 必须大于 graceful_timeout，否则 pod 会被强杀导致优雅停机失效。另外一个微调的实践经验：给旧版本的 worker 打标签，让新提交的任务优先路由到新版本、老任务继续由老版本处理完毕，避免旧版本 worker 长时间无法下线。"],
 pass:"知道队列能做优先级和重试，知道要设超时。",
 good:"能给出幂等去重 + 分布式锁、多队列权重 + 租户公平调度、软硬超时结合与 GPU 显存清理、死信队列、优雅停机，以及 AI 场景的任务级预算控制。",
 gl:"在 AI 场景下队列的设计要点我按四个主题讲。第一是去重：AI 任务很贵，重复执行意味着真金白银的损失，所以我通常用「幂等键加分布式锁」双重保障——任务入队时携带业务维度的幂等键（比如 user+task_type+content_hash），用 Redis SETNX 抢锁，抢不到说明已有相同任务在处理就直接返回那个任务的结果；同时在数据库层对这个键加唯一索引作为最终保障，因为分布式锁有过期和失效的可能，唯一约束才是最后一道防线。第二是优先级：我用「多队列加权消费」——不同队列（付费/免费、实时/批处理）配置不同的 worker 数量和权重，而不是在单队列里做复杂的排序；同时要做租户公平调度，避免一个大租户把整个队列占满导致其他人饿死，常见的做法是限制单租户的在途任务数。第三是超时杀死：AI 任务必须用软硬两层超时——软超时（接近预算时）触发优雅收敛，比如让 Agent 停止开始新步骤并输出已有结果；硬超时则强制中断。这里有个 GPU 特有的坑：被杀的进程必须真正释放显存，所以我倾向用子进程隔离执行并在杀死时清理整个进程组，然后验证显存已释放；另外要进死信队列并告警而不是静默丢弃。第四我认为是 AI 场景特有的——任务级预算控制：每个任务携带 token 和费用预算，在工作流里持续累计消耗，接近预算时主动收敛，这比单纯的超时更贴合 AI 任务的成本模型。最后加一条队列健康度的可观测：积压深度、平均等待时间、重试率、死信数量都要有。",
 red:"任务没有超时也没有重试；失败任务静默丢弃；发版直接杀掉所有 worker。"},

{cat:"后端与数据",sub:"",diff:"基础",type:"设计",tags:["幂等","重复扣费"],
 q:"幂等性怎么设计？用户重复点击导致重复扣费怎么防？",
 intent:"后端基本功，但 AI 场景因为「昂贵且慢」而更加关键。",
 ans:[
  "定义：同一操作执行一次和执行多次，对系统状态产生的影响相同。AI 场景尤其重要——一次调用可能几毛钱，重复执行就是真金白银的损失。",
  "实现一 幂等键（Idempotency Key）：客户端生成唯一 key（或服务端用「用户ID + 操作类型 + 业务参数哈希」生成），服务端在处理前先查这个 key 是否已执行过——已执行就返回首次的结果，未执行则处理并记录结果。要注意并发：用数据库唯一索引或 Redis SETNX 保证同一 key 只被处理一次。",
  "实现二 数据库唯一约束：最可靠的兜底层。如「一个用户每天只能有一条签到记录」用 (user_id, date) 唯一索引；扣费用「订单号」唯一索引。数据库层面的约束不会因为应用逻辑 bug 而被绕过。",
  "实现三 状态机：把操作建模成状态流转（如 待支付 → 已支付），只在期望状态下才执行转换。用带条件的更新（UPDATE ... WHERE status='pending'），靠受影响行数判断是否成功。这是防重复扣费最经典的做法。",
  "实现四 Token 机制：进入操作页时服务端发一个一次性 token，提交时校验并作废（防表单重复提交，解决前端重复点击）。",
  "前端配合：按钮点击后立即置为 loading 并禁用（最简单有效）；但绝不能只靠前端——网络重试、用户刷新、多标签页、脚本调用都会绕过前端限制。",
  "分布式场景：本地锁无效，要用分布式锁（Redis Redlock 或数据库锁）。注意锁的粒度（按用户/按资源）、超时（防止死锁）、以及锁失效后的重试。",
  "扣费场景的完整链路：订单号唯一 → 状态机条件更新 → 幂等键去重 → 对账（每日跑批核对账实一致，这是最后一道防线）。任何一环都不能省。",
  "AI 场景特化：LLM 调用也应有幂等键——相同 prompt + 相同参数 + 相同模型版本在短时间内的重复请求，可以直接返回缓存结果，既防重复扣费又省钱。"
 ],
 follow:[
  "幂等键的过期时间设多久？太短会被绕过，太长占存储，怎么定？",
  "并发两个相同请求同时进来，都查到「没执行过」，怎么办？",
  "扣费成功了但返回超时，用户又点了一次，怎么防重复？"
 ],
 fa:["这个时间的确定要回到「幂等要防的是什么」上来。它防的是「同一个业务动作被重复执行」，所以要覆盖「用户可能重复触发同一意图的最长时间窗口」。我的判断依据有三：一是交互路径——用户从看到旧数据到再次点击的最长可能间隔，通常几分钟到几小时足够；二是系统重试窗口——网络层、消息队列、客户端的重试可能持续到几小时（比如某些队列的退避重试会到几小时），所以不能设太短；三是业务本身的语义——比如下单场景可以用订单号的生命周期作为幂等窗口，支付场景则常用 24 小时到 7 天。所以我的常用做法是给 24 小时作为默认，并针对场景调整：对账可对 T+1 的日切做兜底；高频低价值的（比如 AI 调用去重）可以短到几分钟存储压力也小。存储上不必担心太大——用 TTL 自动过期加定期归档，并且幂等记录本身很小（只有 key 和状态）；如果确实量大，可以按时间分表或者只存 (key_hash, created_at) 再定期清理。真正的原则我认为是：宁可长一点浪费存储，也不要短一点造成重复扣费，因为后者是不可逆的业务事故。","这是幂等设计里最核心的技术点，答案是「靠数据库的原子性而不是靠先查后写」。正确做法是把「检查」和「占位」合并成一个原子操作：一是用唯一索引加 insert——表上对幂等键建 UNIQUE 约束，两个并发请求同时尝试插入同一条记录，数据库保证只有一个成功，另一个捕获唯一键冲突就知道已有任务在执行，然后转为等待结果或直接返回成功；二是用 Redis 的 SETNX（key 存在则返回失败）抢占标记并设置过期时间；三是用条件更新——UPDATE ... WHERE idempotency_key = ? AND status = 'init'，通过受影响行数判断是否抢到。绝对不能做的事是「先 SELECT 查有没有，没有就 INSERT」，因为在两步之间存在竞态窗口，高并发下必然出问题。还有一个细节：如果任务执行时间较长，需要用状态机——INIT → RUNNING → SUCCESS/FAILED，抢到执行权的那个把状态改成 RUNNING，另一个查到 RUNNING 就轮询等待而不是重复执行；如果 RUNNING 太久（超过心跳）则由补偿逻辑接管。最后提醒：依赖 Redis 也要考虑它的持久化和主从切换可能丢标记，所以核心支付场景我一定用数据库唯一约束做最终防线。","这正是「幂等键加状态机」要解决的场景，也是最容易被误判为已解决的问题。用户第二次点击时，如果我们的幂等键设计正确（同一次业务的意图对应同一个键，比如同一个订单的支付），那么这次点击会命中已有的幂等记录——状态是 RUNNING 或者 SUCCESS，客户端直接返回「处理中」或者首次的执行结果，不会再扣一次。关键在于「幂等键必须由客户端在第一次发起时就生成并在重试时复用」，而不是每次点击都生成新的；所以我会让前端在用户进入支付页时生成一个一次性 token，后续所有重试都带它。第二个关键是服务端要把「扣费」和「返回结果」解耦——即使返回超时，服务端该次扣费应该已经完成并写入幂等记录（成功状态），后续同 key 的请求只会返回这个结果。第三是最后一道防线：对账——无论幂等做得多好，我都会让财务侧每日和支付渠道做一次对账，因为幂等只能防构造正确的重复，防不了分布式事务下的数据不一致。最后我要强调这条经验：凡是涉及钱的场景，都必须假设幂等可能失效，用对账和人工兜底做最后一道防线。"],
 pass:"知道用唯一索引和状态机防重复。",
 good:"能给出幂等键 + 唯一约束 + 状态机条件更新 + 一次性 token 的四层设计，讲清并发下的原子性保证（唯一索引/SETNX）、分布式锁要点，以及「对账」这个最后防线，并能映射到 AI 调用的缓存去重。",
 gl:"我会把它设计成四层防线，从外到内层层收敛。第一层是幂等键：由调用方（客户端或上游服务）在发起业务时就生成一个唯一的一次性 token 或业务键（比如 user_id + order_id + operation_type），并且规定「重试必须复用同一个键」。这一层的价值是把「重复」这件事在最外层就识别出来。第二层是数据库唯一约束：在幂等表上对幂等键建 UNIQUE 索引——这是整套设计里唯一真正的硬保障，因为分布式锁和缓存都可能失效。第三层是状态机加条件更新：任务表设计成 INIT → RUNNING → SUCCESS/FAILED 的状态机，抢执行权用条件更新 UPDATE ... WHERE key=? AND status='INIT' 并通过受影响行数判断是否抢到，这个原子操作解决了「并发下两个请求都查到没执行过」的问题；另一个并发者查到 RUNNING 就转为轮询等待结果。这里我要明确指出「先 SELECT 再 INSERT」是错误的，因为它有竞态窗口。第四层是分布式锁的取舍：它可以用来快速失败降低数据库压力（用 SETNX 加过期时间），但我绝不把它作为唯一保障，因为存在锁过期、主从切换丢标记等风险——业务上的硬保障必须落在数据库约束上。把这些映射到 AI 调用也类似——同一个 (prompt_version + input_hash + model) 的重复请求用同样的键做去重，避免为同一个请求付两次钱。最后我会强调一条常常被忽略的防线：对账。幂等做得再好，在分布式环境下也有数据不一致的可能，所以涉及资金的场景一定要有日终对账作为最后兜底；以及要结合「请求幂等」之外的「业务幂等」，比如在账户侧用流水表和余额的勾稽校验来兜。",
 red:"只靠前端禁用按钮防重复；或认为加个 Redis 锁就够了，说不出状态机和数据库约束的价值。"},

{cat:"后端与数据",sub:"",diff:"进阶",type:"设计",tags:["数据建模","存储","分库分表"],
 q:"AI 应用中，会话、消息、文档、向量、这些数据的存储怎么设计？什么时候需要分库分表？",
 intent:"考察数据建模能力，AI 应用的数据结构有其特殊性。",
 ans:[
  "关系库（Postgres / MySQL）——存结构化主数据：租户、用户、会话（id、标题、创建时间、最后活跃）、消息（id、会话ID、角色、内容、token数、模型、耗时、点踩状态）、文档元数据（id、租户、来源、状态、版本、切片数、解析信息）、任务、配额与计费记录。",
  "消息表设计要点：消息是写多读多、量最大的表。要带 tenant_id（便于隔离与归档）、session_id 索引、created_at 索引；内容字段可能很大（长回答），考虑用 TEXT 而非 VARCHAR；把「生成元数据」（模型、token、成本、延迟、trace_id）单独放一列 JSON 或独立表，避免主表过宽。",
  "向量库——只存向量 + 少量元数据 + 回表用的 ID。不要在向量库里存完整原文（浪费且难同步），原文和元数据放关系库/对象存储，检索后用 ID 回查。元数据里必须带 tenant_id、doc_id、status、版本、生效时间，用于过滤。",
  "对象存储——原文档（PDF/图片）、解析后的中间产物、用户上传的附件。关系库存 URL 与元信息。",
  "缓存（Redis）——会话草稿、流式中间态、语义缓存、限流计数、embedding 缓存。",
  "向量与关系库的一致性：这是最容易出问题的地方。用「文档状态机 + 映射表」维护 doc → chunks → vector_ids 的关系，删除时批量精确删除；定期做一致性巡检（对比关系库里的文档数和向量库里的向量数，发现孤儿数据）。",
  "分库分表时机（不要过早）：单表行数超过千万到几千万、且索引和查询优化已经做到位仍然慢；或写入 QPS 超过单库承载能力。AI 应用的消息表最容易先到瓶颈。",
  "分片策略：优先按 tenant_id 分片（B 端 SaaS 天然适合，且查询几乎都带租户条件）；其次按时间（消息表按月/季度分区，冷数据归档）。避免按 session_id 哈希——会导致按用户的查询要跨分片。",
  "更轻量的先手：在分库分表之前，先做——分区表（Partition）、冷热分离（3 个月前的会话归档）、读写分离、索引优化、以及大字段垂直拆分。这些成本低得多。",
  "ES/搜索：如果需要全文检索历史消息或文档，用 ES 同步一份索引，而不是在关系库上做 LIKE 查询。"
 ],
 follow:[
  "向量库和关系库数据不一致（有孤儿向量），怎么发现和清理？",
  "消息表一个月涨 5000 万行，你的演进路线是什么？",
  "多租户下，你怎么保证一个租户的查询绝对拿不到另一个租户的数据？"
 ],
 fa:["孤儿向量是必然会出现的产物——embedding 写入成功但元数据表写入失败、删除文档时向量库部分失败、或者重建索引中途挂掉，都会留下不一致。发现靠「一致性巡检」——定期对比三方的计数和 ID 集合：source 文档表的业务 ID 集合、chunk 映射表里的 chunk ID 集合、以及向量库里的 vector ID 集合；差异就是孤儿或者缺失。具体实现我会用一个离线任务按 tenant 和 document 分批做比对，把差异写进一张「不一致明细表」并触发告警。这里的关键前提是「映射表」必须存在——也就是 doc_id 到 chunk_id 到 vector_id 的显式记录，没有它就无从比对。清理上我要强调一个重要原则：清理前先做「软标记」而不是直接物理删除——先把可疑的孤儿标记为 inactive 并做检索侧的过滤观察一段时间，确认没有问题再物理清理，避免误删造成不可逆的损失。另外我还会做「写入顺序」的优化——先写可靠存储再写向量，让不一致始终表现为「缺向量」（可重试补）而不是「多向量」（难发现）。","我会按阶段演进，而不是一上来就分库分表。第一阶段（千万级以内）先在同一个库里做分区：按时间做 RANGE 分区并按 tenant_id 做子分区，配合历史数据的归档和冷热分离——热数据（最近三个月）留在主表，冷数据归档到独立的存储（比如数据仓库或者便宜的对象存储加索引），查询时按时间范围路由。第二阶段做读写分离和垂直拆分：把消息正文这种大字段拆到独立的表甚至独立的 KV 存储，让主表变窄从而索引和扫描都更快。第三阶段才是水平分片：按 tenant_id 或 user_id 哈希分片（选择 tenant_id 的优点是天然隔离且便于单租户的数据管理，缺点是大租户会造成数据倾斜，所以我通常用「tenant_id 加时间」的复合分片键，或者对超大租户单独成 shard）。到这一步我会考虑用分布式数据库（如 TiDB、CockroachDB）或者中间件来降低运维复杂度。另外我会强调两个一定要提前做的事：一是所有查询必须带分片键避免全片广播；二是冷热分离要尽早做——因为绝大部分查询集中在最近数据，这一步的性价比远高于分库分表。还有，历史消息的检索要独立落到搜索或向量库而不是数据库 LIKE。","我的原则是「不依赖单点过滤，用多层冗余」。第一层是应用层每个查询都要带 tenant_id——这是最基本的，但我从不把它作为唯一保障，因为总会有一处遗漏。第二层也是最关键的一层：把隔离下沉到底层做强制。关系库用行级安全策略（PostgreSQL RLS），在数据库会话里绑定当前租户上下文，任何不满足条件的行在存储引擎层就被过滤掉；向量库用命名空间或分区（namespace/collection per tenant 或者 partition filter），让查询物理上不可能拿到别的数据；对象存储用路径前缀加 IAM 策略隔离。第三层是共享组件的键必须带租户：缓存键、队列 topic、artifact ID 都要包含 tenant_id，这是最容易被忽略的泄漏点——我记得前面也提到语义缓存如果没有租户维度就会跨租户命中。第四层是两个特殊地带：工具调用要按租户隔离凭证和权限（不能让 A 租户的工具访问 B 租户的系统），以及日志和 trace 系统本身要做可见性隔离。最后我会做定期的越权渗透测试——写一个自动化测试用 A 租户的身份去尝试访问 B 租户的数据并在所有接口上验证，这比代码评审可靠得多。"],
 pass:"知道消息/会话放关系库、向量放向量库、文件放对象存储。",
 good:"能讲清各存储的职责边界、向量库只存 ID 与过滤元数据、doc→chunk→vector 映射与一致性巡检、按 tenant_id 的分片策略与冷热分离等先手优化，以及租户隔离的强制过滤。",
 gl:"我会先讲清楚各类存储的职责边界，混乱往往源于职责不清。关系型数据库存「强一致、需要事务、需要关联查询」的业务数据：租户、用户、会话、消息的元数据、任务状态、账单和权限；它是唯一真相来源。对象存储存原文文件和中间产物（原始 PDF、解析后的结构化 JSON、生成的图片），因为它便宜且适合大文件，数据库里只存指针。向量库存「向量加最小必要元数据」——这是我的一个明确原则：只存 vector_id、doc_id、chunk_id 和少量用于过滤的字段（tenant_id、权限标签、时间），不要尝试把正文塞进元数据里，因为大 payload 会拖垮检索性能和存储；正文按需从关系库或对象存储按 ID 取。缓存存热点和去重。这里有一条关键的工程约束：doc → chunk → vector 的映射必须在关系库里有显式记录并支持反查，否则删除时连 ID 集合都拿不到，也没法做一致性巡检。演进上我会按这个顺序走：先加索引和查询优化 → 按时间和租户做分区并做冷热分离（这个性价比最高，因为查询高度集中在最近数据）→ 大字段垂直拆分 → 最后才做按 tenant_id 的水平分片，并用分布式中间件降低运维成本。同时我会强调几个必须提前埋好的伏笔：所有查询天然带租户维度、向量库的元数据里必须有 tenant_id、共享组件的键必须含租户。最后多租户隔离的正确做法是「下层强制」而不是「上层自觉」——用数据库的 RLS 和向量库的命名空间让越权在存储层就失败，并且定期做越权渗透测试验证，因为任何散落在应用层的过滤条件都一定会有一处被遗漏。",
 red:"把所有数据（包括原文和完整元数据）都塞进向量库；没有一致性巡检；一上来就分库分表。"},

{cat:"后端与数据",sub:"",diff:"进阶",type:"设计",tags:["缓存","语义缓存","命中率"],
 q:"LLM 结果的缓存 key 怎么设计？命中率怎么提升？",
 intent:"考察缓存设计的严谨性。AI 缓存的最大风险是「返回了不该复用的答案」。",
 ans:[
  "精确缓存：key = hash(model + 模型版本 + 完整提示词 + 解码参数)。必须包含解码参数（temperature、top_p 等）——同样的提示词 temperature=0 和 0.8 结果完全不同。还要注意 temperature > 0 时缓存的意义有限。",
  "模型版本是关键：商业 API 的 latest 指针会静默升级，如果用 latest 做缓存 key，模型变了缓存还在命中，等于在骗自己。必须用具体的版本号/快照日期。",
  "语义缓存：key 不是字符串而是 query 的 embedding，通过向量相似度检索（阈值通常 0.92–0.97）找可复用的历史答案。",
  "语义缓存的复合条件（最重要）：光 query 相似不够，还必须同时满足——① 提示词版本相同；② 模型版本相同；③ 知识库版本/数据状态相同（RAG 场景下文档更新了，旧答案就失效）；④ 用户/租户的权限范围相同（不能把 A 租户的答案给 B 租户，这是严重的数据泄露）；⑤ 未过 TTL；⑥ 无个性化上下文差异（如用户画像不同）。任何一条不满足都不能命中。",
  "失效策略：知识库文档更新时，要能主动失效相关的缓存。做法是在缓存条目上记录它「依赖了哪些 doc_id」，文档更新时按 doc_id 反查失效；做不到精确失效就依赖短 TTL + 知识库版本号参与 key。",
  "提升命中率的手段：① Query 归一化（去空格、繁简转换、同义改写归一、去除礼貌用语「请帮我…」）；② 分离「可变部分」——把系统提示词、RAG 内容这些固定部分与用户变量分开，让语义缓存只比对用户意图；③ 提高阈值同时用 rerank 二次确认，避免误命中；④ 针对高频 FAQ 预热缓存；⑤ 分层缓存——先查精确缓存（最快最便宜）再查语义缓存。",
  "不该缓存的：时间敏感（「今天…」「最新…」）、个性化强的、随机创作类（写诗、起名）、单次会话依赖上下文的多轮中间轮次（只缓存首轮）。",
  "度量：命中率、误命中率（需要人工抽检或用户对缓存答案的点踩率单独统计）。只看命中率而不看误命中率是危险的——缓存把错误答案复用千次的损失远大于收益。",
  "成本收益：语义缓存本身要跑一次 embedding（有成本），命中率低于 5% 时可能不划算，要算清楚。"
 ],
 follow:[
  "怎么检测缓存误命中？",
  "知识库更新后，缓存怎么失效？精确失效做不到怎么办？",
  "你们的实际命中率是多少？什么场景最高？"
 ],
 fa:["我把它叫做「误命中率」，这是缓存体系里最容易被忽略但最危险的指标——因为它会静默地给错误答案。检测方法有几种：一是埋线上反馈信号，如果缓存命中的请求点踩率或追问率显著高于未命中的请求，就说明有问题；这是最真实但滞后的信号。二是事后一致性校验，在命中缓存返回后，异步地把这次请求重新走完整链路（影子模式）跑一遍，对比两者答案的一致性，不一致就记为疑似误命中并告警；成本略高但对高风险场景值得。三是定期用评测集验证——在评测集上用缓存跑一遍再用无缓存跑一遍，比较得分差异，这是最直接的离线度量。另外我会主动分析：哪些类型的 query 天然不适合缓存（含「今天/现在/最新」这类时间词、含个人代词、以及多轮依赖上下文的），在缓存前就把它们屏蔽掉。最后我会明确：误命中率比命中率更重要，一个命中率 60% 但误命中率 5% 的缓存系统,危害大于收益，我会果断降低缓存范围。","精确失效的前提是「你知道答案依赖了什么」。所以我的设计是：缓存记录里保存这次生成所引用的 doc_id / chunk_id 集合。当某个文档更新时，用一条「反向索引」（doc_id → 依赖它的 cache keys）主动把这些缓存删除，这就是精确失效。但这个反向索引本身有维护成本，且在知识库变更频繁时会退化，所以要有降级方案。做不到精确失效时的三种兜底：一是「版本号做前缀」——缓存键里携带知识库版本号或索引版本号，版本一升，旧版本的缓存虽然在物理上还在但永远不会被命中（相当于逻辑失效），这是一种非常廉价且可靠的方式，代价是会损失一部分命中率；二是 TTL——按数据的更新频率给不同层级的 TTL，高频更新的知识库用很短的 TTL；三是时间衰减——命中缓存时先检查引用的文档最后更新时间是否晚于缓存创建时间，晚于就判定失效重新生成。我通常会把「版本号前缀」作为主方案、「TTL」作为兜底。","这个数字完全取决于产品形态，所以我会先讲规律再给区间。规律是：命中率高低主要由「请求的重度」和「缓存键的严格程度」决定。命中率最高的场景通常是三类——第一是 FAQ 型企业知识库，用户问的问题高度重复（「报销流程是什么」「年假怎么算」），这类我用过的能达到 30% 到 50% 的效果很好的水平；第二是固定任务的结构化输出，比如文档摘要、实体抽取、分类打标，输入固定则输出基本确定；第三是批处理场景，比如对一批文档做同样的操作。反过来命中率最低的是开放式创作和多轮深度对话——因为每次输入都不同，这类通常在 5% 以下。另外我会明确：数字要建立在对「缓存」的定义上——如果只算精确缓存（完全相同的输入），命中率通常很低；真正有意义的是语义缓存（相似 query 复用答案），但它也带来误命中风险，所以必须配误命中率指标。我的建议是对不同场景分开统计命中率和误命中率，用一个「净收益」来判断，而不是笼统地追求高命中率。"],
 pass:"知道缓存 key 要包含模型和参数，知道有语义缓存。",
 good:"能给出语义缓存的六项复合条件（尤其知识库版本与租户权限）、基于 doc_id 依赖的主动失效、提升命中率的归一化与分层策略、不该缓存的场景，以及「误命中率」这个被忽视的关键指标。",
 gl:"我先说清楚设计原则：缓存键必须是「决定输出的全部变量」的函数，而不是只由 query 决定。针对语义缓存，我的复合键包含六项——归一化后的 query 语义、提示词模板版本与渲染后的 prompt 哈希、模型与版本、知识库/索引版本、租户与权限标签、以及影响输出的业务参数（比如时间范围、目标语言）。其中最容易被漏掉也最致命的是「知识库版本」和「租户权限」：漏了前者会在知识库更新后持续返回过期答案，漏了后者会造成跨租户的数据泄漏——这不是缓存失效这么简单，是安全事故。提升命中率我从两手入手：一是 query 归一化——去掉礼貌用语和无意义修饰（「请问」「帮我看一下」）、同义改写归一、繁简和标点统一、以及把「上周/上個月」这类相对时间解析成绝对时间范围，这些处理能显著增加语义层面的重合度；二是分层——把固定的 system prompt 和工具定义做成公共前缀，让变量部分变小，同时按场景分别设策略（高频 FAQ 用激进策略、专业垂类用保守策略）。失效策略我用「主动失效加版本号前缀」：缓存记录里保存它依赖的 doc_id 集合并维护反向索引，文档更新时精确清除；做不到精确就用版本号前缀做逻辑失效加 TTL 兜底。不该缓存的场景我也一定要点出：含「现在/今天/最新」这类时间敏感词、带个人信息或个性化的内容、多轮强依赖上下文的请求、以及高风险领域（法规、医疗、财务数据）。最后强调那个被忽视的关键指标——误命中率，它是比命中率更重要的健康度指标。",
 red:"只用用户问题字符串做 key 做精确缓存；或用 latest 模型版本做 key；语义缓存不考虑租户隔离和知识库版本（会导致数据泄露和过期答案）。"},

{cat:"后端与数据",sub:"",diff:"进阶",type:"设计",tags:["分布式锁","并发"],
 q:"多人同时编辑同一个知识库 / 触发同一个重建索引，并发怎么控制？",
 intent:"并发控制的经典问题，AI 场景的代价更高（重建索引很贵）。",
 ans:[
  "先分类：① 幂等的、可重入的操作（重复触发重建索引）——只需要去重，不需要互斥；② 有状态冲突的操作（同时修改同一篇文档）——需要互斥或冲突检测；③ 需要顺序保证的（先删除后重建）——需要串行化。",
  "分布式锁（Redis）：用 SET key value NX PX ttl 获取锁，value 存唯一标识（防误删别人的锁），释放时用 Lua 脚本比对 value 再删（这是必须的，直接 DEL 会误删）。锁必须有过期时间防死锁。",
  "锁的粒度：按资源粒度加锁（doc:{id}、kb:{id}）而不是全局锁，否则并发度会极差。",
  "锁超时问题：任务执行时间超过锁 TTL 会导致「锁失效了但任务还在跑」，另一个请求拿到锁开始并发操作。解法：① 用 Redisson 的 watchdog 自动续期；② 或改用「租约 +  fencing token」（每次获取锁返回递增序号，操作时校验自己的 token 仍是最新，旧的直接拒绝）——这是更严谨的方案。",
  "替代方案（常常更好）：① 数据库乐观锁——加 version 字段，UPDATE ... WHERE version = N，影响行数为 0 说明被改过，让客户端重试或提示冲突。适合「编辑冲突」场景，比分布式锁简单且无死锁风险。② 数据库唯一约束做幂等/去重。③ 状态机 + 条件更新——只有 status=IDLE 才允许发起重建，天然去重。",
  "重建索引这类重任务：更适合用「任务去重 + 队列串行」而不是锁——同一个知识库同时只跑一个重建任务（用队列的 jobId 唯一性或数据库唯一约束），后来的请求返回已有任务的 ID 让前端订阅进度，而不是阻塞或拒绝。",
  "冲突提示（B 端协作场景）：多人同时编辑同一文档时，除了技术手段还要有产品方案——实时协同（CRDT/OT）或者「检测到他人正在编辑」的提示 + 覆盖警告。",
  "可观测：锁等待时间、锁获取失败率、任务排队时长——锁竞争激烈说明粒度设计有问题。"
 ],
 follow:[
  "锁过期了但任务没跑完，另一个请求进来了，怎么防？",
  "什么时候用乐观锁，什么时候用分布式锁？",
  "Redis 主从切换导致锁丢失，怎么办？"
 ],
 fa:["这是分布式锁的经典陷阱，需要用两个机制来保证。第一是「续期机制（watchdog）」——Redisson 这类实现就是这个思路：锁持有期间由一个后台线程周期性延长过期时间，只要持有者进程还活着锁就不会过期；同时要设置合理的续期间隔（远小于过期时间）。第二是「fencing token」——这是更彻底的保障：每次获取锁时拿到一个单调递增的令牌（用 Redis 的自增序号或者数据库版本号），持有者在每次写操作时带上这个令牌，存储侧校验「当前令牌必须大于等于上一次见到的令牌」才允许写入；这样即便旧持有者的锁过期了别人已经接手，旧持有者后续的写操作会因为令牌落后而被拒绝。这里要点明本质：分布式锁本身解决的是「互斥」而不是「正确性」，真正保证正确性的是资源侧的 fencing 校验。另外务实的补充是：如果任务确实可能跑很久，应该在开始时就评估任务并设置充裕的过期时间，以及在锁释放时用 Lua 脚本校验 value（只有持有者才能删除自己的锁，避免误删别人的锁）。最后我一定会加告警：锁过期事件必须被监控到，因为它是并发异常的强信号。","我的判断标准是「冲突的成本和频率」。乐观锁适合冲突比较少、且重试成本低的操作——典型是短事务的更新操作，比如更新一条消息的状态；它的优势是无中心依赖、性能高、不会死锁，实现上用 version 字段做 CAS 更新即可。分布式锁适合冲突代价很高、必须要严格的互斥才能安全的场景——比如「同一个文档的重建索引」这种绝对不能并发执行的操作，或者需要跨多个资源保证原子性的场景。但我要强调一个重要观点：很多时候我们并不需要分布式锁，有更好的替代方案。比如「去重」可以用唯一索引或者 SETNX，「串行」可以用消息队列让任务天然排队而不是抢锁，「互斥」可以用数据库的状态机把 CPU.conditional update。所以我的默认次序是：先用数据库的原子操作（唯一约束、条件更新）→ 再用队列串行化 → 最后才考虑分布式锁。分布式锁引入了新的依赖和失效模式，能不用就不用。还有一个原则：如果要用锁，粒度要尽可能小（锁单个文档而不是整个知识库），并且必须带 fencing 校验。","这是 Redis 分布式锁的理论缺陷——异步复制下主节点写入的锁还没同步到从节点就宕机，从节点升主后锁就「消失」了，另一个进程可以同时获得锁。应对有三个层次：第一是认知层面——接受单机/主从 Redis 的锁「能提供的是效率而非正确性」，所以凡是涉及资金、数据安全的场景，必须在资源侧加 fencing token 或唯一约束作为正确性保障，这是 Martin Kleppmann 那篇经典文章的核心观点。第二是工程层面——用 Redlock（向多个独立 Redis 实例获取多数派）可以在一定程度上缓解，但它同样有争议并且运维复杂度高，我的态度是谨慎使用。第三是更务实的替代：如果只是做「去重」和「避免重复执行」，用数据库的唯一索引就够了并且正确性有保障；如果是「互斥执行某个任务」，用数据库的排他锁或者把状态写进表里做条件更新（UPDATE ... WHERE status='idle'），由数据库的事务保证互斥。我的总体倾向是：Redis 锁用于「降低无谓的重复工作」这类容错场景，数据库的事务和约束用于「必须正确」的场景。另外所有锁操作必须要有超时和告警监控。"],
 pass:"知道用 Redis SETNX 加分布式锁，知道要设过期时间。",
 good:"能区分去重/互斥/串行三类需求，讲清 Lua 脚本防误删、watchdog 续期与 fencing token、以及用乐观锁/状态机/队列去重替代分布式锁的更优方案，并能给出重建索引应按「任务去重 + 订阅进度」来做的正确设计。",
 gl:"我先把需求分清楚，很多并发问题之所以设计出错是因为把三类需求混为一谈。第一类是「去重」——同一个操作不需要执行两次（比如用户手抖点了两次重建），这类用幂等键加唯一索引解决最合适。第二类是「互斥」——同一资源同一时刻只能有一个操作（比如并发编辑同一份文档的元信息），这类才需要锁。第三类是「串行」——多个操作必须按顺序执行（比如同一个文档的多轮索引更新），这类用消息队列排队比用锁更自然。回到重建索引这个具体场景，我认为正确的设计其实是「任务去重加订阅进度」而不是抢锁：用户触发重建时先查有没有针对同一 document 的在途任务，有就直接返回这个任务 ID 让前端订阅它的进度，没有才创建任务并入队，任务的去重靠数据库唯一约束保证；这样既不重复执行、也不需要维护脆弱的锁状态，还能给用户实时进度。如果确实要用分布式锁，我讲三个必须的工程要点：一是释放锁必须用 Lua 脚本校验持有者身份，防止误删别人的锁；二是要有 watchdog 续期机制覆盖长任务，并且在任务真的卡住时不能无限续期；三是 fencing token 保证正确性——获取锁时拿到单调递增令牌，资源侧校验令牌落后则拒绝写入。最后我会强调一个替代思路：能用状态机加队列解决的问题不要引入锁，因为锁带来的是一个有状态依赖，它的失效模式远比数据库约束复杂。至于 Redis 主从切换丢锁的问题，我的立场是：接受它是「效率工具」而非「正确性保证」，正确性必须由资源侧的约束兜住。",
 red:"直接用 DEL 释放锁（可能删除别人的锁）；锁没有过期时间导致死锁；所有并发问题都上全局锁。"},

{cat:"后端与数据",sub:"",diff:"进阶",type:"设计",tags:["文件上传","异步解析","状态机"],
 q:"用户上传 100MB 的 PDF，怎么做到断点续传 + 异步解析 + 状态可查？",
 intent:"考察文件处理 pipeline 的完整设计，知识库产品的必备能力。",
 ans:[
  "上传环节：不要用普通表单直接 POST 大文件（超时、内存爆、失败重来）。用分片上传——前端把文件切成 5–10MB 的片，支持并发上传、失败重试单分片、前端记录进度；服务端按 (文件哈希 + 分片序号) 存片，全部到齐后合并。",
  "秒传：先算文件哈希（前端算或前后端配合，大文件用抽样哈希提速），服务端查到已存在就直接返回成功，省掉整个上传过程。",
  "断点续传：上传前先查「这个文件已上传了哪些分片」，只传缺失的。前端要把进度持久化到 localStorage，用户刷新页面也能续传。",
  "直传（性能与成本最优）：服务端签发一个有时效的对象存储预签名 URL（S3 Presigned / OSS STS），前端直传到对象存储，不走应用服务器。这样不占用服务器带宽和资源。上传完成后通知服务端登记。",
  "安全：文件哈希校验、类型校验（不能只看扩展名，要检查 magic number）、大小限制、病毒扫描、限制可上传的租户配额。预签名 URL 要限制路径和大小。",
  "异步解析：上传完成后立即返回 file_id 并把解析任务丢进队列（状态 PENDING）。worker 做：格式识别 → 解析 → 清洗 → 切分 → embedding → 写库。每步更新状态与进度百分比。",
  "状态机：UPLOADING → UPLOADED → PARSING → CHUNKING → INDEXING → READY / FAILED（带失败原因）。前端通过轮询或 SSE 订阅进度。状态要落库，服务重启不丢。",
  "失败处理：解析失败要给出具体原因（加密 PDF、损坏、页数超限、不支持的格式），提供重试；重试次数上限，进 DLQ 供排查。",
  "大文件特有问题：页数极多（500 页）解析耗时长，要分片并行处理；扫描件走 OCR 更慢；单个文档产生几千个 chunk 时，embedding 要批量 + 限流（避免打爆模型服务）。",
  "清理：上传中断产生的孤儿分片要定时清理；解析失败的中间产物也要清理，否则存储成本会悄悄涨上去。"
 ],
 follow:[

  "500 页的 PDF 解析要 10 分钟，用户等不了，怎么给反馈？",
  "怎么防止有人传恶意文件（超大、木马、伪装类型）？"
 ],
 fa:["断点续传靠分片上传实现。流程是：客户端计算文件的哈希并按固定大小（比如 5MB）切分成多个分片，每个分片单独上传并带上自己的序号；服务端为每个文件维护一个「已上传分片」的记录。断网恢复后，客户端先调用一个查询接口问服务端「这个文件我已经传了哪些分片」，服务端返回已完成的分片编号，客户端只重传缺失的部分。这里有几个关键的工程细节：一是文件的唯一标识要用内容哈希（前端计算 MD5 或 SHA-256）而不是文件名，这样还能顺带实现「秒传」——如果服务端已有相同哈希的文件就直接返回成功，这是我们在这个场景下能做的最有价值的优化；二是分片要支持并发上传提升速度，但要限制并发数避免打满带宽；三是要有重试和幂等——同一个分片重复上传不会造成数据错乱。另外我会提醒云端有大文件 MD5 计算的性能问题，通常用抽样哈希（抽取文件头尾和中间若干段）来做快速去重。最后由服务端负责把全部分片合并成完整文件，并且要有完整性校验。","这是典型的长任务反馈设计，靠三点。第一是立刻响应加状态可查：上传完成后立刻返回一个 document_id 和 processing 状态，前端把它作为一条「正在解析」的卡片展示，通过轮询或者 WebSocket/SSE 持续更新状态。第二是分阶段的细粒度进度——不要只显示一个转圈，而要把 pipeline 的每个阶段暴露出来：上传完成 → 解析中（第 30/500 页）→ OCR 中 → 切分中 → embedding 中（大概还要几分钟）。这个进度来自任务链的执行状态写入，并且因为各阶段耗时差异很大，我会按阶段估算剩余时间而不是给一个笼统的进度条；尤其 OCR 和 embedding 是最慢的两段，要单独显示。第三是异步加通知——明确告诉用户「预计 8 分钟，完成后通知你」，让他去做别的事，完成后用站内消息或者邮件告知。这里我有一个产品上的坚持：可预期的等待远比模糊的等待容易接受，所以宁可给一个稍微保守的估算也不要给转圈。另外工程上要处理：embedding 要限流避免打爆模型服务，以及对超大文档做页数上限和降级策略。","安全防线要分层并且不能只靠前端。第一层是大小与数量限制——前端做初步拦截（提升体验），服务端必须做最终校验；同时要限制单个租户的总存储配额，防止被撑爆。第二层是「不信 Content-Type」——这是最常见的漏洞：攻击者把可执行文件伪装成 application/pdf。正确做法是在服务端做文件头魔法数字检测（magic number sniffing）验证真实类型、检查扩展名白名单、以及尝试用解析器做一次 Dry-run 验证它是否真的是一个合法的 PDF。第三层是恶意内容——病毒扫描（ClamAV 之类或者云查杀服务）、以及检测 PDF 内嵌脚本和 JavaScript、自动执行/F 危险对象；这些文件会有「解析泄漏」、「XXE」这类的风险，所以解析器要禁用网络访问和脚本执行。第四层是隔离——把解析放在沙箱或独立的容器里执行，限制 CPU、内存、时间和网络访问，因为恶意 PDF 可以精心构造让解析器耗尽资源。第五层是文件名和路径的处理——不能直接用用户提供的文件名拼路径（路径穿越），要用服务端生成的对象名。最后：所有上传要有审计记录，并且大文件的 URL 要用有时效的预签名而不是长期可访问。"],
 pass:"知道分片上传和秒传，知道解析要异步。",
 good:"能给出分片 + 秒传 + 断点续传 + 预签名直传的完整上传方案（含安全校验），以及状态机驱动的异步解析 pipeline、进度反馈、失败重试与孤儿文件清理，并能处理大文件页数多、OCR 慢、embedding 需限流等实际问题。",
 gl:"我会把方案拆成上传和解析两段来讲。上传段的核心是「分片加-object 直传」：流程是客户端先算文件的内容哈希并向服务端发起「初始化上传」，服务端如果发现相同哈希的文件已存在就直接返回秒传成功；否则返回一组预签名 URL（或者直接对接对象存储的分片上传 API），客户端按 5MB 左右切分后并发直传到对象存储——这里的关键是「直传」，让大文件不经过我们的应用服务器，避免带宽和内存被打爆。断点续传则依赖「查询已上传分片列表」这个接口：重连后先问服务端拿到了哪些分片编号，只补传缺失的部分；由于对象存储本身也有分片任务的概念，通常两者配合。安全上我要强调三条：服务端必须做大小限制和配额；绝不能相信客户端传来的 Content-Type，必须用文件头魔法数字校验真实类型加解析器 Dry-run 验证；文件要过病毒扫描，并且解析必须在资源受限的沙箱里做——因为恶意 PDF 可以构造出让解析器耗尽内存或触发漏洞的格式。解析段我设计成一个状态机驱动的异步 pipeline：uploaded → validating → parsing → ocr → chunking → embedding → indexed，每个阶段的状态、页数进度、失败原因都写入文档表；前端通过轮询或 SSE 订阅状态，给出「第 30/500 页」这种细粒度反馈而不是转圈。同时要有超时控制、失败重试、以及最重要的——孤儿文件清理：上传了但从未完成合并的分片，或者解析失败留下的中间产物，都要有定时任务按创建时间和状态清理，否则存储成本会悄悄失控。",
 red:"直接 POST 整个大文件到应用服务器；没有断点续传；解析同步执行导致请求超时；没有孤儿文件清理。"},

{cat:"后端与数据",sub:"",diff:"基础",type:"概念",tags:["API设计","REST","GraphQL"],
 q:"REST vs GraphQL vs tRPC，AI 应用场景下怎么选？",
 intent:"API 设计选型，考察是否能基于场景而非偏好做判断。",
 ans:[
  "REST：最通用、生态最成熟、缓存友好（HTTP 缓存语义）、对外部集成方最友好。B 端开放 API、对外暴露能力时首选。缺点：多端点、容易过取/欠取、需要维护文档（OpenAPI）。",
  "GraphQL：客户端按需取字段，适合多端（Web/iOS/Android）数据结构差异大、前端迭代快的场景。缺点：缓存复杂、性能调优难（N+1 问题）、安全（查询深度/复杂度限制）、学习成本、对开放 API 不友好（外部集成方更喜欢 REST）。",
  "tRPC：TypeScript 全栈下端到端类型安全，开发体验极佳、零 schema 维护成本。缺点：强绑定 TS 全栈，无法给非 TS 客户端用，不适合开放 API。",
  "AI 场景的特殊性：① 大量交互是「流式」——这是三者都没有原生优雅支持的能力。SSE + REST 是目前最实用的组合，GraphQL 的 subscription 也可以但生态和网关支持弱。② 请求是「重且慢」的——需要幂等、任务化、可取消，这些与 API 风格无关，是架构层的事。③ 数据结构相对简单（会话、消息、文档）——没有复杂的图状关联，GraphQL 的优势发挥不出来。",
  "务实结论：内部前后端同构 TS 项目 → tRPC 或 REST + OpenAPI 代码生成（都能拿到类型安全）；对外开放 API → REST（+ OpenAPI 文档 + SDK）；多端且数据结构差异大 → GraphQL；流式场景 → REST + SSE。",
  "AI 应用的 API 设计要点（比风格更重要）：① 所有「重」的接口都要带幂等键；② 长任务返回 task_id 而非阻塞；③ 分页用游标而非 offset（消息列表会持续新增，offset 分页会导致重复/漏数据）；④ 错误响应要结构化（错误码 + 可读信息 + trace_id，便于定位）；⑤ 版本号从第一天就设计好（/v1/），AI 应用的能力演进很快。"
 ],
 follow:[
  "AI 应用要对外开放 API，你会开放到什么粒度？直接暴露模型调用吗？",
  "消息列表用 offset 分页会出什么问题？",
  "流式接口的错误怎么表达？HTTP 状态码已经发出去了。"
 ],
 fa:["我坚决不建议直接暴露模型调用，这是个常见的设计错误。理由是三条：第一，你怎么计费和限流——开放方可以做经济调用成本完全不可控，你还要承担模型费用；第二，你把提示词和内部/系统的业务逻辑泄漏了，还要承担客户 misuse 的风险；第三，模型是会变的，一旦你把自己的内部请求结构暴露成了 API contract，就再也无法更换模型和提示词了。正确做法是「按用例封装」——对外暴露的是业务语义的接口：POST /v1/documents/{id}/summary、POST /v1/support/tickets/{id}/draft-reply，每个接口背后是固定的prompt加固定的temperature和固定的输出 schema。这样你可以自由更换底层实现，客户得到的是稳定的、可预期的语义。粒度上我遵循「按用例而非按通用能力」的原则；对外测试和可视化可以选择模型的方往往应该被限制在白名单内，并且要单独报价。另外还有两个必须有：幂等键（因为 AI 请求贵且慢，网络重试很容易重复）和任务化（长任务返回 task_id）。","offset 分页在消息列表这种「持续新增」的场景会出现两个经典问题：一是数据重复和漏数据——用户翻到第 2 页的过程中，如果新消息插入到了列表头部，那么原本第 2 页的第一条会挤到第 1 页末尾导致重复出现，同时末尾的数据被挤走导致漏掉，这就是所谓的「分页漂移」；二是深分页性能问题——OFFSET 10000 意味着数据库要扫描并丢弃前一万行，随着翻页越来越慢。正确做法是游标分页（cursor-based）：用一个有序且唯一的锚点（比如 created_at + id 组合，或者一个单调递增的 seq 序列号）作为游标，请求「这个游标之后的 20 条」。这样既不受新增数据影响（因为它锚定的是位置而不是偏移量），又能走索引避免深页扫描。实践中的细节：游标要加密或至少不透明化；要支持双向游标（向前翻和向后翻）；并且响应里返回 next_cursor 和 has_more。对于 AI 会话还有一个额外好处：多轮对话的顺序是严格追加的，用 seq 做游标非常自然。","这是流式接口设计里必须提前处理好的问题，因为一旦开始推流，HTTP 的状态码（200）已经发出去了，你无法再修改它。所以规则是：错误只能通过事件流本身来表达。我的协议会定义多种事件类型而不是只有数据块：delta（内容增量）、error（结构化错误）、usage（用量统计）、tool_call（工具调用进展）、done（正常结束）。中途出错时就发送一个 error 事件，携带结构化的错误码、面向用户的话术、以及 recoverable 标记告诉客户端能不能重试。客户端收到后切换到错误态，但要保留已经流式出来的内容——这一点很重要，已生成的部分对用户有价值，不能因为后半段失败就丢弃。还有两个经常被漏掉的要点：一是 usage 事件，因为流式场景下客户端无法自己统计 token；二是 Nginx 等反向代理必须关闭缓冲，否则「流式」会变成一次性吐出。最后产品上的建议是：把「工具调用中」「正在检索」这类中间状态也做成事件推给前端，既提升体感也降低用户的焦虑。"],
 pass:"能说出三种风格的优缺点。",
 good:"能结合 AI 场景的特殊性（流式、重且慢、数据结构简单）给出明确的选型结论，并指出幂等、任务化、游标分页、结构化错误、版本设计这些比风格更重要的工程要点。",
 gl:"我的选型结论是：AI 应用优先选 REST（配合 SSE 做流式），绝大多数场景不需要 GraphQL 或 tRPC。理由要结合 AI 场景的特殊性来说——AI 接口的特点是「请求结构很简单」（基本就是一个 prompt 加若干参数）、「调用很重且慢」（几百毫秒到几分钟）、「经常需要流式返回」。GraphQL 的核心优势是让客户端灵活组合字段从而减少往返，这在 AI 场景几乎没用，因为返回就是一个文本，没什么可裁剪的；而且 GraphQL 对流式支持很差、文件上传也别扭，反而增加复杂度。tRPC 的优势是前后端同享类型，但它要求前后端同一种语言且同一个仓库，只在小团队全栈项目里合适。所以我的选择是：内部小团队全栈 TypeScript 项目可以考虑 tRPC 的开发效率；外部开放或者多端场景用 REST。更重要的是我要强调：在 AI 应用里，风格远不如这些工程要点重要——第一是幂等，AI 调用贵且慢，网络重试极易重复，所以每个写类请求必须支持幂等键；第二是任务化，超过一定时长的操作必须返回 task_id 而不是阻塞 HTTP；第三是游标分页而不是 offset；第四是流式的结构化错误——因为状态码一旦发出就无法修改；第五是版本设计——模型、提示词、输出 schema 都会变，API 必须有一个明确的版本策略和输出契约，并且我会用 OpenAI 兼容风格作为内部标准。这些决定了系统是否能长期演进，而 REST 还是 GraphQL 只是风格之争。",
 red:"凭个人偏好选型，说不出场景依据；或认为 GraphQL 天然更适合 AI 应用。"},

{cat:"后端与数据",sub:"",diff:"进阶",type:"设计",tags:["认证授权","多租户","SaaS"],
 q:"多租户 SaaS 的认证授权怎么设计？API Key、OAuth、JWT 各自用在什么场景？租户隔离怎么保证？",
 intent:"B 端 AI 产品的地基。考察安全架构能力。",
 ans:[
  "认证方式的场景划分：① 用户登录 → OAuth 2.0 / OIDC + Session 或短时效 JWT；② 服务端到服务端集成 → API Key（配合 IP 白名单、权限范围、过期时间）；③ 第三方应用代表用户访问 → OAuth 授权码模式；④ 内部微服务间 → mTLS 或内部 JWT；⑤ 嵌入式挂件 / 前端直连 → 后端换发的短时效、低权限会话令牌。",
  "JWT 要点：短时效（15 分钟）+ refresh token 轮换；不要把权限列表塞进 JWT（会过期不一致且体积大），只放 userId/tenantId 这类稳定标识，权限变化时实时查或用短 TTL；密钥要能轮转（支持多 kid）；登出靠黑名单或短 TTL + 服务端会话表。",
  "授权模型：B 端通常需要 RBAC（角色）+ 租户隔离 + 部分场景的 ABAC（如「只能看自己部门的数据」）。AI 场景还要加一层——「AI 功能权限」（哪些角色能用 AI、能用哪些 Agent、额度多少）。",
  "租户隔离的三道防线（缺一不可）：① API 层——从认证信息里解析 tenant_id，绝不接受客户端传参（这是最常见的越权漏洞来源）；② 数据访问层——所有查询强制注入 tenant_id 条件，用 ORM 全局 scope 或行级安全（Postgres RLS）在框架层保证不被遗漏；③ 存储层——向量库的检索必须带 tenant_id 过滤（很多人忘了给向量加过滤，导致跨租户检索泄露，这是 AI 应用特有的高危点）。",
  "AI 场景的特有风险：① RAG 检索忘带租户过滤 → A 公司问到 B 公司的制度文档；② Agent 工具调用时把 tenant_id 交给模型传 → 可被提示注入篡改；③ 多租户共享同一个 LLM 上下文（极少但致命）；④ 缓存 key 不含租户 → 跨租户串数据；⑤ 评测集/trace 里混了多租户数据。",
  "防护工程化：隔离逻辑要集中在一处（数据访问层），而不是靠每个开发记得写 where 条件；用自动化测试专门跑「跨租户访问必须失败」的红线用例；定期做越权渗透测试。",
  "审计：所有敏感操作与 AI 调用记录 who/when/what，支持按租户导出，这是企业客户的合规刚需。"
 ],
 follow:[
  "RAG 检索时租户过滤忘加了，怎么在设计上杜绝？",
  "JWT 里放权限有什么问题？",
  "你怎么测试跨租户越权？"
 ],
 fa:["这一条我认为是整个多租户设计里最值得工程化的一处，因为它是 AI 应用特有的高危点——传统应用忘加 where tenant_id 只是慢或者错，而向量检索忘加过滤会把 A 公司的机密文档召回给 B 公司。我的做法是把隔离下沉到基础设施层而不是依赖应用层自觉：一是把「按租户检索」封装成一个唯一的检索 SDK 或者数据访问层，业务代码不允许直接调用向量库的裸 client，租户上下文由框架从请求上下文里自动注入而不是由调用者传参；二是用向量库自身的隔离能力——给每个租户一个独立的 namespace 或 collection（数据量不大时这是最彻底的），或者用元数据过滤并在向量库侧配置强制的默认过滤条件；三是做不到前两点时，在检索层加一个统一的断言：任何不带 tenant 条件的查询在进入向量库前就被拦下并告警。此外前面提到过两次的「共享组件键必须有租户维度」（缓存、队列、artifact ID）在这里同样适用。最后我会做自动化测试用 A 租户身份尝试访问 B 租户数据，这是比代码评审更可靠的防线。","JWT 里放权限有三个具体问题。第一是「无法即时撤销」——JWT 是无状态的，一旦签发在过期前始终有效，如果用户的权限被降级或者离职了，你无法让他已有的 token 失效，只能等它过期；所以权限判定必须在服务端做实时查询或者用很短的有效期。第二是「体积膨胀」——权限、角色、组织层级塞进去之后 JWT 会变大，而它是放在每个请求头里传输的，会造成带宽浪费和 header 超限。第三我很在意的是「信息泄漏」——JWT 的 payload 只是 Base64 编码而不是加密，任何拿到这个 token 的人都能解出里面的权限列表，这等于把自己系统的权限结构对外暴露。我的实践建议是：JWT 里只放身份标识（user_id、tenant_id）和很短的过期时间（比如 15 分钟）加刷新机制，权限判定在服务端做（最好有短 TTL 的权限缓存）；如果确实要把一些基础信息放进去以降低查询成本，也要用 JWE 加密而不是 JWS 签名，并且保持精简。还要有三点：密钥要支持轮转（kid header），要用强算法并校验 alg 防混淆攻击，以及敏感的会话状态要能在服务端 side 主动失效。","我会用「自动化越权测试」作为主力手段，因为这件事靠人工想用例是不可靠的。具体三层：第一层是接口级的自动化——用两个不同租户的测试账号，系统性地遍历所有资源型接口，用 A 的凭证去访问 B 的资源 ID（包括遍历 ID 序列、猜 UUID），断言必须返回 403 或 404 而不是 200；这个测试要进 CI，每次新增接口都要补用例。第二层是针对 AI 特有路径的专项测试，这块最容易被漏——包括 RAG 检索（用 A 的会话去问 B 的知识库内容，看会不会被召回）、语义缓存（用 A 的凭证发一个和 B 高度相似的 query，看会不会命中 B 的缓存结果）、Agent 工具调用（看能不能触发访问其他租户数据的工具）、以及文件上传和 artifact 下载的路径遍历。第三层是数据流层面的检查——日志、trace、评测集、导出功能这些地方有没有租户数据混入。此外我会做定期的红队演练让非开发人员尝试越权，以及 code review 时重点看有没有裸的数据访问绕过了统一的数据访问层。最后一条经验：越权测试必须在每个新接口上线前跑，因为这类漏洞往往是在「赶时间绕过框架」的时候被引入的。"],
 pass:"知道 API Key 用于服务间、OAuth 用于用户授权，知道查询要带租户 ID。",
 good:"能给出认证方式的场景映射、JWT 的实践细节（短时效、不塞权限、密钥轮转），以及租户隔离三道防线（尤其向量库过滤这个 AI 特有的高危点），并用框架层强制注入 + 自动化测试来杜绝人为遗漏。",
 gl:"我先给三种认证方式的场景映射：面向最终用户的应用用 session 或者 OAuth/OIDC——尤其是企业客户，他们会要求 SSO 和 SAML；面向开发者和服务的机器到机器调用用 API Key，但要支持密钥轮换、细粒度 scope、以及 IP 白名单，并且存储加盐哈希而不是明文；JWT 通常作为 OAuth 流程内部的令牌载体或者服务间调用的短期凭证，它本身不是一个完整的认证方案。JWT 的实践细节我提四点：一是短期有效（15 分钟左右）配合刷新令牌；二是 payload 里只放身份标识，不塞权限——因为权限需要能实时撤销、且 payload 只是 Base64 不是加密，塞权限等于对外暴露权限结构；三是密钥要支持轮转（用 kid 头部标识当前密钥）以便无损更换；四是服务端要维护会话黑名单用于处理登出和风险会话的强制失效。租户隔离我会明确三道防线：第一道是应用层每个查询必须带 tenant_id，但我不依赖它；第二道也是最关键的——隔离下沉到基础设施：关系库用行级安全策略（RLS），向量库用独立 namespace 或者强制的元数据过滤，对象存储用路径前缀加 IAM 隔离，让越权在最底层就失败;第三道是所有共享组件（缓存键、队列 topic、artifact ID）必须带租户维度,这是最容易被漏掉的一类泄漏。用框架层强制注入租户上下文加上自动化越权测试来保证没有人能绕过。这里我一定会点出那个 AI 特有的高危点：向量检索忘加租户过滤会造成跨租户的知识泄漏，其危害远大于传统应用的同类 bug，所以必须在检索 SDK 层做强制、不可绕过的过滤。",
 red:"从请求参数里取 tenant_id；向量检索不带租户过滤；不知道 RAG 会跨租户泄露。"},

{cat:"后端与数据",sub:"",diff:"进阶",type:"设计",tags:["分布式事务","一致性","补偿"],
 q:"LLM 调用成功了但写库失败（或扣费成功但消息没存下来），怎么保证一致性？",
 intent:"AI 调用昂贵且不可回滚，一致性问题比传统接口更痛。考察分布式事务思维。",
 ans:[
  "先认清约束：LLM 调用是外部副作用，无法参与数据库事务，不能回滚。所以目标不是强一致，而是「最终一致 + 可补偿 + 不丢不重」。",
  "顺序设计原则：把不可回滚的操作放在最后。典型顺序：① 先在 DB 创建消息记录（状态 GENERATING）+ 预扣配额；② 调用 LLM；③ 成功后更新消息内容与状态，并把实际消耗写进扣费流水；④ 失败则回滚预扣、标记消息失败。这样最坏情况是「预扣了但没调用」，只需退款，不会「调用了但没记录」（钱花了却没结果，用户会投诉且无法追溯）。",
  "本地消息表 / Outbox 模式：把「要调用的外部操作」和业务数据变更写在同一个本地事务里，再由独立的投递器读取 outbox 表去真正调用，成功则标记完成。这保证了「业务状态变更」与「外部调用意图」的原子性，是分布式一致性的经典解法。",
  "幂等：外部调用必须带幂等键，重试时不会重复产生副作用（重复扣费、重复发信、重复生成）。",
  "补偿（Saga）：每一步都要有对应的补偿动作——预扣配额的补偿是退款、创建任务的补偿是标记取消。补偿链路本身也可能失败，所以要可重试、要有最终人工介入的入口。",
  "对账（最后防线）：跑批任务定期比对「LLM 网关的调用记录」与「业务库的扣费流水」，找出不一致（有调用无流水 / 有流水无调用）并告警。这是所有金融级系统的必备环节，AI 计费也不例外。",
  "状态机与超时扫描：消息/任务必须有明确的中间态与终态；用定时任务扫描长时间停留在中间态的记录，主动查询外部状态后推进或置为失败。防止因为进程崩溃导致记录永远卡住。",
  "可观测：记录 trace_id 贯穿 DB 记录与 LLM 调用，出现「钱花了没结果」时能立刻查到这次调用的完整链路和用户是谁，便于人工补偿。"
 ],
 follow:[
  "预扣和实扣不一致（预估 token 和实际差很多），怎么处理？",
  "补偿任务自己也失败了，怎么办？",
  "你怎么设计对账任务？多久跑一次？发现不一致怎么自动修复？"
 ],
 fa:["这是 AI 计费里几乎必然存在的差距，因为 token 数只有生成完才知道，而预估很难准，长输出场景偏差可能超过一倍。我的处理原则是「预估用于风控，实扣用于结算」。具体三层：第一层是预扣作为预算护栏——它防止的是「用户或者脚本超额消耗」，所以预估可以保守一点（稍微高估）以免被绕过，我用它做实时拦截；第二层是实扣——调用结束后立刻按实际用量做一个「结算」动作，把预扣的差额退回或者补扣，这个动作必须和业务记录在同一个事务里；第三层是对账——因为预付、实扣、以及在途都可能出错，所以每日（至少每周）要跑一次把我们内部流水和厂商侧账单、以及用户余额做三方比对。这里我要强调两个容易出错的点：一是流式被用户中断的场景，账单口径要提前和厂商确认清楚（有的暂停后仍计入输出 token），否则对账永远对不上；二是并发——同一用户的多次并发请求同时扣余额会导致竞态，要用数据库的条件更新而不是读-改-写。最后我会在产品上做一层显式：给用户的账单里区分「预估」和「实际」，避免争议。","补偿失败是必然会遇到的，所以设计上必须有兜底而不是指望补偿永远成功。我的处理有三条：一是重试策略要合理——区分可重试错误（网络、限流）用指数退避重试，不可重试错误（数据不存在、业务规则不允许）立刻停止并转人工；同时设最大重试次数。二是必须有死信队列——重试耗尽的任务进 DLQ，并且 DLQ 必须有告警和可视化的处理界面，因为这里是最后的人工兜底点；我见过太多系统把数据写进 DLQ 就再也没人看了，那等于没做。三是人工处理路径要低成本——提供一键重放、查看完整上下文、以及手动修正的工具，而不是让工程师去改数据库。另外从设计上我会做「自愈优先」——让补偿任务本身尽可能幂等且轻量（比如只更新一个状态字段），把复杂逻辑留给主流程；以及做「补偿的补偿」——定时扫描那些长时间停留在中间态的业务记录，它们往往就是补偿失败留下的。最后我会把这整个链路的失败率做成监控指标，DLQ 长度是要告警的一级指标。","我会把它设计成分层：实时对账加日终对账。实时层面依赖幂等和 Outbox 保证绝大多数情况不出问题。日终对账任务是主力：每天业务低峰期跑一次，对比三个数据源——我们自己库的消耗流水、厂商侧返回的 usage 账单、以及用户账户余额的变化；三者应当满足勾稽关系，不一致就生成差异记录。频率上我建议资金相关的至少每日跑（因为要和财务口径对齐），非资金的消耗类可以每周；此外对大客户可以提供更细频率。自动修复我坚持一个原则：只能自动修复「能明确归因且幂等安全」的差异，比如厂商侧已扣而我们没记账，就自动补一条流水；而我们记了厂商没扣或者金额不一致这种涉及钱的，必须人工确认后再处理，不能自动改账。还有一个重要设计是对账要有 trace_id 贯穿——每条消耗记录都能反查到那次 LLM 调用的完整链路，这样定位差异就是几分钟的事，否则你要在数据海洋里捞针。最后我会把差异数量和金额做成趋势指标，突然增多往往意味着某次改动引入了 bug。"],
 pass:"知道要用重试和补偿，知道要有对账。",
 good:"能认清「外部调用不可回滚」的约束，给出「不可回滚操作后置」的顺序原则、Outbox 模式、Saga 补偿、对账兜底与超时扫描的完整方案，并强调 trace_id 贯穿。",
 gl:"我先明确一个约束：LLM 调用这个外部操作是不可回滚的——钱已经花了、token 已经消耗了，你没法像数据库事务那样 rollback。所以正确做法是「顺序原则」：把不可回滚的操作放在最后，让可回滚的操作先完成。具体来说，在调用 LLM 之前先把「这次调用要做什么」落库为一条 pending 记录（含幂等键、用户输入、预计消耗的预算），这一步必须是事务性的；调用成功后再把结果和这条记录一起更新为 success，这同样要在同一个事务里。这就不会出现「扣费成功但消息没存下来」这种尴尬——因为如果第二步失败，pending 记录还在，可以用它做补偿重放（用同样的幂等键重放不会重复扣费）。这里我会用到 Outbox 模式：业务数据的写入和「需要发出的事件」写在同一张表的同一个事务里，由一个投递器异步把事件发出去，这样保证了本地数据一致的同时不依赖消息队列的可用性。对于跨越多个服务的场景用 Saga——把长事务拆成若干本地事务，每个都配一个补偿动作，失败时按反序执行补偿；注意补偿不等于回滚，它是业务上的抵消。最后是三层兜底：一是超时扫描——定时扫描长时间处于中间态（pending 但超过预期时间没结果）的记录来判断是否失败；二是对账——拿我们的流水和厂商账单对比，这是最终的真相来源；三是 trace_id 贯穿全链路，让每条消耗都能追溯到具体的调用。这整套设计的核心哲学是：承认分布式环境下部分失败是常态，与其防止失败不如让系统能从任何中间状态恢复到一致。",
 red:"先调 LLM 再写库，失败就丢；认为加个 try-catch 重试就行；没有对账，账实不符永远发现不了。"},

{cat:"架构与运维",sub:"",diff:"高阶",type:"设计",tags:["AI中台","复用"],
 q:"多条业务线都要用 AI 能力，怎么设计 AI 中台避免重复造轮子？",
 intent:"考察平台化架构能力。5 年经验应能跳出单个项目视角。",
 ans:[
  "先判断该不该做中台：中台的代价是抽象成本和响应速度下降。判断标准——是否有 3 个以上业务线有共性需求，且这些需求的差异主要在「内容」而非「机制」。只有 1–2 个业务线时，宁可复制也不要中台（过早抽象的代价远大于重复）。",
  "分层设计：① 基础设施层——LLM 网关（统一模型接入、路由、降级、成本归集、限流）；② 通用能力层——RAG 引擎（文档接入、解析、切分、检索、重排）、Agent 框架（工具注册、循环控制、状态管理）、提示词管理（版本、渲染、灰度）、评测平台（数据集、评测、报告）；③ 业务层——各业务线自己的提示词、知识库、Agent 编排、UI。中台只做第 ①② 层，第 ③ 层交给业务线，否则中台会变成瓶颈。",
  "关键设计原则：机制上收、策略下放。中台提供「可配置的检索策略引擎」而不是「一套固定的检索流程」；提供「Agent 运行时」而不是「写死的 Agent」。业务线通过配置而非改中台代码来满足差异。",
  "多租户与隔离：中台天然是多租户的——各业务线是逻辑租户，知识库、提示词、配额、trace 全部隔离。",
  "接口契约：中台对外只暴露稳定的能力接口（如 /retrieve、/agent/run、/prompt/render），内部实现可替换（换向量库、换模型不影响业务线）。契约要版本化。",
  "避免的常见失败模式：① 中台做成「大而全的通用框架」，配置项爆炸，业务线用不起来；② 中台团队闭门造车，做出来的东西业务线不需要（应对方式：第一个版本必须由一个真实业务线驱动，做出来立刻落地验证）；③ 中台成为瓶颈——业务线提需求要排期三个月，于是各业务线自己 fork 一份（应对方式：保留扩展点，允许业务线贡献插件/自定义节点）；④ 没有 SLA 和 owner，出问题互相推诿。",
  "衡量中台是否成功的指标：接入业务线数、复用率（新增业务线需要新写的代码量）、需求平均交付时长、中台的可用率。",
  "演进路径：不要一上来建中台。先在一个业务线做深做透 → 第二个业务线复用时抽取公共部分 → 第三个业务线时正式立中台。这条路径最稳妥。"
 ],

 fa:["我会先弄清楚「满足不了需求」到底是哪种情况，因为它们处理方式完全不同。第一种是真的能力缺口——我们要的这个东西确实不存在，这时候应该支持，但要谈清楚：是一次性给你做、还是作为通用能力做；如果是后者就排队迭代。第二种是时机不匹配——中台排期慢而业务线等不及，这时候我倾向于给一个明确的临时方案：允许他们在约定的时间内 fork 或者自建，但同时约定「欠中台一笔账」——中台能力具备后要迁移回来，并且我会要求他们把 fork 期间的改动沉淀成文档。第三种也是最常见的——不合理的需求，比如要改一个会破坏其他业务线的通用行为；这时候应该用数据和技术判断去说服，而不是简单拒绝。我的原则是不用行政手段禁止 fork，因为禁止不了，而是要让「用中台」比「fork」更省力。所以真正的解法不是流程而是产品力：如果中台的接入成本足够低、能力足够强、出了问题有人支持，业务线自然不会 fork。另外我会把 fork 的数量作为一个健康度指标，它的上升是中台失效的最直接信号。","我的核心原则是「机制上收，策略下放」。上收的是那些重复建设成本高、技术含量高、且需要统一治理的「机制」：模型接入与网关（因为涉及成本、限流、密钥和可观测的统一）、文档解析与索引 pipeline（技术难度大且通用）、检索能力、评测体系、以及通用的可观测与 trace。下放的是与具体业务强相关的「策略」：业务流程编排、各家业务线专属的工具集、具体的 prompt 内容、以及面向用户的交互形态。判断标准我会用两个问题：这个能力变更的频率低不低（低则适合中台）、以及它是否通用（通用则适合中台）。我特别强调不要收「业务流程编排」——它是差异最大、迭代最快的部分，中台一旦收了就会变成所有业务线的瓶颈。另外中台的每个能力都应该是可替换的插件式接入，而不是强制框架；以及必须提供清晰的 SLA 和升级路径，否则它会退化成一个没人敢动的老系统。最后边界是会变的，我会定期审视哪些能力该上收、哪些该下放。","我会用三类指标并且尽量量化，因为「中台有收益」这件事必须能被证明否则就是信仰。第一类是成本类——最直接的是 infra 成本的节省：token 成本因为统一网关做缓存和路由下降了多少（我见过能到 30% 以上）、重复建设的算力节省了多少；以及研发成本的节省——新业务接入 AI 能力的周期从多久降到多久（比如从两个月降到两周），这个指标我认为最有说服力，因为它直接体现了复用的价值。第二类是质量类——接入中台的业务在关键质量指标上是否达标（幻觉率、可用性、P95 延迟），以及事故数是否下降；如果中台带来的质量稳定性明显优于各自为战，这就是它的核心价值。第三类是效率与健康度类——API 的复用率、被几个业务线使用、以及 fork 率（越低越好）。我还会做一个很朴素的对照：同样的业务，用中台方案的交付时间和人力 vs 自建方案。最后我会诚实地说：如果拿不出这些数字，说明中台可能真的没带来收益，那就应该调整甚至砍掉，而不是靠 PPT 证明它有价值。"],
 pass:"知道要抽公共的 LLM 接入、RAG、提示词管理。",
 good:"能给出三层分层与「机制上收、策略下放」的核心原则，清楚列出中台的四种常见失败模式与应对，给出成功度量指标，并提出「先做深一个业务线再抽取」的稳妥演进路径。",
 gl:"我先给结构：AI 中台我建议做成三层——最底层是能力层或者说基础设施层，包括模型网关、文档处理 pipeline、检索服务、评测平台、以及可观测体系，这一层是纯技术能力，通用性最强；中间是可组合的构建块层，比如对话引擎、知识问答 engine、Agent 编排框架、工具注册中心，它们提供可配置的流水线；最上层留给各业务线做自己的编排和产品形态。这里的核心原则是「机制上收，策略下放」：上收重复建设成本高、技术门槛高、需要统一治理的机制（网关、pipeline、检索、评测、观测），下放差异大、变化快的策略（业务流程、专属工具、prompt 内容、交互形态）。我见过中台的四种失败模式，也说一下应对：一是「为了中台而中台」——没有真正的复用就先建，结果变成一个没人用的空壳；应对是要求先做深一个业务线再抽取。二是「什么都想收」——把业务流程也收上来，导致团队变成瓶颈；应对就是刚才讲的边界原则。三是「 防御性山峰 无 SLA」——中台成了黑盒，出问题没人负责；必须有 owner 和明确的 SLA。四是「 版本绑架」——一个业务线的特殊需求绑架了整个中台；应对是插件化和可替换设计，允许往下沉 only-if 通过 RFC。至于怎么证明收益，我会拿三个数字：token 和算力的成本节省（通过统一网关和缓存量化）、新业务接入周期的缩短（这是最有说服力的指标）、以及质量和稳定性的提升（幻觉率、可用性的对比）。最后我要强调演进路径：不要一开始就建设中台，正确做法是先在一条业务线上把 AI 能力做深做扎实，第二次遇到同类需求时做轻度抽象，第三次才正式中台化——「三处重复才抽象」这个原则在这里同样适用。",
 red:"一上来就要建中台；中台做成配置项爆炸的通用框架；说不清该不该做中台的判断标准。"},

{cat:"架构与运维",sub:"",diff:"基础",type:"概念",tags:["单体","微服务","架构演进"],
 q:"AI 应用早期，单体还是微服务？怎么切分服务边界？",
 intent:"考察架构务实度，避免为了微服务而微服务。",
 ans:[
  "结论先行：早期用模块化单体（Modular Monolith）。团队小于 10 人、需求变化快、边界还不清晰时，微服务的分布式复杂度（网络调用、数据一致性、分布式调试、部署编排）会严重拖慢迭代，而这些复杂度带来的收益在早期几乎为零。",
  "但 AI 应用有两个天然的切分理由：① 资源特性差异巨大——文档解析（CPU 密集、可能跑很久）、embedding（GPU/CPU）、LLM 推理（GPU、长耗时）、主应用（IO 密集）。把它们混在一个进程里会导致资源争抢和扩缩容困难。② 故障隔离——解析服务 OOM 不该让整个产品不可用。",
  "所以务实的切法：主应用（单体，包含会话、用户、编排）+ 独立的异步 worker（文档解析/索引/embedding）+ 独立的 LLM 网关（或进程内模块）+ 独立的推理服务（自建时）。这是「按资源与故障域切」，而不是「按业务实体切」。",
  "演进触发条件（什么时候真正拆微服务）：团队规模扩大到多个小组独立交付、某模块需要独立扩缩容、某模块的可用性要求与主应用不同、单体部署时间过长影响迭代。有了这些信号再拆。",
  "拆分原则：按「业务能力 + 数据所有权」拆，一个服务拥有自己的数据（不要多个服务共享一个数据库，这是分布式单体的典型反模式）。AI 场景常见的服务：会话服务、知识库服务（含索引 pipeline）、Agent/编排服务、模型网关、评测服务、计费服务。",
  "进程内 vs 跨进程：不要把所有函数都变成 RPC。跨进程调用带来序列化开销、网络失败面、可观测复杂度。只有确实需要独立部署/扩缩容/隔离的才拆出去。",
  "契约治理：服务间接口要有版本、有契约测试（consumer-driven contract），防止一方改动悄悄破坏另一方。"
 ],
 follow:[
  "你们是从单体演进过来的还是一开始就微服务？后悔过吗？",
  "共享数据库会有什么问题？",
  "什么信号出现时你决定该拆了？"
 ],
 fa:["我的回答是：从模块化单体起步，并且在 AI 应用这个领域我尤其推荐这么做。原因是 AI 应用早期最大的不确定性在于「产品形态和模型能力都在变」，你今天划分的服务边界可能三个月后就完全错了，而微服务的拆分成本是极高的——一旦拆开，跨服务的调用、事务、部署、调试复杂度都会暴涨，而这些在低 validate 阶段完全没有收益。我确实经历过一些项目过早微服务化带来的痛苦：为了改一个字段要动三个服务、联调要起五个进程、本地复现线上问题几乎不可能。后悔的点是「拆分太早」而不是「微服务这个理念不对」。具体来说我会用模块化单体——代码按领域分成清晰的模块（conversation、knowledge、billing、agent），模块之间通过明确的接口通信并且禁止跨模块直接访问数据表，数据库可以是单库但逻辑上分区；这样保留了未来拆分的可能性，同时享受单体的开发和部署效率。当某些模块的边界被验证稳定且确实有独立演进需求时，再把它拆出去。","共享数据库是微服务化过程中最常见也最隐蔽的坑。第一是「无法独立演进」——A 服务想改一张表的 schema，却不知道 B、C 服务也在读它，于是任何变更都需要跨团队协调，最后变成谁都不敢改。第二是「耦合没有被消除反而被隐藏」——服务之间看似解耦了，但它们通过数据库形成了隐式契约，这种耦合没有接口定义、没有版本控制、也无法被静态检查发现，比显式的 API 调用危险得多。第三是「事务边界混乱」——跨服务的事务操作直接在同一张表上做，短期很爽，长期导致没人知道数据一致性的边界在哪里。第四是运维上的问题——连接数、慢查询、故障定位都难以归因。我的原则是按数据所有权拆分：每张表只有一个 owner 服务，其他服务要访问必须通过它的 API 或者事件。这条原则还有个副产品：它迫使你想清楚每个领域的边界。实践中如果短期不能完全拆分，至少要做到「读可以共享、写必须独占」并加上明确的契约。","我会看四类信号，单个信号不足以触发拆分。第一是「资源特性差异」——这是 AI 应用特有的、也是最重要的一个理由：知识库的索引任务吃 CPU 和大量内存、embedding 调用是 IO 密集、LLM 生成可能长时间占用连接、 GPU 推理服务需要独立的显存和调度策略；如果它们和一个轻量的 CRUD 服务混在同一个进程里，资源竞争会互相拖垮，而且无法独立扩缩容——你可能只是想扩 embedding 的 worker，却不得不把整个单体都扩一倍。第二是「故障隔离」——某个模块的故障不能拖垮整体，比如文档解析如果因为恶意 PDF 崩溃，不应该让用户连基本的对话也用不了。第三是「迭代节奏差异」——某个模块的变更频率远高于其他部分，或者需要独立发布；反过来如果一个模块长期不变，也不必拆。第四是「团队边界」——有独立的团队负责这块并且有自己的发布节奏。我还会强调：不要把所有函数变成 RPC——拆分的前提是边界清晰且真的有收益，纯粹为了「看起来是微服务」而拆只会增加延迟和故障点。拆分前我会先做模块化、再提取接口、最后才是进程隔离。"],
 pass:"知道早期用单体，知道解析/推理要独立。",
 good:"能给出模块化单体的明确结论 + 两个 AI 特有的切分理由（资源特性差异、故障隔离）+ 演进触发条件 + 按数据所有权拆分的原则，并指出「不要把所有函数变成 RPC」。",
 gl:"我的结论很明确：AI 应用早期应该用模块化单体，而不是微服务。理由有三个层次。第一是「边界不确定」——AI 应用的产品形态和技术栈都在快速演进，今天以为的领域边界三个月后可能完全变了，而微服务最大的成本恰恰是边界一旦固化就很难调整；单体里改一下模块边界是重构，分布式里就是跨服务的迁移。第二是「调试成本」——AI 应用本身已经有很高的不确定性，排查一个 bad case 需要看完整的上下文拼装、工具调用、模型返回，如果这些还要跨越多个服务的网络和日志，排查成本会呈数量级上升。第三是「团队规模」——微服务是为解决大规模团队协作问题而生的，早期三五个人的团队用它只会拖慢速度。我推荐的做法是模块化单体：代码按领域划分清晰的模块，模块间只能通过显式接口通信，绝不跨模块直接访问数据表，数据库逻辑分区——这样既保留了未来拆分的可能，又享受单体的开发效率。AI 应用有两个特有的拆分理由是值得注意的：一是资源特性差异巨大（索引吃 CPU、embedding 是 IO 密集、推理要独占显存），把它们和轻量 CRUD 混在一起会导致资源竞争和扩缩容困难；二是故障隔离需求（恶意 PDF 让解析崩溃不应该影响对话）。拆分的触发条件是这四类信号出现：资源特性差异已大到必须独立扩缩、某模块故障需要被隔离、迭代节奏显著不同、以及有独立团队负责。最后一条我要强调——不要把所有函数变成 RPC，进程内的函数调用是最可靠的通信方式，只有真正需要上述四个理由时才付出分布式的代价。拆分原则是按数据所有权：每张表只有一个 owner，跨模块访问走 API 或事件。",
 red:"上来就微服务；或多个服务共享一个数据库；说不出为什么拆。"},

{cat:"架构与运维",sub:"",diff:"进阶",type:"设计",tags:["可观测性","监控","告警"],
 q:"日志、指标、链路追踪这三者有什么区别？AI 应用比传统应用多需要哪个维度？",
 intent:"可观测性基础题，但要听出 AI 特有的成本与质量维度。",
 ans:[
  "日志（Logs）：离散的事件记录，回答「发生了什么」。适合排查具体个案。AI 场景要记录：完整的输入提示词、输出、token 数、模型版本、耗时、错误信息。",
  "指标（Metrics）：可聚合的数值时间序列，回答「整体健康度如何、趋势怎样」。适合告警。AI 场景的核心指标：QPS、TTFT/P95 延迟、错误率、限流率、token 消耗与成本、缓存命中率。",
  "链路追踪（Traces）：单次请求在多个组件间的完整路径，回答「这个请求在哪一步慢/错了」。AI 场景尤其重要——一次会话可能跨检索、重排、多次 LLM 调用、多个工具。",
  "三者关系：指标发现问题 → 链路定位到环节 → 日志看细节。缺任何一个排查都会卡住。",
  "AI 应用多出来的维度（关键）：① 成本维度——传统应用不关心单次请求花了多少钱，AI 应用必须按租户/功能/模型多维计量，且要能归因。这是全新的可观测对象。② 质量维度——传统应用的成功/失败是二元的，AI 应用是连续谱。需要把「点踩率、转人工率、拒答率、评测通过率」纳入监控。③ 版本维度——提示词版本、模型版本、检索配置版本、知识库版本，都要作为标签打在指标和 trace 上，否则线上指标波动时无法归因（「是换模型导致的还是改提示词导致的」）。这三条是 AI 可观测性区别于传统的核心。",
  "AI 特有的 trace 结构：Span 类型包括 llm.call、retrieval、rerank、tool.call、agent.step；每个 Span 记录输入输出全文、token 与成本、prompt_version、model。",
  "采样策略：全量存 trace 太贵（输入输出全文体积大）。用 tail-based sampling——出错的、慢的、被点踩的 100% 保留，正常的按 1%–10% 采样。",
  "告警设计：不只告警技术指标（错误率、延迟），还要告警业务/成本指标——成本突增 300%、点踩率翻倍、某提示词版本的失败率上升、某知识库召回贡献为 0。这些才是 AI 应用真正会出事的地方。",
  "隐私：日志和 trace 里含用户输入全文，必须脱敏 + 访问控制 + 留存期限，否则可观测系统会变成数据泄露源。"
 ],

  "日志里有用户隐私，你怎么处理？"
 ],
 fa:["我会沿着「指标发现 → 链路定位 → 日志看细节」这条路径走，但它比普通技术告警复杂，因为答案质量下降的原因可能是模型、数据、或者产品形态。第一步是快速判断是不是系统故障：看可用性、错误率、延迟这些基础指标有没有异常——如果 P95 延迟翻倍了，那大概率是某个依赖或者容量问题；这类「硬故障」通常能快速定位。第二步如果不是技术故障，就要拆维度看影响面：按模型版本、提示词版本、知识库版本、场景、用户群分别看点踩率——这一步通常能直接定位到「某次变更」，因为我们做 AI 应用最大的风险就是某次静默的升级。这里就体现出 AI 特有的第四个维度的重要性——版本维度：如果你没有把 model_version 和 prompt_version 打进每次调用的指标里，这一部你根本没法做。第三步是捞具体的 bad case 看 trace：确认是召回失败、还是排序截断、还是生成问题。最后我会检查是不是外部因素：数据源变了、上游内容更新了。整个过程中我会同时看成本指标，因为很多时候「为了省钱切了便宜模型」就是质量下降的原因。","采样策略我用「分层加尾部采样」。基础层是轻量的元数据全量保留——每个请求记录 trace_id、各 span 耗时、token、成本、状态码、版本号，这些数据很小但对聚合分析极其重要，必须全量。上层是 payload 采样：错误和异常请求百分百保留全文（包括重试失败、成本高得离谱的、用户点踩的），这些是最有价值的样本；正常请求按很低的比例（比如 1% 到 5%）采样。这里我要特别推荐「尾部采样」——不在请求开始时决定是否采样，而是等请求结束后根据它的实际结果（是否出错、是否慢、是否被点踩）再决定要不要留下详细信息，这样能精准保住所有你真正想看的 case。此外针对特定流量做强制全采：灰度版本、新提示词、重点客户。存储上做冷热分层——最近七天可全文检索，更久的只保留元数据或者归档到便宜的对象存储。最后是脱敏必须在写入前完成，这一点在前面提到过但它在这里尤其重要，因为 trace 里最容易包含完整的用户输入。","我的原则是「脱敏前置、最小采集、访问控制」三管齐下。脱敏前置是最关键的——在 SDK 或日志采集层就做掩码处理，而不是事后在日志系统里清洗，因为一旦进了日志系统就可能被备份、被下游消费、被同步到第三方，清洗的成本和遗漏风险都极高。具体手段：对身份证、手机号、银行卡、邮箱这些结构化强的信息用正则替换（保留部分格式以便排查，比如 138****1234）；对姓名、地址、单位这些语义性的信息用小模型或词典识别脱敏；对长文本我倾向于只记录长度、哈希和特定片段而不是全文。第二个原则是最小采集——反问这个字段真的需要打日志吗，很多 debug 级别的日志在生产环境应该默认关闭或者只开短时间。第三个是访问控制——trace 系统本身要有基于租户和角色的可见性隔离（这在多租户里提过），敏感字段二次鉴权才能查看，并且所有的查看行为要有审计。最后我会加两个技术手段：一是对日志设置较短的 TTL 并支持按用户删除（因为被遗忘权同样适用于日志），二是用 tokenization 让日志里只存令牌，需要还原时才去映射表查并留痕。"],
 pass:"能说出日志/指标/追踪的区别和用途。",
 good:"能讲清三者的协作关系（指标发现 → 链路定位 → 日志看细节），并明确指出 AI 特有的成本、质量、版本三个新维度，给出 Span 类型设计、tail-based sampling 和业务/成本告警，以及 trace 的脱敏要求。",
 gl:"我先讲清三者的区别和协作关系。指标是聚合的、可随时间变化的数值——CPU、QPS、错误率、点踩率，它的优势是便宜、能长期保留、适合告警和趋势判断，它回答的是「有没有问题」。链路追踪是单个请求在系统中流转的完整路径，由若干 span 组成，它回答的是「问题出在哪个环节」——比如一次 AI 请求里，检索花了多久、LLM 调用花了多久、工具调用有没有失败。日志是离散的事件记录，带完整的上下文细节，它回答的是「具体发生了什么」——模型的原始输入输出、错误的堆栈。三者的协作是典型的漏斗：指标发现异常 → 链路定位到具体环节 → 日志查看细节。映射到 AI 应用，链路的 span 类型我会设计成：LLM 调用、工具调用、检索、重排、Agent 步骤、以及 Guardrail 检查，每个 span 记录耗时、token、成本、模型版本、提示词版本。而 AI 应用比传统应用多需要的维度，我认为主要是三个：一是成本——每次调用的 token 和费用必须是一等公民，因为 AI 的成本会随着使用线性增长且波动很大，一个失控的循环可以在几小时内烧掉一个月的预算；二是质量——模型的输出不像代码那样非对即错，需要 faithfulness、相关性、点踩率这类质量维度，并且要能和 trace 关联起来看；三是版本——模型版本、提示词版本、知识库版本、模型取决于三个变量的组合，任何一次变更都可能改变行为，所以指标必须能按这些版本下钻，否则「线上突然变差」这件事你永远定位不到原因。采样上我用「元数据全量 + payload 分层采样 + 尾部采样保住错误样本」，并且要考虑成本；隐私上脱敏必须在采集层前置完成，日志也要有访问控制和审计。",
 red:"三者混为一谈；只监控 CPU 和错误率，完全没监控成本和质量；trace 里明文存全量用户输入且无访问控制。"},

{cat:"架构与运维",sub:"",diff:"进阶",type:"设计",tags:["灰度发布","A/B","实验"],
 q:"提示词、模型、检索策略这些 AI 组件怎么灰度发布和 A/B？",
 intent:"AI 应用的灰度对象比传统应用多得多，且非代码。考察实验设计能力。",
 ans:[
  "灰度的对象（AI 特有）：提示词版本、模型（厂商 + 版本）、检索参数（top-k、阈值、融合权重）、chunking 策略、embedding 模型、Agent 的步数与工具集、temperature 等解码参数。这些都是「配置」而非「代码」，必须支持运行时切换，不能靠发版。",
  "实现方式：把所有这些抽成「实验变量」，通过一个实验配置中心下发给运行时。每次请求根据分流规则决定使用哪组配置，并把实验组 ID 打到 trace 和指标上。",
  "分流维度：按用户 ID 哈希（保证同一用户始终在同一组，体验一致）、按租户（B 端常用，给某些客户先体验）、按流量百分比、内部白名单。",
  "影子流量（Shadow / Dark Launch）：新配置并行跑但不返回给用户，只收集输出与指标做对比。这是 AI 应用最安全的验证手段——因为它不冒用户体验风险，却能看到真实分布下的表现。",
  "离线先行：任何灰度之前，先跑离线评测集。离线没通过的绝不进灰度——不要拿线上用户当小白鼠。",
  "指标设计（分层）：① 离线指标（评测集通过率、各维度分数）；② 线上技术指标（延迟、错误率、成本）；③ 线上业务指标（任务完成率、点踩率、转人工率、用户留存）。三层都要看，只看一层会被误导（如「延迟降了是因为答案变短了，但完成率也降了」）。",
  "统计显著性：A/B 需要足够的样本量和运行时长，要做显著性检验（不能看两天数据就下结论）。AI 输出方差大，所需样本量通常比传统 A/B 更大。要预先算好需要多少样本，避免「永远差一点点不显著」的摇摆。",
  "回滚：灰度必须能秒级回滚（切配置指针，不需要发版、不需要重启）。且要有一键回滚的开关和明确的值班责任人。",
  "常见坑：① 灰度期间用户被分到不同组导致体验不一致（要按用户哈希而非请求哈希）；② 同时灰度多个变量导致无法归因（一次只改一个变量，或用多变量实验设计）；③ 灰度时间太短，覆盖不到低频但重要的场景；④ 忘了成本指标——新模型效果好了 2% 但成本涨了 5 倍。"
 ],
 follow:[
  "同时改了提示词和模型，效果变好了，怎么知道是哪个的功劳？",
  "A/B 跑了三天，指标差 2%，能下结论吗？",
  "灰度期间用户对同一问题得到不同答案，怎么处理？"
 ],
 fa:["同时改两个变量是实验设计的硬伤——这就是为什么要坚持「单变量原则」。但如果真发生了，我有三个补救层级，从贵到便宜。最可靠但最贵的是补做一个 2x2 的析因实验：对照组（旧模型+旧提示词）、模型单变、提示词单变、两者都变，四组同时跑，这样才能算出各自的主效应和交互效应（交互效应很重要，因为针对旧模型调的提示词在新模型上常常不是最优）。第二层是事后拆分——如果 experiment traffic 里恰好有一小部分是只改了其中一个变量的（比如灰度过程中先改了模型再改了提示词，两段时间的数据自然形成了单变量对照），可以拿来分析，但要注意时间混淆。第三层是廉价的离线归因——把两组 case 拿出来做离线重放，用新模型配旧提示词跑一遍、用旧模型配新提示词再跑一遍，在评测集上对比各部分的效果贡献。所以我的结论是：与其事后补救，不如一开始就坚持「一次只放一个变量」，或者在实验配置中心里把模型和提示词的组合作为一个明确的版本号来做多臂实验。","大概率不能，这是实验里最常见的误判。我会从三个角度回答。一是统计显著性——2% 的差异需要多少样本才能证明不是随机波动，这取决于指标的基数和方差；质量类指标（比如点赞率）通常需要成千上万的样本才能检出小差异，三天的数据很可能远远不够。所以我会先算最小可检测效应（MDE），如果当前的样本量对应的 MDE 远大于 2%，那么这个结论不可信。二是多重比较问题——如果你同时看了十个指标，总有一个会「显著」，这时候要做校正；以及要警惕「连续偷看」——每天都看一次结果直到出现显著为止，这会让假阳性率大幅上升，正确做法是实验前确定好样本量和观察窗口，跑完再看。三是业务显著性 vs 统计显著性——即便统计上显著，2% 是否值得上线还要看它带来的成本和复杂性。我的实际行动是：先看样本量够不够，不够就延长实验或者只在流量大的场景做；同时看指标的方差和置信区间，如果置信区间横跨 0，那就不下结论；最后会等待至少一个完整的业务周期（覆盖周一到周日）以消除星期效应。","这是 AI 产品特有的麻烦——传统 A/B 里用户不太会察觉自己在实验组，但 AI 产品的用户对「同一个问题两次答案不同」非常敏感，甚至会怀疑产品不可靠。我的处理有三条：一是「按用户而非按请求做分流」——这是最关键的工程手段，用 user_id 或会话 ID 做稳定的哈希分桶，保证同一个用户始终在同一组，他不会在短时间内看到不一致的答案；跨设备登录的场景用 account_id 分桶。二是「缩小心智敏感度高的场景」——对外面对终端用户的高频场景少做实验，把激进实验放在内部或者接受程度上更宽容的场景（比如内容创作类，用户本来就知道 AI 的输出不唯一）。三是「产品上消解不一致」——在可能不一致的地方给出明确的提示（比如「这是一次实验性回答」），或者提供「重新生成」入口让用户自己选择另一个答案。另外补充两个原则：实验期间提供一键反馈渠道，让用户的意见能进到我们的分析里；以及灰度实验得出结论后要尽快收敛到一个版本，不要长期维持多版本并存。"],
 pass:"知道要按用户哈希分流，知道要跑 A/B 对比。",
 good:"能列出 AI 特有的六类灰度对象与实验配置中心的做法，提出影子流量与「离线先行」的安全策略，给出三层指标体系与显著性检验要求，并指出四个常见坑（尤其成本被忽略和多变量无法归因）。",
 gl:"我会先讲 AI 应用的灰度对象和普通软件有什么不同——它至少有六类可灰度对象：提示词模板（含版本）、模型与模型版本、检索策略（切分粒度、是否混合检索、top-k、是否重排）、编排逻辑（单轮 vs Agent、路由规则）、以及产品参数（temperature、阈值），还有知识库索引本身。这就要求有一个「实验配置中心」把这些都参数化并与版本号绑定，而不是写死在代码里。安全策略上我坚持两条：一是「离线先行」——任何灰度之前必须先在离线评测集上跑一遍，看变异例占比而不只是总分；二是「影子流量」——新配置先用真实流量跑但不返回给用户，离线对比新旧输出的差异，这一步能拦掉大量灾难性改动。指标体系我分三层：北极星（任务完成率）、代理指标（点赞点踩、追问率、修改率、拒答率）、以及护栏指标（成本、延迟、幻觉率、安全性）——这里我要特别指出一个常见的坑：大家的关注点全在质量指标上，成本被系统性忽略，我见过新策略效果好但成本涨 60%，三个月后才被发现。归因上必须坚持单变量原则，模型和提示词同时改是没法归因的，正确做法是 2x2 析因实验或者离线补偿重放。还有一个我认为最重要的坑：样本量不足导致的假结论——跑三天差 2% 通常下不了结论，要先算 MDE 和所需样本量，并避免中途反复偷看结果。最后是分桶必须按用户维度做哈希，保证同一用户的一致性体验；以及上线后要持续监控一段时间，因为某些退化是长尾的。",
 red:"改提示词靠发版；灰度按请求分流导致同一用户体验跳变；看两天数据就下结论。"},

{cat:"架构与运维",sub:"",diff:"进阶",type:"设计",tags:["GPU","弹性伸缩","冷启动"],
 q:"自建推理服务时，GPU 资源、弹性伸缩和冷启动怎么平衡成本？",
 intent:"GPU 运维是 AI 全栈的独特领域。考察成本控制与容量规划。",
 ans:[
  "先算清楚单位成本：单卡每小时成本 ÷ 该卡在目标负载下的 token 吞吐 = 每千 token 的成本。这个数字要和商业 API 对比，才能判断自建是否真的划算。注意用「实际利用率下的吞吐」而不是理论峰值——生产环境 GPU 利用率通常只有 40%–70%。",
  "冷启动是核心难题：加载一个 70B 模型到 GPU 需要几十秒到几分钟（读权重、初始化 KV Cache、CUDA 预热）。这意味着「按请求弹性扩容」在 GPU 场景基本不可行——等扩起来流量已经过了。",
  "应对策略：① 预留常驻容量（应对基线流量）+ 弹性补充（应对波峰）+ 排队削峰（应对突发）；② 预热池——始终保持若干已加载模型的实例待命，扩容时从预热池取而不是从零启动；③ 模型权重优化——用更快的存储（本地 NVMe 而非网络盘）、预热的权重缓存、量化减小体积。",
  "弹性策略：基于「队列长度 / GPU 利用率 / P95 延迟」而不是 CPU 做扩缩容指标（GPU 场景下 CPU 指标毫无意义）。扩容要提前（预测性扩容），缩容要保守（避免频繁扩缩导致的冷启动开销）。",
  "提高利用率的手段：① 连续批处理 + 高 batch size；② 多模型共享 GPU（用小模型填大模型的空档，或用 MIG 把一张 A100 切成多份）；③ 时间分片——白天跑在线推理，夜间用空闲卡跑离线批处理（embedding、评测、微调）；④ 请求合并与排队优化。",
  "成本优化组合：量化（INT8/FP8 在不明显掉点的情况下提升吞吐）、推测解码、选性价比更高的卡（如 L40S / A10 对某些场景比 H100 更划算）、Spot 实例跑离线任务（在线服务不能用）。",
  "多模型部署的现实：不要为每个微调模型单独部署一套 GPU。用 LoRA 热插拔（vLLM 支持多 adapter 共享基座）或模型按需加载，否则成本会随模型数量线性爆炸。",
  "容量规划：根据峰值 QPS × TTFT 目标 × 平均输出长度估算所需并发，反推 GPU 数量；留 30% 余量；定期（月度）复盘利用率并调整预留量。",
  "监控：GPU 利用率、显存占用、KV Cache 命中率、队列等待时长、batch size 分布、每 token 成本——这些才是 GPU 服务该看的指标。"
 ],
 follow:[
  "GPU 利用率只有 30%，你怎么提上去？",
  "峰值流量是日常的 10 倍，你怎么规划容量？",
  "多个微调模型怎么共享 GPU 而不爆炸成本？"
 ],
 fa:["30% 的利用率意味着你为大量空闲时间付了费，我从四个方向提升。第一是「让请求排队凑批」——愿意接受一点点队列等待，就能让 GPU 始终有活干；连续批处理配合合适的最大 batch size，通常能让吞吐提升显著。第二是「削峰填谷」——把离线批处理任务（批量 embedding、批量摘要、评测跑分）挪到低峰时段跑，用同一批 GPU 填满波谷，这是提升利用率最实际的办法；我还见过把内部工具和异步任务都调度到低峰的做法。第三是「自动扩缩容」——低峰期缩容到很小的规模，用更激进的缩容策略接受一定的冷启动风险；同时用预测性扩容应对已知的高峰。第四是「提高并发密度」——量化到更低精度（比如 INT4/FP8）能省下显存，省下来的显存正好用来提高并发数；另外如果模型较小，可以考虑多实例共享一张卡。最后我要提醒：先测量再优化，把 GPU 利用率、显存占用、队列长度做成时间序列看，确认瓶颈到底是显存、算力还是调度——很多时候利用率低是因为显存被 KV cache 占满导致并发上不去，这时候量化反而比加卡更有效。","10 倍峰谷比是一个非常典型的 AI 业务负载（白天工作时间是高峰，夜里几乎没人用），我的策略是「基线自建加峰值外溢」而不是全部自建。具体三层：第一层是自建容量覆盖「平均负载加一定余量」，比如按日常的 1.5 倍到 2 倍预留，剩下的巨大峰值不靠自建扛；第二层是峰值溢出到商业 API——虽然单位成本更高，但只为那一小部分溢出流量付费，比为了应对峰值常备 10 倍 GPU 划算得多；这本质上是用弹性换经济性。第三层是「错峰和排队」——把可以异步的任务（批量处理、非实时请求）引导到低峰执行用延迟换省钱；同时对实时请求在高峰期做功能降级（切小模型、缩短上下文、限制输出长度）。还有一条我一定会做：预留热实例加预测性扩容，因为 GPU 冷启动通常几十秒到几分钟，不可能靠实时扩容救急。最后我会把「峰值时的溢出比例」和「溢出成本」做成持续跟踪的指标，用它来决定要不要增加自建基线容量。","关键是避免「一个微调模型一份完整权重」这种乘法式膨胀。我最推荐的是 LoRA 适配器热插拔——所有微调共享同一个 base 模型权重（一份显存），不同的只是很小的 adapter（通常几十 MB），推理框架支持在同一个服务里按请求加载对应的 adapter；这样 N 个微调模型只占「一份大模型加 N 份小适配器」的显存，而不是 N 份大模型。当然它也有代价：不同 adapter 之间切换有开销，且并发混合较多时性能会受影响，所以要按流量大小做分级。第二是多实例共享——对调用量很小的微调模型，不要给它独占一张卡，多个实例共享 GPU（现代框架都支持），牺牲一点隔离性换利用率。第三是按使用频率分层：高频固定的微调模型合并权重后常驻部署（推理无额外开销），长尾的走LoRA 动态加载或者干脆按需冷加载。第四个策略是「能不微调就不微调」——很多时候业务需要的行为差异可以用不同的提示词加不同的 adapter 组合来实现，而不是训练独立模型。最后我会做成本归属——按每个微调模型统计它的请求量和实际占用的 GPU 小时，让每个业务方看到自己的成本，这往往比任何优化手段都更能抑制模型数量的膨胀。"],
 pass:"知道 GPU 冷启动慢，知道要预留容量。",
 good:"能给出单位成本的算法与实际利用率修正、预热池 + 常驻 + 削峰的冷启动应对、基于队列长度/利用率的扩缩容指标、四种提升利用率手段，以及 LoRA 热插拔避免多模型成本爆炸。",
 gl:"我先把成本的算法讲清楚，这是所有优化的前提。单位成本的正确算法是「每千次请求成本 = (GPU 小时单价 × 实例数 × 运行时间) / 期间处理的请求数」，而实践中大家最容易忽略的是「实际利用率修正」——你付的是 24 小时的钱，但平均利用率可能只有 30%，所以真实单位成本要除以利用率，这意味着如果利用率从 30% 提到 60%，单位成本直接减半，这个杠杆远大于任何模型层面的优化。冷启动的应对我讲三点：一是预热池——始终保持一批已加载模型的实例待命，虽然牺牲了一些利用率，但换来的是稳定的延迟，这是最常见的务实选择；二是常驻基线加关键层预加载；三是削峰——把可以延迟的批处理任务安排在低峰，顺便让 GPU 在低峰不空转。扩缩容指标我要强调不能用 CPU 那种简单的指标，而应该用「队列长度」和「GPU 利用率加 KV cache 占用」——因为它们才真正反映 LLM 服务的负载；扩容要有冷却时间避免抖动，缩容要优雅，保证正在处理的请求不被中断。提升利用率的四种手段：连续批处理让 GPU 不空转、削峰填谷把离线任务挪到低峰、量化以省下显存去提高并发数、以及潮汐调度和自动扩缩容。最后回到多微调模型的问题，这是 AI 特有的成本陷阱——如果每个微调模型一份完整权重，成本会线性爆炸；标准解法是 base 模型共享加 LoRA adapter 热插拔（通常会配合 vLLM 的多 LoRA 支持），把 N 份大模型压缩成一份大模型加 N 份几十 MB 的小适配器；同时按流量分层，高频的合并权重常驻、长尾的动态加载。最后我会加上成本归属——按模型统计实际占用的 GPU 小时，让成本可见。",
 red:"想按请求实时弹性扩容 GPU；用 CPU 指标做扩容；没算过单位成本就说自建省钱。"},

{cat:"架构与运维",sub:"",diff:"进阶",type:"开放",tags:["事故复盘","SRE"],
 q:"讲一次你经历过的 AI 应用线上事故，怎么复盘的？建立了什么防线？",
 intent:"考察真实经验和复盘质量。是否把一次事故转化为系统能力。",
 ans:[
  "听什么：候选人是否真的经历过（细节是否具体）、是否只讲技术原因（好答案一定包含流程与设计层面的根因）、以及最后是否沉淀为可复用的防线。",
  "好的复盘结构：时间线（什么时候发现、怎么发现、多久定位、多久恢复、影响范围）→ 直接原因 → 根因（为什么会发生，通常不止一层）→ 为什么没更早发现（监控盲区）→ 为什么恢复这么慢（预案缺失）→ 改进项（带 owner 和 deadline）。",
  "AI 应用典型的事故类型：① 成本事故——某个循环 bug 或 Agent 失控，一夜烧掉几万；② 质量事故——提示词改动或模型静默升级导致答案质量断崖，用户投诉；③ 数据泄露——RAG 忘记租户过滤、缓存 key 不含租户、trace 未脱敏；④ 依赖事故——上游模型服务限流/宕机，无降级导致全站不可用；⑤ 延迟事故——某个大文档检索拖垮整个服务。",
  "好答案应该体现的防线（按层次）：① 预防——设计层的强制约束（租户过滤在数据访问层强制、幂等、权限最小化）；② 检测——监控与告警（成本突增、质量指标下滑、错误率上升），很多事故是「用户先发现的」，说明监控缺失；③ 止损——熔断降级、一键回滚、预算硬上限、功能开关；④ 恢复——预案与演练，明确谁有权决策切换；⑤ 免疫——把事故的测试用例加入评测集/回归测试，确保不再发生。",
  "复盘文化：Blameless（不追责个人）——如果复盘结论是「某某不小心」，说明没找到真正的系统原因。好的结论应该指向「流程或系统允许了这件事发生」。",
  "改进项的可验证性：改进不能写成「加强测试」「提高警惕」这种无法验证的话，而要写成可检查的具体动作（如「在 CI 中加入跨租户越权的红线用例」「成本看板增加按功能的日环比告警」）。",
  "红旗信号：把事故全归咎于外部（模型厂商、用户操作）、没有量化影响、改进项没有跟进闭环。"
 ],
 follow:[
  "这次事故影响了多少用户？损失多少？怎么量化的？",
  "改进项后来真的落地了吗？怎么确认的？",
  "如果重来一次，你会在架构的哪个环节提前设防？"
 ],
 fa:["我会给一组具体的数字而不是含糊带过，因为量化的影响决定了后续投入的优先级。以我经历过的一次为例：一次提示词的模型静默升级导致某类问题的答案格式变化，影响了大约 12% 的请求，持续了 4 小时；量化方式上，用户影响靠「受影响请求数除以独立用户数」计算，业务损失主要看两个：一是客服进线的增量（我们用小时级的进线量对比同期基线，多出的部分乘以单次人工成本），二是功能使用量的下降和用户流失的次日回访率；直接的钱其次次要——额外消耗的成本按错误请求的 token 乘以单价。这里我要坦白说：很多损失是难以精确归因的，所以我倾向于用一个保守的下界数字而不是夸大。另外我认为更重要的是这次之后把这个量化方法固化下来——建立「影响面自动化估算」的能力（按错误率乘以流量直接算出来），因为事故发生时你根本没有时间做精细分析。最后我会说明：事故的复盘报告里量化的部分要包含「如果晚发现一小时会多损失多少」，这是说服管理层投入的最好材料。","这是我最想强调的一点，因为绝大多数复盘都止步于此。我的做法是三件事：一是每个改进项必须落到具体的工单系统里，有明确 owner、有截止日期、有可验证的验收标准——「加强监控」这种不可验收的项不允许存在，必须写成「添加 XX 指标并在超过 YY 时告警」。二是建立验证闭环——改进上线后要在复盘会上演示验证：监控截图、告警触发记录、甚至重新做一次故障注入确认防线真的生效；我倾向于做「定期演练」而不是一次性验证，因为防线会随着时间腐化。三是公开的跟踪看板——改进项的完成率要能被看到，我会把它作为团队的一项常规指标。我还学到的一个教训是：改进项一定不要太多，一次事故产出二十个改进项的结果通常是一个都做不完；优先做三到五个真正能防止同类问题的，其余作为技术债排期。最后如果要诚实回答：确实有没落地的项，通常是因为它的优先级在后续被更高的价值事项挤掉了，这类我会明确标记为「已知风险」而不是假装做了。","我会诚实地说通常有一到两个「早该做」的点。以这类事故来说，我会提前在三处设防：第一处是「版本钉死加回归巡检」——如果使用商业 API，我会在一开始就 pin 具体模型版本并每天用固定的评测集跑一次回归，任何指标的台阶式变化立刻告警；这个成本很低，但它恰恰能拦住绝大多数静默升级类的事故，我当时没有做是因为低估了供应商变更的频率。第二处是「盲指标告警」——我们监控了错误率和延迟，但没有监控答案的分布特征（比如输出长度、拒答率、结构化失败率），而这些代理指标往往比最终结果早几个小时给出信号。第三处是「快速回滚的能力」——花五分钟就能把配置切回上一个版本，而当时我们的回滚需要重新部署，多花了一个小时。总体教训是：AI 系统的事故很少是「服务挂了」这种显式故障，更多是「质量悄悄劣化」，所以防线应该围绕「质量的可观测和可回滚」来建，而不是围绕可用性。"],
 pass:"能讲出一个具体的事故和大致的处理过程。",
 good:"有清晰的时间线与量化影响，根因分析到流程/设计层而非个人，改进项包含预防/检测/止损/恢复/免疫五层防线且可验证、有闭环，并体现 blameless 文化。",
 gl:"我讲一次真实的:某天下午客服突然反馈「AI 回答格式变了、字段对不上」，导致下游解析失败。时间线是：14:20 用户侧开始出现格式错误并进线投诉；14:50 我们通过异常率告警发现（这是第一个问题——比首次发生晚了半小时，因为当时只监控了可用性和延迟，没有监控格式类错误率）；15:10 定位到是某次模型调用返回的结构发生变化；15:40 确认是商业 API 侧的静默版本变更；16:00 回滚到 pin 住的旧模型版本后恢复。影响面是约 12% 的请求受影响、持续约 4 小时、客服进线量比同期基线高出约两倍。根因分析我没有停在「供应商改了模型」，而是用五个为什么追到设计层：为什么一个下游依赖的变更我们能毫无察觉？因为我们没有 pin 版本、也没有对上游输出做契约校验——这才是根因。改进项我按五层防线来建，这是我复盘的固定框架：预防（所有外部模型调用必须 pin 具体版本，禁止别名；提示词、模型、知识库版本要作为一等公民记录）；检测（增加输出格式的结构化失败率作为一级指标并告警；增加答案长度、拒答率这类分布型的代理指标；每天跑一次固定评测集的回归巡检）；止损（模型层面做成可被一键回滚的配置，而不是需要重新发布）；恢复（把 LLM 调用做成可缓存、可重放，出错的请求能在修复后批量补偿重试）；免疫（下游解析要容忍上游格式的一定变化，不能硬假设）。复盘文化上我坚持 blameless——不追「谁改的」，而是问「为什么我们的系统允许一个未经验证的变化影响到用户」。最后所有的改进项都落成了带 owner 和截止日期的工单，并在一个月后做了一次故障注入演练来验证它们真的生效——这一步我认为是复盘有没有价值的分水岭。",
 red:"讲不出具体经历；把原因全推给外部或同事；改进项是「以后注意」这种空话。"},

{cat:"软技能",sub:"",diff:"进阶",type:"开放",tags:["项目决策","技术选型"],
 q:"讲一个你主导的 AI 项目：最难的技术决策是什么？放弃了什么？如果重来会怎么选？",
 intent:"考察技术决策的深度与反思能力。5 年经验必须能讲清 trade-off。",
 ans:[
  "听什么：① 候选人是否真的是「主导」而非「参与」（能说清为什么这么选、谁反对、怎么说服的）；② 是否讲出了真实的两难（如果说「一切都很顺利」通常说明没做过复杂项目）；③ 是否有事后的反思与修正。",
  "好的回答结构：背景与目标（业务约束、时间、人力）→ 候选方案（至少两个）→ 决策依据（数据、约束、风险）→ 执行结果 → 事后反思（哪里判断对了、哪里错了、如果重来怎么改）。",
  "加分点：讲得出「主动放弃的东西」——比如放弃了自建模型选择 API、放弃了多 Agent 选择单 Agent、放弃了完美方案选择先上线。能说明放弃的理由（成本、时间、团队能力）是成熟的表现。",
  "加分点：决策时用数据支撑（做了 PoC、跑了评测、做了对比实验），而不是「我觉得」。",
  "加分点：考虑了非技术因素——团队能力、运维负担、业务节奏、合规要求。纯技术最优解在现实中往往不是正确解。",
  "加分点：承认判断失误并说明如何修正。能从失败中学到东西的人比从没失败过的人更可靠。",
