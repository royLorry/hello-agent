{cat:"LLM应用工程",sub:"RAG",diff:"基础",type:"概念",tags:["RAG","链路拆解"],
 q:"把一次 RAG 问答的完整链路拆开讲一遍，并说明质量瓶颈通常出现在哪几个环节。",
 intent:"最基础的 RAG 全貌题。5 年经验应能不假思索地拆出 offline/online 两段，并指出真实瓶颈。",
 ans:[
  "离线链路（索引期）：文档接入 → 解析（PDF/Word/HTML/表格/图片）→ 清洗 → 切分（chunking）→ 向量化（embedding）→ 写入向量库（同时保留原文与元数据）→ 可能还有摘要/关键词/知识图谱等增强索引。",
  "在线链路（查询期）：Query 理解与改写 →（可选）多路召回：向量检索 + 关键词 BM25 + 结构化过滤 → 融合去重 → Rerank 精排 → top-k 截取与上下文组装 → 拼入提示词 → LLM 生成 →（可选）引用标注与后校验。",
  "真正的瓶颈往往不在「向量模型不够强」，而在：① 解析环节——PDF 表格、多栏排版、扫描件解析错了，后面全白搭；② 切分环节——chunk 切碎了语义不完整；③ query 改写缺失——用户问的是口语/代词指代，「它多少钱」这种直接检索必挂；④ 召回漏了——top-k 里根本没有正确文档，rerank 再强也没用。",
  "定位方法：分段埋点。离线看「解析成功率、chunk 语义完整度」；在线看「正确文档是否在召回 top-20 内（召回率）」和「是否在 rerank top-5 内（精排准确率）」。先确认是召回问题还是重排问题，再针对性优化。",
  "如果正确文档连 top-20 都没进，调 rerank 是浪费时间；如果 top-20 里有但 top-5 里没有，才该优化 rerank。这个判断顺序是 RAG 调优的核心方法论。"
 ],
 follow:[
  "你怎么定义和计算「召回率」？没有标注数据怎么办？",
  "正确文档在 top-20 但总排第 18，你会动哪一段？",
  "解析环节你怎么验证质量？有没有量化的手段？"
 ],
 fa:["在没有标注数据之前，我会先明确「召回率」在我们语境里的定义：候选集合里包含至少一条能支撑答案的文档的请求占比，也就是 recall@k，而不等价于传统 IR 的精确定义。没有标注的话有三条路可以走。第一条是用模型自动生成伪标注，用强模型基于文档生成问答对，反过来拿问题去检索，看原文档有没有被召回，这个方法成本低但要注意避免自洽循环。第二条是针对拥有天然正样本的业务——比如工单系统里工单和处理文档的关联关系、代码块到文档的引用关系——这些数据是现成的标注，质量比生成的高。第三条是最容易被忽略但最实用的：直接做线上 bad case 归因，人工看几十个答错的样本，统计其中多少是因为没召回导致的，这个比例就是最粗但有业务说服力的召回率。我通常会二三条并行，先有一個粗糙的数，再逐步做精。","排第 18 说明召回链路没问题，材料已经被捞出来了，问题在排序，也就是粗排阶段的 embedding 相似度没有把它识别出来。这时候我会先看这第 18 篇和排在前面的文档有什么特征差异——常见情况是它用了大量同义表述、或者包含否定与例外，语义向量对这类差异不敏感。针对这种情况我有三个按成本递增的选项：成本最低的是加一路 BM25 做混合检索，字面命中往往能救回这类；其次是加 embedding reranker（cross-encoder）对 top-50 重排，这个提升最明显但有额外延迟；最后才是动 embedding 模型，成本最高、收益最不确定。我一般不会一上来就换 embedding 模型，那是最贵且最难评估的一步。另外我会检查一下是不是切分的问题——如果这篇文档因为切得太碎导致单个 chunk 语义不完整，那排序再好也没用。","这是经常被跳过但最关键的一环，我的做法是抽样加专项用例。抽样是每次改解析策略后随机抽 50 到 100 份文档，人工或半自动检查产出物是否保留了原文语义、标题层级有没有丢、表格有没有散架。专项用例是针对已知难点构造的：多级标题、跨页表格、脚注、图文混排、扫描件 OCR。量化手段我比较推荐两个：一是构造一份「探针题目」，答案明确落在某个表格或某个标题下的特定段落，看端到端能不能答对，把解析质量翻译成功率指标；二是做 Round-trip 校验，从解析后的结构化内容反渲染回文本，和原文做相似度比对，低于阈值就告警。还有一个便宜的工程手段：给每个 chunk 记录它的解析来源和置信度，把低置信度的 chunk 标记出来，便于定位问题。"],
 pass:"能完整说出离线/在线两段的主要步骤。",
 good:"能指出瓶颈在解析/切分/query改写/召回四处的实战经验，并给出「先看召回再看精排」的分段定位方法论。",
 gl:"我把 RAG 链路拆成六段：离线是文档解析、切分、索引（含元数据）；在线是 query 改写、召回、重排与生成。从实战看质量瓶颈高度集中在四处，按出现频率排大概是：第一是解析，PDF、扫描件、表格这些格式一旦解析坏了，后面再怎么优化都是徒劳，这是最容易被低估的环节；第二是切分，切得太碎导致语义不完整、切得太大导致噪声，还会把表格和跨段内容截断；第三是 query 改写，尤其是多轮对话里的指代消解，用户问「它多少钱」，原样去检索必然召回错误；第四才是召回本身，包括 embedding 是否适配领域、是否需要混合检索。而大家最爱怪罪的生成环节，实际占比反而最低。定位问题的方法论是「先看召回再看精排」：答错时先人工确认正确文档有没有被召回，没召回就往前修解析切分和 query 改写，召回了但排序靠后就修重排，召回了也排前列了还答错才动生成和提示词。这个顺序能避免我们把力气花在概率最低的地方。",
 red:"只说「文档切块 → 向量化 → 检索 → 生成」四句话；或认为效果不好就换更好的 embedding 模型。"},

{cat:"LLM应用工程",sub:"RAG",diff:"进阶",type:"设计",tags:["Chunking","切分策略"],
 q:"Chunking 策略怎么选？固定长度、递归切分、语义切分、按文档结构切分分别适用什么场景？chunk size 如何确定？",
 intent:"考察是否真的做过知识库调优，还是照抄别人的 512/1024。",
 ans:[
  "按文档结构切分（标题层级、段落、表格行）效果通常最好，因为保留了语义边界；适用于有清晰结构的文档（制度、手册、API 文档、Wiki）。",
  "递归字符切分（RecursiveCharacterTextSplitter）是通用兜底：按 \n\n → \n → 。 → ，逐级降级切，尽量不断句，适合结构混乱的长文本。",
  "固定长度 + overlap 最简单但最容易切断语义，只适合作为 baseline 或处理无结构文本。overlap 一般取 chunk size 的 10%–20%，用于缓解跨块信息断裂。",
  "语义切分（按相邻句子 embedding 相似度断裂点切）：效果上限高但成本也高（要额外算 embedding、阈值难调、耗时），适合对质量要求极高、文档量可控的场景。",
  "chunk size 没有魔法数字，取决于：模型上下文窗口、单 chunk 需要承载的完整语义单元大小、检索 top-k 数量。常见区间 300–800 token。要按文档类型分：FAQ 类可以一问一答一个 chunk（很短），制度类按章节（较长）。",
  "定 size 的方法：构造评测集，跑 256/512/1024 几档对比召回率与最终答案质量，选拐点。同时看「单 chunk 是否自包含」——抽 50 个 chunk 人工看，读不懂的占比越高说明切得越碎。",
  "增强手段：给每个 chunk 加上所属标题路径作为前缀（如「第三章 > 报销标准 > 差旅」），这一步对小 chunk 的效果提升非常明显；表格类单独处理，不要按字符切开表格。"
 ],
 follow:[
  "加了标题前缀之后召回率提升了多少？怎么测的？",
  "表格被切断了怎么办？",
  "同一段落被切进两个 chunk，检索只召回其中一个，怎么处理？"
 ],
 fa:["我先说结论，加标题前缀这个动作的收益相对稳定，我们在文档型知识库上测过，召回率大概提升 8 到 12 个百分点，但需要说明这个数字依赖场景，文档标题信息量越大收益越高。测法会比较严格：固定 chunkSize 和 embedding，只在是否加标题前缀这一个变量上做对比「一级标题>二级标题>文档标题」这个路径前缀，然后用同一份评测集跑 recall@10，同时看端到端答案准确率，防止只优化中间指标。这里有个反面情况值得提醒：如果所有文档共享同一个顶层标题，这个前缀就是纯噪声，会拉低区分度，所以我会对前缀做去重和信息量过滤。另外前缀不能太长，我一般限制在 50 到 80 个字符以内，超出反而会稀释正文的语义权重。","表格是 RAG 里公认的硬骨头，我从三个层面处理。解析层用专门的表格解析，输出 Markdown 或 HTML 结构而不是纯文本行，保留行列关系；同时对跨页表格做合并，用表头重复检测来把断开的部分接回去。切分层把表格当成一个不可分割的原子单元，禁止按字符数把它切断，超过单个 chunk 上限时按行拆分而不是按字符，并且每一行都带上表头，保证子块自解释。检索层针对表格做两件事：一是用 LLM 给表格生成一段自然语言摘要和可能的提问列表，索引这个摘要让它能被语义命中；二是对明确的结构化查询走 Text-to-SQL 或结构化查询分支，而不是硬塞进向量检索。某些场景我还会把表格单独存成结构化数据，向量索引里只存指向它的指针。","这是重叠切分（Overlap）要解决的核心问题，但实际用量要克制。我的常用设置是 chunk size 的 10% 到 15% 作为重叠区间，太大就只是把 index 撑大、检索成本上升而收益递减。但重叠只是缓解，真正有效的做法有两个：一是从源头保证语义完整性，按标题层级和段落边界切而不是纯粹按字符数，让「一句话被切开」这件事少发生；二是在检索侧做邻域扩展，命中某个 chunk 之后，自动把它前后相邻的 chunk 也带上再一起去重合并，这样既保持了 chunk 小而精准，又能在生成时拿到完整上下文——这个比单纯加大 overlap 更灵活。另外元数据里一定要记清楚 chunk 的前后序关系，否则邻域扩展没法做。"],
 pass:"能说出几种切分方式和各自的适用场景，知道 overlap 的作用。",
 good:"能给出「按文档类型差异化切分 + 标题路径前缀 + 小模型/大模型摘要增强 + 用评测集跑档位拐点」的组合方案，并强调表格要特殊处理。",
 gl:"我会先说一个前提：chunk 策略没有银弹，必须按文档类型差异化，所以我的第一步永远是做文档分类——合同、API 文档、Markdown 笔记、PDF 报告、表格密集财报，这几种的最优策略完全不同。选择逻辑是这样的：有清晰结构的文档用结构切分，按标题层级往下拆，章节太长再递归细分到限制范围内，这类效果最好；Markdown 和代码用递归切分，天然的边界符号比字数限制靠谱；纯叙述性长文才用固定长度加 overlap 保底；语义切分效果不错但成本高、结果不稳定，我一般只在高价值小语料上用。chunk size 不拍脑袋，我会用评测集跑 256/512/1024/2048 几个档位，画召回率和答案准确率两条曲线找拐点，我们多数场景落在 512 左右，API 文档偏大、FAQ 偏小。三个增强手段几乎是必做的：一是给 chunk 加标题路径前缀；二是对长 chunk 用小模型生成摘要一并索引；三是表格、代码块作为特殊类型单独特判。最后我会强调，切分一旦上线很难改，因为它决定整个索引的形态，所以宁可前期多花时间做评测。",
 red:"直接报「512 重叠 50」这种抄来的数字且说不出依据；或认为切分越细越好。"},

{cat:"LLM应用工程",sub:"RAG",diff:"进阶",type:"概念",tags:["混合检索","RRF","BM25"],
 q:"为什么要用混合检索（BM25 + 向量）？多路结果怎么融合？RRF 是什么，权重怎么调？",
 intent:"RAG 效果调优的分水岭题。纯向量检索在真实业务里几乎必然不够。",
 ans:[
  "纯向量检索的短板：对精确匹配无能为力。用户搜「错误码 E2043」「型号 XT-900」「《员工手册》第 3.2 条」这类专有名词、编号、缩写，语义向量会返回一堆语义相近但完全不对的结果。而 BM25 对这类词命中极准。",
  "纯 BM25 的短板：无法处理同义、改写、口语化表达。用户问「怎么报销打车费」，文档写的是「交通费用报销规范」，字面重合度低，BM25 召回不到。",
  "所以混合检索是互补：向量负责「语义召回」，关键词负责「精确召回」，两路取并集能显著提升召回率上限。",
  "融合方式：① RRF（Reciprocal Rank Fusion）—— 只利用排名位置，score = Σ 1/(k + rank_i)，k 通常取 60。优点是不需要归一化各路的分数（向量相似度和 BM25 分数量纲完全不同，直接加权很难调），鲁棒性最好，是首选。② 加权分数融合——需要把两路分数归一化到同一区间（min-max 或 rank-based），可以按 query 类型动态调整权重。",
  "调权重的方法：构造带标注的评测集，对比「纯向量 / 纯 BM25 / RRF / 加权 0.3:0.7 / 0.5:0.5」等配置的 recall@5 与 nDCG。不要用拍脑袋的固定值。",
  "进阶：query 路由——识别 query 里是否含编号、专有名词、精确引用，有就提高 BM25 权重；是自然语言问句就提高向量权重。这个路由可以用小模型或规则实现。"
 ],
 follow:[
  "RRF 里的 k=60 是怎么来的？改大改小有什么影响？",
  "两路召回结果重复了怎么处理？",
  "除了向量和 BM25，你还会加第三路召回吗？（如同义词词典、知识图谱、SQL）"
 ],
 fa:["k=60 是原论文里给出的经验值，不是推导出来的最优解，所以不用神化它。它的作用是平滑 rank 的贡献衰减：某个文档排名第 r，它的贡献是 1/(k+r)，k 越大这个函数越平——也就是第 1 名和第 20 名的差距被压缩，各路召回的权重趋于平均；k 越小这个函数越陡，头部排名的优势被放大，等价于更信任单路召回的绝对靠前选项。所以我的调参直觉是：如果两路质量接近、希望互相纠错，用较大的 k；如果某一路明显更可信、希望谁的头部谁说了算，用较小的 k。实操上我会把它当超参在评测集上跑 20、60、100 三档，看 recall@10 和最终准确率，成本很低，别直接抄默认值。","重复其实是好事，不是问题——两路都命中说明信号很强，RRF 的机制天然会给它更高的融合分，这本身就是一种交叉验证，所以我不去重反而会自动加权。真正要处理的是「去重后的多样性」：如果 top-5 全是同一篇文档的不同 chunk，那这 5 条对用户只相当于 1 条有效信息。我的做法是按文档ID而非 chunk ID 做一次收敛，同一文档最多保留 2 到 3 个最相关 chunk，剩下的位置让给其他文档。另外融合阶段我会同时看 chunk 级和 doc 级两个视图，风险控制也很重要：某些场景比如法律法规，同一条款出现在多个版本文档里，这时候必须保留全部才能给出完整答案，去重反而有害。所以规则要按场景配置。","会，但我会先问一个问题：前两路的 bad case 是不是集中在某一类模式上？加第三路的判断标准是有明确的失效pattern。具体考虑第三路的几种典型：一是同义词和业务术语词典，内部黑话、产品代号、缩写这类 embedding 完全没见过词，向量空间里就是乱指，术语表是性价比最高的一路；二是知识图谱或实体关系，适合「A 部门和 B 部门是什么关系」这类需要显式关系的查询；三是结构化查询，明确涉及统计、排序、时间范围的（比如「去年 Q3 销售额最高的产品」）必须走 SQL 而不是语义检索，这是很多 RAG 项目翻车的地方——用向量去回答聚合统计问题，天然不可靠。加了第三路之后，我更倾向于做「路由」而不是简单加权，让分类器决定这一问主要由哪路主导，比盲目融合效果更好。"],
 pass:"知道向量和关键词是互补的，能说出加权融合。",
 good:"能讲清两种检索各自的失效场景，理解 RRF 相比加权融合的优势（免归一化），并能用评测集量化调参、提到 query 路由。",
 gl:"我会先从两者的失效场景讲起，这是混合检索存在的理由。纯向量检索的短板在字面精确匹配：产品型号、错误码、人名、缩写、法律条款编号，这些词的语义向量几乎无区分度，「A-100」和「A-200」在向量空间里可能非常接近，但它对用户完全是两回事；另外它对罕见词和训练时不存在的内部术语也很脆弱。纯 BM25 的短板则相反，它只会字面匹配，同义改写、中英文混问、意图模糊的长问句，召回质量会崩。所以两者是互补的，覆盖不同 query 类型。融合上我优先选 RRF 而不是加权求和，关键原因是分数不需要归一化——向量的余弦相似度落在 0 到 1，BM25 是无上界的整数分数，两者量纲不可比，加权融合前要做归一化，而这个归一化在不同 query 上还容易失真；RRF 只看排名不看分数，天然免疫量纲问题，鲁棒性好得多。权重我一般理解为「参与融合的路径和各路的 top-N 深度」，而不是一个 0.7/0.3 的魔数，用评测集系统性扫描，以 recall@10 和端到端准确率为目标函数。如果两路质量差异很大或者 query 类型可判别，我会进一步做 query 路由——让分类器决定这一问主要信任哪一路，这通常比盲目融合拿到更高的上限。",
 red:"只做向量检索且认为够用；或把向量相似度和 BM25 分数直接相加做加权，说不出归一化的必要性。"},

{cat:"LLM应用工程",sub:"RAG",diff:"进阶",type:"设计",tags:["向量数据库","选型"],
 q:"向量数据库怎么选型？PGVector、Milvus、Qdrant、Elasticsearch 各自适用什么规模？",
 intent:"考察选型能力，而非跟风。5 年经验要能从数据量、团队、运维成本综合判断。",
 ans:[
  "先说结论：绝大多数团队（千万级向量以内）PGVector 就够了，别一上来就上 Milvus。选型的隐性成本是运维复杂度和团队熟悉度，这部分常被低估。",
  "PGVector：数据量 ≤ 千万级、QPS 不高、已在使用 Postgres 的团队首选。优势是能和业务数据同库做 JOIN、事务一致、运维成本几乎为零。劣势是超大规模和高并发下性能与扩展性有限，HNSW 索引内存占用较大。",
  "Qdrant：独立的向量数据库，Rust 实现，资源占用友好，支持丰富的元数据过滤（payload filter），部署简单，适合百万到亿级、需要完善过滤能力的场景。",
  "Milvus：面向亿级以上、高吞吐的生产级场景，支持分布式、多种索引类型、GPU 加速，但运维复杂度显著更高（依赖 etcd、MinIO 等组件），需要专门人力。",
  "Elasticsearch（dense_vector + kNN）：已有 ES 技术栈的团队价值最大——可以天然把关键词检索和向量检索放在一次查询里完成，混合检索实现最省事；向量性能不如专用库，但对中等规模完全够用。",
  "选型维度清单：数据规模（向量条数 × 维度）、QPS 与延迟要求、是否需要强元数据过滤、是否需要混合检索、是否要事务/与业务库一致性、团队现有栈、托管 vs 自建、成本。",
  "额外要点：HNSW 与 IVF 的取舍（HNSW 查询快、内存大、构建慢；IVF 内存小、需要训练、召回率靠 nprobe 调）；过滤方式选 pre-filter 还是 post-filter 会显著影响召回率，要实测。",
  "架构建议：把向量访问抽成 Repository 层，选型可替换，避免业务代码和 Milvus SDK 深度耦合，将来迁移不至于伤筋动骨。"
 ],
 follow:[
  "从 PGVector 迁到 Milvus 的触发条件是什么？你会在什么量级开始做准备？",
  "元数据过滤导致召回变差（过滤后候选不足），怎么处理？",
  "HNSW 的 ef_search / M 参数怎么调？调了有什么副作用？"
 ],
 fa:["我不用单一指标做触发，而是一组信号。最硬的三个是：向量量级超过千万到两千万级别后 PGVector 的检索延迟和内存压力显著上升；P95 检索延迟超过我们的 SLO 而且通过调索引参数已经压不下来；需要混合检索、复杂元数据过滤或者分布式水平扩展，而这些在 PGVector 里要么不支持要么性能很差。有趣的点是「什么时候开始准备」比「什么时候迁」更重要——我会在量级到百万并且增速可观时就把抽象层做出来，把所有向量操作收敛到一个 Repository 接口后面，这样真正迁移的时候只是换实现，业务代码零改动。千万不要等扛不住了再动，那时候你面对的是一边救火一边换引擎。","这个问题本质是「带过滤条件的 ANN 检索」。首先要判断是 pre-filter 还是 post-filter：pre-filter 先按元数据筛再在子集里做 ANN，精度高但候选太少时会遍历不到足够的近邻，尤其 HNSW 图被过滤条件切断后连通性变差，容易出事故；post-filter 先 ANN 拿到 top-N 再过滤，问题是命中的可能全被过滤掉，返回空。我常用的解法有两个：一是给过滤字段建专门的索引，让过滤后的子集仍然足够大并且能走高效的图遍历；二是做「过滤降级」，当某次过滤化的候选数低于阈值时自动放宽——放宽到只保留最关键的过滤维度、或者按相关性对过滤字段做软匹配而不是硬过滤。产品上也要有兜底：结果少于 N 条时明确告诉用户「在当前筛选条件下只找到 X 条，放宽条件可以看到更多」，而不是返回空让人困惑。","M 和 ef_search 是效果与资源的一对权衡。M 是构建期参数，控制每个节点的连接数，M 大则图更密、召回率更高但内存占用更大、构建更慢，而且它一旦建好就基本不能改，所以要一开始就根据可用内存定好，常见 16 到 32。ef_search 是查询期参数，控制候选队列大小，调大则召回率上升但查询延迟线性上升，这个是可运行时调的，也是我最常用的调优旋钮。副作用要说清楚：ef_search 调大的代价是延迟抖动，尤其在并发高的时候会放大 P99，所以我不会拍一个很大的值，而是按业务的延迟预算反推——在可接受 P95 内取最大能承受的 ef_search。实践里我会用「召回率-延迟」曲线来标定：用一份有标注的评测集，测 ef_search 在 32/64/128/256 下的 recall@10 和 P95，找一个膝盖点。另外别忘了 ef_construction，构建质量不够的话查询期再怎么调也救不回来。"],
 pass:"能说出 PGVector 适合中小规模、Milvus 适合大规模，知道 HNSW 索引。",
 good:"能按规模给出明确分档建议，把运维成本和团队栈纳入决策，讲清 pre/post-filter 与索引参数取舍，并提出可替换的抽象层。",
 gl:"我会先说一个经常被忽略的前提：选型里技术性能往往是次要因素，团队栈和运维成本才是决策主导。具体分档我的建议是这样——十万到百万级向量、团队已经在用 PostgreSQL、需求是简单的相似性检索加过滤，PGVector 是正确答案，理由不是它最强而是它最省：不用引入新组件、不用新建备份和监控体系、事务一致性还能直接复用数据库的事务，一个小团队用它能扛很久。百万到千万级、需要 HNSW 的高效索引和丰富的过滤DSL、团队也想压成本，Qdrant 或者 Weaviate 这类独立的向量库更适合，Qdrant 的过滤能力和资源占用在中小规模上口碑很好。千万级以上、需要分布式分片、多副本、混合检索一体，Elasticsearch/OpenSearch 或者专门的 Milvus 才值得引入。Elasticsearch 的优势是很多团队已有现成的集群和运维能力，顺带解决了 BM25 混合检索；Milvus 的架构是面向超大规模设计的，但运维复杂度明显更高，要有专门人力。所以我的结论是不要一上来就选最「专业」的，从 PGVector 起步，用抽象层隔离，等到明确的信号触发再迁移。规模这个词背后真正要问的是三个数：向量总量、QPS、延迟预算，加上团队愿不愿意为它值夜班。",
 red:"不管什么场景都说上 Milvus；或说不出任何选型依据，只说「业界主流方案」。"},

{cat:"LLM应用工程",sub:"RAG",diff:"进阶",type:"设计",tags:["Embedding","模型选型","中文"],
 q:"Embedding 模型怎么选、怎么评估？中文场景有哪些常见的坑？",
 intent:"考察评估方法论。很多人只会说「用 bge」，说不出为什么和怎么验。",
 ans:[
  "选型维度：语言支持（中英双语 vs 纯英文）、维度（1024 vs 768 vs 384，直接影响存储与检索速度）、最大输入长度（能覆盖你的 chunk 长度）、是否支持指令前缀（如 bge 的「为这个句子生成表示：」）、是否支持 Matryoshka（可截断维度）、许可协议。",
  "中文常见坑：① 很多开源模型中文语料不足，中英混合、中数混排效果差；② 中文分词不是问题，但「语义相近字面不同」的成语、行业黑话、内部缩写容易被当成不相关；③ 查询词很短（「报销」）而文档很长，短句-长文档的向量空间不对齐，需要非对称检索能力（bge 的 query/passage 前缀就是解决这个）；④ 多音字、同形词、简繁体；⑤ 公司内部术语、产品名、人名，通用模型基本没见过，必须靠微调或混合检索兜底。",
  "评估方法（核心）：不要看公开榜单（MTEB）直接选——榜单和你的业务分布往往不一致。要构造自己的评测集：从真实日志里抽 200–500 条 query，人工或用 LLM 标注相关文档，然后算 recall@5 / recall@20 / nDCG@10 / MRR。",
  "评估还要注意：测「难负例」——语义相近但答案不同的文档（如「差旅报销标准」vs「差旅报销标准（2023旧版）」），通用榜单不考这个，但这才是真实线上最难的部分。",
  "落地建议：先跑 3–4 个候选模型（bge-m3、bge-large-zh、gte、Conan、Cohere/BGE 商业版）对比；如果 top-3 差距在 3% 以内，选更快更便宜的而不是分数最高的。",
  "别忘了 rerank：embedding 负责召回（要快、要全），rerank 负责精排（cross-encoder，要准）。两者是不同角色，不要用 embedding 相似度去承担精排职责。"
 ],
 follow:[
  "你的业务评测集怎么构造的？标注从哪来？",
  "换 embedding 模型意味着全量重建索引，你怎么低风险地做这件事？",
  "什么时候该微调 embedding 模型？"
 ],
 fa:["构造方式我分三个来源，优先级从高到低。第一是线上真实日志，这是最有价值的——把用户的真实 query 和最终点击/采纳的结果整理出来，尤其是那些答错被点踩的样本，它们天然是难例；我还会从客服工单里捞人工回答过的历史问答对。第二是业务方标注，找几个最懂业务的同事花半天标注 100 到 200 条，关键是 query 到正确文档或段落的对应关系，不需要精细打分，只要「哪些文档能回答这个问题」。第三是模型生成，用强模型基于文档反向生成问题来扩充语料，但我会把它当成补充而非主力，因为生成的问题分布和真实用户差异很大，容易出现自洽循环。数量上我的经验是 100 条高质量用例就能支撑起有效的对比决策，不必追求上千条。另外评测集里必须包含专门的难负例——主题相近但答非所问的文档——否则区分度不够，好模型坏模型得分都一样。","核心是「永远不要在原位替换」，要做双索引并存。流程是这样的：先新建一份索引 v2，离线灌入所有数据；同时把 embedding 服务封装成带版本号的接口。上线第一阶段双写——新文档同时写入两个索引，查询仍然全部走 v1；第二阶段影子流量——随机采样一小部分请求，同时在 v2 上跑一遍，把两路的召回结果记下来做离线对比，看 recall@10 的差异和 bad case；第三阶段小流量把真实请求路由到 v2，盯线上指标；确认稳定后切全量，最后下线旧索引。整个过程的关键前提有两个：一是原始数据必须可靠留存，否则重建就是灾难；二是有评测集指标作为放行门禁，而不是靠感觉。成本上全量重建确实贵，所以我会先在一个子集上验证收益再决定是否全量。","我的判断标准比较保守，因为这是一件投入产出比不高的事，要满足三个条件才考虑。第一，你有一个垂直领域并且语料规模可观（至少几十万到百万级的 query-doc 对），通用模型对你们领域的术语、简写、实体关系完全没有认知；第二，你已经确认瓶颈确实在 embedding 侧——也就是经过评测，正确文档在向量空间里确实没被拉近，而不是排序、切分或 query 改写的问题；第三，你已经把不需要训练的手段用尽了，包括更好的 rerank、混合检索、query 改写、加元数据。满足这三条之后还要权衡：微调 embedding 需要持续的负样本构造能力和训练pipeline，模型更新时还要重训，长期有维护负担。坦白说我经历过的大部分场景，最终都不是靠微调 embedding 解决的，而是靠加 rerank 和修 query 改写。只有在搜索/推荐这种核心业务且有专职团队时，这笔投入才划算。"],
 pass:"知道几个主流中文 embedding 模型，知道要用评测集评估。",
 good:"能给出自建评测集 + 难负例的完整评估方法，讲清中文特有的短查询长文档、内部术语等坑，并明确区分 embedding 与 rerank 的职责。",
 gl:"我的评估方法是「自建评测集优先，公开榜单只看能否定候选」。公开榜单的分数只能用来初筛，因为它的分布和我们的业务语料差很远，尤其中文榜单还有数据集污染问题。真正决定选型的是我们自己的评测集，我通常按三步来做：第一步建 100 到 200 条 query-doc 对，query 来自线上真实日志，标注由业务同学完成，并刻意在里面放难负例——主题相近但答非所问，这是让评测有区分度的关键；第二步看的核心指标是 recall@10 和命中文档的排序位置，而不是审美层面的「向量好不好」；第三步才看次要因素，包括向量维度带来的存储成本、推理延迟、上下文长度限制（很多模型只支持 512 token，长文档会被截断，这是最常见的坑）、是否需要自部署。中文场景的几个坑我踩过：一是短查询长文档的不对称，很多模型只提供单塔或对称语义的向量，必须选支持 query/doc 分别加前缀的非对称模型；二是内部术语和黑话，需要在评测集里专门覆盖；三是中英混排和数字敏感度；四是分词和繁简、标点噪声。最后我会强调职责分离：embedding 负责「快而全地把候选捞出来」，rerank 负责「精而准地排序」，用 embedding 的分数去做精确排序是常见误区，把两件事分开之后，选型压力会小很多。",
 red:"直接引用 MTEB 榜单分数当结论；或完全没做过自有评测集，效果全靠人工感觉。"},

{cat:"LLM应用工程",sub:"RAG",diff:"进阶",type:"设计",tags:["Rerank","两阶段检索"],
 q:"Rerank 的必要性是什么？代价是什么？两阶段检索的阈值怎么定？",
 intent:"考察对「召回-精排」两段式架构的理解深度，以及成本意识的平衡。",
 ans:[
  "为什么需要：向量检索是双塔（bi-encoder），query 和 doc 各自独立编码成向量再比相似度，速度快但交互浅、精度有限。Rerank 用 cross-encoder 把 query 和 doc 拼在一起过一遍模型，能做深度交互，精度显著更高。代价是慢——必须对每个候选单独算一遍，无法预计算。",
  "所以标准架构是两阶段：第一阶段用向量/关键词「广撒网」召回 top-50～100（快、成本低、要求高召回率）；第二阶段 rerank 精排出 top-3～5（慢、贵、要求高精度）。用便宜的手段保证不漏，用贵的手段保证排序准。",
  "代价量化：rerank 通常增加 50–300ms 延迟，且候选数越多越慢。如果候选 100 个、rerank 单条 10ms 就是 1s，不可接受。所以候选数要卡住，一般 20–50。",
  "阈值设定：① 相似度截断——向量相似度低于某值（如 0.5）的候选直接丢弃，不进 rerank，既省时间又减少噪声；② rerank 分数截断——精排后低于阈值的文档不进上下文，宁可少给也不要塞噪声（噪声会显著增加幻觉）；③ 兜底——top-1 都没过阈值，就走「未找到」分支或转成联网/人工。",
  "阈值怎么定：用评测集画 P-R 曲线，看「召回率随阈值下降」和「噪声率随阈值上升」的交叉点。没有标注数据的粗办法：抽样 100 条线上 query，人工看 top-5 里有多少条是相关的，反推一个能接受的分数下界。",
  "工程细节：rerank 服务要单独部署（GPU），做好批处理攒批以提升吞吐；rerank 模型挂了要能降级成「直接用向量相似度排序」，而不能整个问答不可用——这是必备的熔断降级路径。"
 ],
 follow:[
  "rerank 服务超时了，你降级成什么？降级后效果掉多少，能接受吗？",
  "候选 100 个降不下来，但 rerank 太慢，还有什么办法提速？",
  "rerank 分数阈值定高了漏召回、定低了引入噪声，你怎么平衡？"
 ],
 fa:["降级策略我会按候选的重排质量来做决策分成三档：最理想的是降级到「另一个更轻的 rerank」——比如平时用大模型 cross-encoder，超时切到一个小模型或者 ColBERT 类的late interaction；做不到的话降级到「向量分数的加权重排」，也就是用原始相似度加一些规则特征做个折衷排序；最差也要保证有结果，直接用粗排的向量序。效果下降幅度我一般会提前测出这个数字，这是做降级设计的前提——我们实测过从 cross-encoder 退回纯向量序，recall@10 基本不变（因为召回集合没变）但 precision@3 和最终答案准确率会掉大约 10 到 20 个百分点，主要损失在正常时用 rerank 纠错的那些 query 上。能不能接受取决于业务，我的原则是降级必须是自动的、可逆的、有告警的，并且要在指标上把降级流量单独打标，否则你无法评估损失。","候选数降不下来通常意味着粗排阶段做了不必要的大召回，可以从几个角度压缩。第一个角度是分桶和预筛选：用元数据、类目、时间范围先把空间切小，让 ANN 在一个更小的分区里跑，而不是全局捞 100 个；这样就敢于用更小的 top-N。第二个角度是把 rerank 做成级联——第一轮用一个极轻的模型或小维度向量把 100 压到 20，第二轮再用重模型从 20 精排到 5，这个「粗 rerank 到精 rerank」的漏斗比一次性上重模型快很多，而效果差别很小。第三个角度是工程优化：把 top-N 降低但提高并行度，cross-encoder 对候选列表是天然可 batch 的，批量推理 GPU 利用率更高；同时对热点 query 做 rerank 结果缓存。最后一个务实的选项是「用 LLM 做 listwise 精排」，一次调用对 10 个候选排序，看似贵但省掉了几十次小模型调用，某些场景延迟反而更好。","我不会用一个绝对分数阈值，因为 cross-encoder 的分数没有跨 query 的可比性——不同问题的分数分布差异极大。三个可行做法：一是按 top-1 与 top-k 的相对差值做筛选，比如 top-1 分数显著高于第 4 名才保留，否则认为区分度不足；二是用「保留条数」而不是分数，固定取 top-3 或 top-5，简单且稳定，这也是我默认的做法；三是只对低分部分做截断——分数低于某个很低的值才丢弃，这个低阈值可以用评测集标定成「低于它的文档最终从未出现在正确答案里」。我还会补一个动态调整：命中数不足时自动放宽，宁可多给噪声也不能漏召回，因为漏召回是硬伤，噪声还可以靠生成阶段的提示词和引用溯源去抑制。所以我的倾向是宁松勿紧，重排只负责「把好的往前放」，不要用它做「杀手」。"],
 pass:"知道 rerank 是 cross-encoder，精度高但慢，所以只用于精排 top-k。",
 good:"能讲清两阶段各自的指标目标（召回率 vs 精度）、给出量化代价与候选数建议、说明阈值的标定方法和降级路径。",
 gl:"我会先讲两层各自的目标函数，这样必要性就很自然了。粗排用向量检索，本质是双塔/近似搜索，它的目标是在毫秒级从百万文档里捞出候选，追求的是高召回率、低延迟，代价是精度有限——因为它把 query 和 doc 分别独立编码，两者没有交互，抓不到细粒度的相关性。重排用 cross-encoder 或 LLM，把 query 和候选拼在一起做全注意力交互，精度高得多，但计算量随候选线性增长，不可能对全库跑。所以「检索.重排」这个漏斗的本质是用廉价手段保证召回、昂贵手段保证精度，这是业界标准做法。代价要量化清楚：一是延迟，对 20 个候选做 cross-encoder 通常增加 50 到 200 毫秒，取决于模型和 batch；二是成本，如果调用大模型 rerank API，它是按 token 计费且候选越长越贵；三是系统复杂度，多一个服务就多一个故障点，必须有降级。候选数我的经验值是粗排 top-50 到 top-100、精排后保留 top-3 到 top-5，超过 5 条进上下文边际收益就很低了，还会加剧 Lost in the Middle。降级路径必须设计：服务超时或不可用时退回纯向量序，并且把这批流量打标以便评估损失。最后是提醒一点，加了 rerank 之后要重新看 recall——它不召回只重排，如果文档压根没被粗排捞出来，重排再强也没用。",
 red:"认为 rerank 是可选的锦上添花；或对所有候选（几百上千条）都做 rerank，完全没有延迟和成本概念。"},

{cat:"LLM应用工程",sub:"RAG",diff:"高阶",type:"设计",tags:["多模态RAG","文档解析","OCR"],
 q:"表格、图片、扫描件 PDF 怎么做 RAG？多模态 RAG 的落地形态有哪几种？",
 intent:"真实企业知识库必然遇到非纯文本文档，这是区分「做过 demo」和「做过生产」的分水岭。",
 ans:[
  "先说核心认知：这类问题的难点 90% 在「解析（Parsing）」而不是检索。垃圾进、垃圾出，解析错了后面所有优化都白做。",
  "PDF 解析分层：① 文本型 PDF 用 pdfplumber / PyMuPDF 提取文字与坐标，关键是还原阅读顺序（多栏排版直接按行提取会错乱）；② 表格要单独识别（表格结构识别 TSAR 任务），输出 HTML/Markdown 表格而不是纯文本，否则行列关系全丢；③ 扫描件必须走 OCR（PaddleOCR / Tesseract / 商业 OCR），还要处理旋转、倾斜、水印、印章遮挡。",
  "表格的 RAG 策略：常见做法是「表格整体作为一个 chunk 存原文 + 用 LLM 生成一段表格摘要一起存」，检索时命中摘要或原文，生成阶段把完整表格 Markdown 给模型。另一种是把表格转结构化数据入 SQL 库，用 text-to-SQL 查询（适合数值型、需要聚合计算的场景，如「去年 Q3 销售额」）。",
  "图片处理：① 给图片配文字说明（用多模态模型生成 caption / 用 OCR 提取图中文字），把 caption 作为可检索文本；② 保存图片 URL，检索命中后在生成阶段把原图一起交给多模态模型；③ 图表类（柱状图、折线图）建议转成结构化数据 + 文字描述双索引，因为直接让模型「看图读数」准确率很差。",
  "多模态 RAG 的三种落地形态：A) 模态转文本（把图片/表格转成文本后走传统文本 RAG，最实用、成本最低、兼容性最好，优先选这个）；B) 多模态 embedding（如 CLIP / 国产多模态向量模型，图文同空间检索，适合以图搜图）；C) 端到端多模态生成（检索到的原文图直接喂给多模态大模型，效果最好但成本和延迟最高）。",
  "质量保障：解析环节必须有可量化的质检——比如「表格行列数是否与原文一致」「OCR 置信度低于阈值的页面标记待人工」「解析后文本长度异常（过短/为空）告警」。把解析失败率作为一个正式指标来盯，而不是等用户投诉。"
 ],
 follow:[
  "一个 200 页的 PDF，你怎么验证解析质量？逐页人工看吗？",
  "表格转 SQL 和表格转 Markdown 给模型，你什么时候选哪个？",
  "多模态大模型直接读图，和 OCR + 文本 RAG 相比，你们实测差多少？成本差多少？"
 ],
 fa:["逐页人工看只适合小样本兜底，200 页这么看既不现实也不可靠，人会疲劳漏错。我的做法是「自动化探针 + 分层抽样 + 专项用例」三层。探针指的是构造一组已知答案的提问，比如「第 47 页表格里 2023 年 Q4 的营收是多少」，让端到端链路回答，把命中率作为解析质量的代理指标；如果一个探针反复失败，就顺着它去定位具体页。分层抽样是覆盖率的保证，按文档结构 stratum 抽样——正文页、表格页、图文混排页、附录扫瞄页各抽若干页，做结构和原文的比对。专项用例是对难点的定点击穿，多级标题是否保留层级、跨页表格是否合并、旋转页是否 OCR、脚注是否混入正文。工程上还会加便宜的自动校验：解析后字符数与预期偏差、OCR 置信度低于阈值的页标记出来人工看，以及 Round-trip 相似度。这样能把人工工作量压到十几页，同时覆盖率远高于随机翻。","取决于查询的性质，我的判断标准是「需不需要聚合与计算」。如果用户的提问是聚合型——求和、计数、排序、按时间筛选、跨列比较——必须走 SQL，因为让模型对着 Markdown 表格数数是非常不可靠的，这本质上是在让语言模型做算术和全表扫描，几十行以上就会出错，而且没法验证。如果提问是查找型或者语义型——查某个具体单元格、理解表格在讲什么、跨表格做推理——给 Markdown 或 HTML 原文更好，模型能看到上下文和表头关系，而且保留原始结构便于引用溯源。实践中我往往是「双索引」：表格同时生成摘要和可能的提问列表进向量索引，以及原始结构化数据进数据库，由 query 路由决定走哪条。还有一个中间形态很实用——对超大表格，先用 SQL 做筛选和聚合缩小范围，再把结果集以 Markdown 形式给模型做总结和解读，这是两者结合效果最好的用法。","这个需要分场景回答，因为差异非常大。对扫描件和版式复杂的文档（architecture图、流程图、有表格嵌套的报表），多模态模型直接读图明显更好，OCR 会把版面信息、表格结构、图注关联全部打散，一旦 OCR 出错后续全错；我们在这类场景上准确率差距能有 20 到 30 个百分点。但对纯文字的印刷体文档，两者差别很小，OCR 加文本 RAG 性价比更高，而且它有一个决定性优势——文本可以被检索。多模态模型读图是一次性的，你没法针对用户的提问去「检索图片里的某一段」，只能整页喂进去；而 OCR 出来的文本可以切分、可以加权，可以做混合检索。成本上多模态输入按图像 token 计费，一个页面常常几百到上千 token，比文本贵一到两个数量级。所以我现在的实践倾向是混合：离线用多模态模型对难解析页面做高质量结构化提取（俗称「用大模型做 OCR」），产出文本或结构化数据，然后仍然走文本 RAG 的检索链路，这样把质量和成本都兼顾了。"],
 pass:"知道扫描件要 OCR、表格要特殊处理，能说出给图片生成 caption 再检索。",
 good:"能明确指出瓶颈在解析环节，给出表格「摘要+原文双索引」和「转 SQL」的分流策略，讲清多模态 RAG 三种形态的取舍，并提出解析质检指标。",
 gl:"我的第一个判断是：多模态 RAG 的瓶颈从来不在检索和生成，而在解析提取环节，把文档变成「可被模型消费的内容」这一步决定了整个系统的上限，这块做的不好后面再怎么优化都是白搭。具体做法按三类素材分开：表格我倾向于「摘要 + 原文双索引」——用模型给表格生成自然语言摘要和它可能被问到的提问列表，把这些进向量索引负责语义命中，同时把表格本身保留成结构化数据用于 SQL 查询；这样既解决了向量检索无法回答聚合问题的缺陷，又保留了原文的引用能力。图片的处理是先生成描述 caption 并 OCR 出图中文字，两者一起索引，检索命中后可以选择性地把原图交给多模态模型精读，这种「两级」策略控制了成本。扫描件 PDF 的关键是混合 OCR 策略——先做版面分析和文字层检测，有文字层就直接抽，没有才走 OCR，并对低置信度区域标记。多模态 RAG 现在基本三种形态：一是把多模态素材转成文本再走传统 RAG，成本低可检索，是主力方案；二是检索到原素材后交给多模态模型直接读图理解，适合图表类且量少；三是多模态 embedding 直接做跨模态检索，比如以图搜图，比较前沿但工程成熟度一般。最后是一定要有解析质检指标——我常用构造探针题、分层抽样、Round-trip 相似度这些手段，把解析质量变成一个可跟踪的数而不是靠感觉。",
 red:"没处理过非纯文本文档，回答停留在「把所有文档切块向量化」；或认为直接把图片丢给多模态模型就行。"},

{cat:"LLM应用工程",sub:"RAG",diff:"高阶",type:"设计",tags:["RAG评测","RAGAS","评测集"],
 q:"RAG 系统怎么评估？RAGAS / TruLens 这些指标如何真正落地？评测集怎么从 0 建起来？",
 intent:"5 年经验的核心区分题。没做过评测体系的团队，AI 应用永远在「拍脑袋调优」。",
 ans:[
  "先分层评估，不要混在一起：① 检索层指标（脱离生成单独评）：Recall@k、MRR、nDCG，需要 query-doc 相关性标注；② 生成层指标：Faithfulness（忠实度，答案是否都能被给定上下文支持）、Answer Relevancy（答案是否回应了问题）、Context Precision/Recall（上下文的精准与充分度）。",
  "RAGAS 这类框架的价值是「用 LLM 当裁判自动生成指标」，解决了冷启动没标注的问题。但必须知道它的局限：裁判模型本身有偏差（偏好长答案、偏好与自己风格一致的输出）、评分不稳定（同一条跑两次可能不同分）、成本不低（评测 500 条可能要跑几千次 LLM 调用）。",
  "裁判可信度校准：抽 50–100 条做人工标注，把 LLM 裁判的分数和人工分数做相关性分析（Spearman / Cohen's kappa），相关性低于 0.6 说明裁判不可用，需要换模型或改 prompt。这一步绝大多数团队不做，导致指标自欺欺人。",
  "评测集从 0 到 1 的三条来源：① 从真实用户日志抽样（最有价值，分布最真实），按 query 频次分层抽样而不是均匀抽样；② 让业务专家写「必答题」（核心场景的 gold set）；③ 用 LLM 基于文档自动生成合成问题（注意要生成「难问题」而不是「原文摘抄型问题」，否则评测集会虚高）。",
  "评测集必须包含三类用例：正常问答、应拒答（文档里没有的）、对抗用例（易混淆文档、旧版本文档、需要多跳推理的）。只测正常问答的评测集会给出虚假的安全感。",
  "工程落地：评测必须进 CI——每次改提示词、换模型、调 chunk 策略，自动跑一遍，输出对比报告，指标下降超阈值就告警。这是防止「改好了 A 场景，搞坏了 B 场景」的唯一有效手段。",
  "线上还要有闭环：用户点踩/点赞、转人工率、追问率（用户反复追问说明没解决）都是廉价的真实信号，把 badcase 自动回流进评测集，让评测集持续增长。"
 ],
 follow:[
  "LLM 裁判和人工标注的一致性你怎么检验？不一致时信谁？",
  "评测集多久更新一次？怎么防止评测集被「刷过拟合」？",
  "线上指标（点踩率）和离线评测分不一致，你怎么办？"
 ],
 fa:["检验一致性我会用两类指标：一是简单的吻合率，也就是裁判给出的分和人工标的一致的比例；二是更严谨的相关性/一致性系数，比如 Cohen's Kappa 或 Spearman 相关，因为它能排除「随机猜也能对一部分」的情况。做法是从评测集里抽 50 到 100 条做人工双盲标注，再和裁判结果比对。当吻合率低于一个可接受阈值（比如 85%）时我不会直接用裁判的结果下结论，而是先做一轮偏差分析：看不一致集中在哪类子项上——通常是主观性强的项（如「回答是否有帮助」）一致性低，而事实性强的项（如「是否有原文依据」）一致性高。结论上我不说「信谁」，而是分场景：粗筛和大规模回归用裁判，因为它的价值是成本和可重复性；关键决策、模型升级、对外承诺的指标用人工，因为那是最终责任。还有一个实用技巧是把裁判当「相对比较」而非「绝对打分」用——让它判断 A 答案和 B 答案谁更好，这个任务的一致性和可靠性都明显高于让它打绝对分。","我从两个层面防过拟合。来源层面，评测集要保持「活」——我有一条硬性机制是把线上 bad case 持续回流进评测集，每个月补充一批；同时保留一部分「holdout」集，完全不参与日常迭代中的 prompt 调优，只在重大版本 decisions 时才拿出来跑，作为一个不被污染的标准尺。流程层面，我会监控「评测集得分」和「线上指标」的背离度，如果评测分一直在涨但线上点踩率不降，说明已经过拟合了，这是最直接的信号。还有一个心理层面的建议：把评测集的迭代幅度控制住，不要每改一版 prompt 就顺手「修一下」评测集让它好看，这个动作一旦开始，评测的价值就归零了。更新节奏上我倾向每月一次常规补充，加上重大产品变更后的一次性扩充。","这是信号表明你的评测集代表性不足，我按三步处理。第一步做偏差分析：把离线高分但线上被点踩的样本捞出来，找出它们的共性——通常集中在几类，比如 prompt 的语气/格式、答案长度、时效性、特定业务场景，这些东西不在评测集里或者权重被低估。第二步把这类样本直接补进评测集，尤其是要找到带代表性的几十条，这是最有价值的动作。第三步反思根因：如果反复出现不一致，很可能是我们优化的目标函数是错的，比如我们一直优化 faithfulness 但用户真正在意的是「有没有直接给出可执行的结论」。这时候我会和用户侧对齐，重新定义线上北极星指标，再把它翻译成离线指标。同时我也会检验线上指标本身的可靠性——点踩的数据噪声很大，用户可能因为 UI 难看就点踩，所以要细化信号，比如点踩加用户修改行为、追问次数、复制行为，比单点踩更可信。核心态度是：离线评测服务于线上体验，不一致时永远以线上为准去修正评测，而不是反过来。"],
 pass:"知道 Faithfulness、Answer Relevancy 这几个指标名，知道评测集的重要性。",
 good:"能分层讲检索/生成指标，指出 LLM-as-judge 的偏差并给出人工校准方法，给出评测集三条来源与三类用例，并把它接进 CI 与线上 badcase 回流闭环。",
 gl:"我会把评估拆成检索侧和生成侧两层，因为它们的优化手段完全不同，混在一起看会掩盖问题。检索侧看 recall@k 和命中结果的排序位置，其中 recall@k 是最关键的——正确文档有没有被捞出来，这是后续一切的前提。生成侧我会用三类指标：faithfulness（答案是否忠于召回内容、有没有编造）、answer relevance（是否回答了用户真正的问题）、context precision（召回里有多少是真有用），这些就是 RAGAS 那一套，但我要强调的是不要直接信任开箱即用的分数，因为它依赖 LLM-as-judge，而裁判本身是有偏的。所以落地的关键是校准：抽 50 到 100 条做人工标注，比对吻合率和 Kappa 系数，低于阈值就调 rubric 或者换裁判；我的建议是把主观项拆成可判定的子项，让裁判先引证据再打分，一致性会明显提升。评测集从零建起来我靠三条来源：线上真实日志特别是被点踩的样本（最有价值）、业务方人工标注 100 到 200 条（质量最高）、模型反向生成问题（用于扩充）。用例要覆盖三类：标准可答、应拒答的、多跳推理的，其中「应拒答」这类的缺失是很多团队优化跑偏的原因。最后是闭环：评测集接进 CI 作为合并门禁，线上 bad case 自动回流补进评测集，两者之间有监控防止评测集被刷过拟合——最主要的信号就是评测分涨而线上点踩率不降。",
 red:"没有评测集，调优靠人工试几个 case；或把 RAGAS 分数当作绝对真理，从未校准过裁判。"},

{cat:"LLM应用工程",sub:"RAG",diff:"进阶",type:"设计",tags:["增量索引","知识库更新"],
 q:"知识库需要持续更新：增量索引、文档删除、版本一致性分别怎么做？",
 intent:"生产环境的刚需。demo 阶段没人考虑，上线后这是最容易出事故的地方。",
 ans:[
  "增量索引：文档按内容哈希（或版本号+修改时间）判重，内容没变就不重建，避免每次全量重建索引烧掉大量 embedding 成本。建一张「文档-切块-向量ID」的映射表，文档更新时只删除旧 chunk 对应的向量、重新切分并写入新向量。",
  "删除是重点难点：向量库里删一条不难，难的是「文档被拆成 30 个 chunk，怎么保证这 30 条全删干净」。做法是映射表记录每个文档产生的所有向量 ID，删除时按文档 ID 批量精确删除，而不是按相似度或过滤条件删（后者容易漏）。删完要校验：按文档 ID 查一次，确认返回为空。",
  "版本一致性：① 文档有版本，检索返回的 chunk 必须带上所属文档版本，生成时提示词里要说明「以下资料版本为 xxx」，避免新旧版本混用导致答案自相矛盾；② 同一知识库内如果有「2023版制度」和「2024版制度」两份文档，必须靠元数据过滤或 rerank 优先新版，否则模型会随机引用，这是最常见的线上事故。",
  "时效性：给每个 chunk 加「生效时间 / 失效时间」元数据，按当前时间过滤。制度类、价格类、政策类知识尤其需要。",
  "一致性保障（工程层面）：文档状态机——PENDING → PARSING → INDEXING → READY / FAILED。只有 READY 的文档才可被检索（通过元数据过滤 status=READY），避免「正在重建索引的中间态」被用户查到，出现答案时有时无的诡异现象。",
  "失败处理：解析/向量化失败要有重试与告警，失败的文档不能被静默跳过——用户会以为「知识库里明明有，为什么答不上来」。要有一张「知识库健康度看板」展示解析失败数、待处理数、索引延迟。"
 ],
 follow:[
  "文档正在重建索引时用户来查询，你会返回什么？",
  "怎么保证删除操作不会误删其他文档的向量？",
  "新旧版本文档同时在库，你怎么设计让模型稳定引用新版？"
 ],
 fa:["这里的关键是绝不能出现「索引的中间态」，也就是用户看到一半新一半旧的结果。我的做法是用双写加别名切换：重建时写到一个全新的索引别名或一个新的 collection/partition，灌完之后数据校验通过，再通过一次原子操作把读别名指向新索引，然后下线旧的。这样在整个重建期间，用户查询始终指向旧索引，返回的是完整一致的结果，只是可能不包含最新文档——这是可接受的，因为它是一个明确的、可预期的时延。同时要有文档级状态机：每个文档有 pending/indexing/active/failed 状态，重建期间如果是增量更新就把变更写进一个 delta 日志，重建完成后先 replay delta 再做切换，避免切换瞬间丢更新。对于时效性要求高的场景，我还会做「双读去重」——同时查新旧两个索引并去重合并，用版本号取最新，这样用户能拿到最新内容，代价是一次额外查询。","防御的核心是把删除做成「按文档 ID 精确删除」而不是「按向量相似度删除」。数据模型上我一定会维护一张映射表：doc_id 对应 chunk_id 列表，chunk_id 对应 vector_id，删除时先按 doc_id 查出全部 chunk 和 vector，再批量精确删除，最后原子地把映射表记录清掉。这里最大的风险源是 PDF/文档去重逻辑如果按内容哈希而不是业务 ID，会把内容相同的另一份不同文档误删，所以我坚持用业务主键而不是内容哈希作为删除依据。另外三个防御手段：一是软删除优先，先把 doc 标 deleted 并从检索侧过滤掉，定时任务再物理清理，这样误删可恢复；二是删除操作本身做成幂等且带审计日志，记录删了哪些 ID、为什么删；三是定期做一致性巡检——对比源存储的文档数和索引里的文档数，差异超阈值就告警，这个巡检能提前发现绝大多数静默错误。","这需要元数据和 retrieval 策略配合。元数据上每个文档都要有 version、effective_date、status（draft/published/archived）这几个字段，chunk 继承文档级元数据。检索侧做过滤：默认只检索 status=published 且 effective_date 小于等于当前时间的文档，这是最基本的防线。但仅仅过滤还不够，因为模型端还会遇到「旧版与新版并存于上下文」的情况，所以我会在 chunk 的文本模板里直接嵌入版本信息——每个召回片段前面带上「文档版本 v3.2，生效日期 2026-01」这样的前缀，让模型在生成时能明确区分。产品侧还要考虑「时间旅行」查询：用户问「去年这个时候的政策是什么」，这时候不能简单取最新，要按 query 里的时间意图做 effective_date 过滤，这是很多知识库忽略的点。最后一个工程建议：切换新版时给旧版保留一个短的共存窗口并监控，确认引用率归零后再清理。"],
 pass:"知道要增量更新而不是全量重建，知道删除要按文档维度。",
 good:"能给出文档-切块-向量映射表、文档状态机保证无中间态、版本/生效时间元数据过滤，并有失败告警与健康度看板。",
 gl:"我会把它拆成一静一动两条线来讲：增量是常态、重建是例外。数据模型上第一件事是建立映射关系：document 表记录业务元数据和状态，chunk 表记录切分结果并外键到 document，vector 通过 doc_id 加 chunk_id 可反查；这张映射表是后续所有操作的基础，没有它就只能全量重建。日常增量走事件驱动：文档新增或变更触发消息，进入索引 pipeline，完成解析切分入库后更新 document 状态，整个链路幂等可重放。这里我会用文档状态机来保证无中间态——pending、indexing、active、failed，任何时刻用户可见的只有 active；重建时采用「写新索引 + 原子切换别名」的方式，切换前回放增量日志，保证数据无损。删除必须走精确 doc_id 删除并配合软删除和审计日志，定期做「源存储文档数 vs 索引文档数」的一致性巡检。版本一致性靠元数据加过滤：每个 chunk 携带 version、effective_date、status，检索默认只取 latest published，并且把版本信息写进 chunk 文本前缀让模型能区分；遇到时效性查询还要做 effective_date 过滤。最后是这一整套必须有健康度看板——索引延迟、失败队列长度、索引与源的一致性偏差、删除操作的审计记录——以及失败告警；我见过最惨的线上事故是索引 pipeline 静默失败三个月没人发现，问答质量慢慢劣化到用户都流失了才被注意到。",
 red:"每次更新全量重建索引；删除只删主 chunk 不管其余；没有中间态处理，重建期间答案随机变化。"},

{cat:"LLM应用工程",sub:"Agent",diff:"高阶",type:"设计",tags:["RAG局限","Text-to-SQL","工具调用"],
 q:"用户问「帮我总结一下公司去年的 OKR 完成情况」，纯 RAG 答不了，你会怎么解决？",
 intent:"考察 RAG 能力边界的认知，以及向 Agent / 结构化查询演进的思路。这是 5 年经验该有的场景判断力。",
 ans:[
  "先做问题分类：这类问题属于「需要聚合、计算、跨多文档」的查询，RAG 的本质是「检索相关片段再总结」，天然不擅长：① 需要覆盖全部文档而非 top-k（top-k 会漏）；② 需要数值计算（模型算数不可靠）；③ 需要跨记录关联。",
  "方案一（结构化查询，首选）：如果 OKR 数据存在业务库里，走 Text-to-SQL / NL2SQL。关键工程点：Schema 要先做裁剪（只给相关表的 DDL，不要全库塞进去）、提供字段说明与枚举值示例、加 few-shot 例题、执行前做 SQL 安全校验（只允许 SELECT、限制行数、强制租户过滤）、执行失败把错误信息回喂模型自我修正。返回后让模型基于真实数据做总结。",
  "方案二（文档侧结构化）：如果只有文档，离线用 LLM 把非结构化文档抽取成结构化记录（目标/负责人/进度/完成度）入库，再走方案一。这一步叫「文档→数据的 ETL」，把 RAG 问题转成 BI 问题。",
  "方案三（Agent 分解 + 多步检索）：让 Agent 把问题拆成「先列出所有部门 → 逐个查该部门 OKR → 汇总」，配合支持「全量遍历」的检索（如按元数据过滤后逐条读）。成本高、延迟长，仅在无结构化数据时用。",
  "方案四（预计算）：对高频固定查询，离线算好中间结果存起来，线上直接查。企业场景里很大一部分「总结类」需求其实可以被预计算覆盖。",
  "路由层：线上应该有一个意图分类（小模型或规则）把 query 路由到 RAG / SQL / 预计算 / 联网 / 转人工 等不同通道，而不是所有问题都走 RAG。这个路由器是 AI 应用架构成熟度的标志。",
  "兜底与诚实：任何方案如果数据不全，必须明确告诉用户「只覆盖到 X 部门，Y 部门数据缺失」，而不是编一个完整的总结。"
 ],
 follow:[
  "Text-to-SQL 生成的 SQL 有注入风险或全表扫描风险，你怎么防？",
  "从文档抽取结构化数据，抽取错了怎么办？准确率怎么保证？",
  "路由分类错了（该走 SQL 的走了 RAG），怎么发现和纠正？"
 ],
 fa:["我把防护分成「生成前约束」和「执行前校验」两道，两道都不能省。生成前：只给模型必要的表和字段 schema，而不是整个数据库，减少它脑补出不存在表的机会；schema 里写清楚每个字段的语义、枚举值、时间格式，并禁止 SELECT *；提供少量高质量的 Text-to-SQL 示例覆盖常见的聚合模式。执行前：这是硬防线——一是用只读账号连接，数据库层面就没有写权限，这是最彻底的防护；二是做 SQL 静态解析，用 AST 校验只允许 SELECT、禁止多语句和注释符、白名单表名和列；三是必须有 LIMIT 和超时，并对涉及的分区做限制，防止全表扫描拖垮生产库；四是 EXPLAIN 预估扫描行数，超阈值直接拒绝并让模型改写。还有一个容易被忽略的点：查询结果本身可能包含敏感数据，要按用户权限做行级过滤再返回。安全上我不相信任何来自模型的输入，它必须被当作不可信输入经过校验层。","抽取准确率的保证我通常这么做：首先要有 golden set——人工标注 100 到 200 份样本作为抽取的 ground truth，这是唯一可靠的标准，没有它讨论准确率都是空的。其次要有置信度和一致性校验：让模型抽取时同时给出每个字段的出处（原文片段），无出处或出处不可靠的标记为低置信；对同一份文档做两次独立抽取，结果不一致就进人工复核队列。再次要有规则和导出后校验——字段类型检查、日期格式、枚举取值范围、数值勾稽关系（比如各项之和等于总额），这些便宜的规则能拦掉相当比例的错误。产品的正确姿势是「把抽取结果当作可修改的草稿」给用户确认，而不是当作事实直接使用，这是承认技术边界。最后是引入 「人在回路」的闭环：用户修正过的样本回流进 few-shot 示例库和 golden set，形成持续改善。我会明确说抽取的准确率应该用「字段级 F1」度量而不是笼统的正确率。","发现和纠正是两套机制。发现上：一是置信度监控，路由分类器的概率低于阈值时打标，做抽样审计；二是结果侧的自检，SQL 返回空或异常少、RAG 召回分数普遍很低（说明这个问题在文档里没答案），这些信号能反向提示路由可能错了；三是把「用户是否追问或点踩」作为最真实的反馈信号，我会在 bad case 归因时专门看「路由错误」这一类的占比，这应该是一个被显式跟踪的指标。纠正上：短期加 fallback——当主路由的结果置信度不足时，自动尝试另一路并给两路结果做一次对比选择，这能救回不少；中期是把错误样本补进路由分类器的训练集，或者补进 few-shot 示例；工程上我会让路由器输出可解释的判断依据，便于定位。最后是产品侧的兜底：给用户一个明确的切换入口，比如「这个答案来自文档查询，试试数据查询」，让用户手动纠偏，这在早期成本极低、收益很高。"],
 pass:"能想到用 Text-to-SQL 或把文档结构化，知道 RAG 有边界。",
 good:"能给出「意图路由 + 多通道」的架构视角，讲清 NL2SQL 的安全校验与自我修正、文档抽取成结构化数据的 ETL 思路，以及预计算降本。",
 gl:"我会先从架构视角切入：这个问题暴露的是「纯 RAG 只能回答文档中显式存在的信息，而 OKR 完成情况需要跨文档聚合、需要和数据库里的进度对齐」，所以正确解法不是优化 RAG 而是引入多通道。我的方案是一个意图路由加多通道的架构：用户提问进来先做意图分类，分成三类——事实检索型走 RAG（单个文档的提问）、聚合统计型走 Text-to-SQL 或结构化数据 API（涉及求和、排序、时间对比）、混合型走两者串联（先用 SQL/API 拿结构化结果，再让模型结合文档里的定性描述生成总结）。这条路由可以是分类器，也可以是一个小模型的 function calling 决策。OKR 这个例子我倾向于「先把数据搬进去、再问」——也就是离线 ETL：定期从 OKR 系统和数据仓库把结构化的进度数据抽取出来，甚至可以离线用模型生成定期摘要存回知识库，这样线上问答就退化成一个普通的检索，成本和延迟都最低，这个「预计算降本」的思路在稳定的周期性报表场景非常好用。安全上 Text-to-SQL 必须做两道防线：生成前限制 schema 可见范围，执行前用 AST 白名单加只读账号加 LIMIT 加 EXPLAIN 行数校验。文档抽取结构化这条路则要承认准确率边界——用字段级 F1 度量、让模型给出每个字段的出处、对结果做勾稽校验、让用户确认后入库、并把修正样本回流成 few-shot。最后是路由本身要被监控，把「路由错误率」作为一等指标持续跟踪，并用「低置信度时双路兜底」作为短期缓解。",
 red:"硬用 RAG 回答，说「把所有文档都检索出来给模型」；或完全没意识到 top-k 检索会漏数据导致总结不完整。"},

{cat:"LLM应用工程",sub:"RAG",diff:"高阶",type:"概念",tags:["GraphRAG","知识图谱"],
 q:"GraphRAG 是什么？什么场景值得上？它的成本和代价是什么？",
 intent:"考察对新技术是否有独立判断，而不是追热点。5 年经验要有「什么时候不该用」的判断力。",
 ans:[
  "传统 RAG 是「向量相似度找片段」，擅长局部事实问答（「报销标准是多少」）；GraphRAG 是先把文档抽成实体-关系图谱，检索时在图上做社区聚类与多跳遍历，擅长「全局性、跨文档、需要关联推理」的问题（「这些合同里涉及的所有供应商之间有什么关联」「过去一年的项目里反复出现的风险主题是什么」）。",
  "核心差异：微软 GraphRAG 的思路是「预生成社区摘要」，查询时先在对应层级读社区摘要再回答，从而能处理传统 top-k 检索根本覆盖不到的全局性问题。",
  "值得上的场景：文档间关联密集（合同网络、人物关系、供应链、案件卷宗、代码依赖）；问题需要多跳（A 和 B 通过 C 有关系）；需要全局主题归纳。",
  "不值得上的场景：FAQ、产品手册、政策制度这类「一问一答、文档互相独立」的知识库——用 GraphRAG 是杀鸡用牛刀，效果未必更好，成本却高一个数量级。",
  "代价（必须讲清）：① 构建成本极高——实体关系抽取要对全量文档跑 LLM，千万字级文档的建图费用可能是普通向量索引的 10–50 倍；② 时间成本——建图是小时级甚至天级的离线任务，知识更新快的话图谱一直追不上；③ 抽取质量是天花板——抽错了关系，图上推理就是错的，且错误会沿多跳传播放大；④ 工程复杂度——要额外维护图数据库、实体对齐、图谱更新与版本。",
  "决策建议：先用传统 RAG + 混合检索把基线做扎实，明确发现「多跳/全局类问题」占了真实 query 的显著比例（比如 >15%）且业务价值高，再考虑 GraphRAG 或轻量的图谱增强（只抽关键实体做过滤，不做完整图谱）。"
 ],
 follow:[
  "实体关系抽取的准确率通常是多少？抽错了会怎样？",
  "知识每天更新，图谱重建跟不上，你怎么处理？",
  "有没有比完整 GraphRAG 更轻量的折中方案？"
 ],
 fa:["这个数字要说得很坦诚：在通用领域、没有专门调优的情况下，实体关系抽取的 F1 通常在 60% 到 80% 之间，开放抽取场景（不限定 schema）常常更低。所以 GraphRAG 的效果高度依赖领域schema的约束程度——限定十几个实体类型和关系类型的封闭抽取，质量会好很多。抽错的影响是有偏的，不能一概而论：漏抽（少抽了关系）影响相对可控，只是图不完整，退化成普通 RAG 的水平；错抽（建立了错误的关系）危害大得多，因为 GraphRAG 的核心价值是做多跳 traversal，一旦路径中间有一个错误边，推理会沿着错误的路径走下去，得出看似有据实则错误的结论，而且很难被发现——比普通 RAG 的错误更隐蔽。所以我的做法是：对关键边要求有原文共现作为证据保留 provenance，且社区摘要里保留原始文本引用，让错误可追溯。","这是 GraphRAG 落地的最大现实障碍——图谱构建是一次昂贵的全量操作，尤其是社区发现和摘要生成。三个应对思路：一是分层更新，把图分成「稳定的骨架」和「易变的事实」——实体和它们之间的结构关系变化慢，可以低频重建；而实体的属性值、最新动态这些放外部存储或者向量库里实时更新，图里只存指针。二是增量合并，只对当天新增或修改的文档做局部抽取，把新的三元组 merge 进已有图，社区划分采用增量算法而不是全量重算，代价图的「全局最优性」会下降但可接受。三是降期望和分区，很多场景其实不需要全局图，按业务域做子图，各自独立更新，把重建成本摊薄。我还会明确设定一个「图的陈旧度」指标对外暴露——让用户知道这份图谱的数据截止到什么时候，这是诚实的做法。","有几个我会优先尝试。第一个是「轻量实体索引」：不做完整图谱，只做实体抽取加实体别名表，检索时识别出 query 里的实体，用它去扩展查询和做元数据过滤，最后仍走向量加 BM25。这个投入很小但能解决很多「多跳」问题的前半段。第二个是「文档级关系」：把库文档之间的引用、上下级、时间先后关系直接作为元数据或邻接表，不做三元组抽取，成本低且准确（这类关系往往是显式的）。第三个是 query-side 的分解：遇到确实需要多跳的问题，让 Agent 把它拆成几个子问题逐步检索再综合，用 Agent 的推理能力替代图的结构能力。我的一般策略是先用第三条加第一条把准确率做上去，只有当明确发现「问题确实需要全局关联推理、且基线已经做到位」时才考虑完整 GraphRAG，因为它是一次很大的基建投入。"],
 pass:"知道 GraphRAG 用知识图谱做多跳检索，适合关联密集场景。",
 good:"能清楚对比「局部事实问答 vs 全局关联问答」的能力边界，给出明确的适用/不适用场景，并把构建成本、抽取质量、更新滞后三个代价讲透，最后给出「先做扎实基线再评估」的决策路径。",
 gl:"我会先说能力边界：传统 RAG 擅长「局部事实问答」——答案集中在少数几个 chunk 里；而 GraphRAG 解决的是「全局关联问答」——比如「这批财报里各家公司提到的风险因素有哪些共同点」，答案分散在整个语料里，需要跨文档聚合和归纳，这类问题用普通 top-k 检索永远答不好，因为正确材料根本进不了上下文。GraphRAG 的做法是离线用模型抽取实体关系建图，再做社区发现并对社区生成摘要，查询时用这些摘要做全局性的综合。但代价必须讲透三条：第一是构建成本，一次全量图谱加社区摘要的花费可能是普通索引的几十倍，对一个中等语料可能就是几千到上万的费用，且每次重建都要重付；第二是抽取质量，实体关系抽取本身的 F1 有限，错误的边会沿着图传播出错误结论，且比普通 RAG 的错误更隐蔽；第三是更新滞后，图谱难以跟上高频更新的知识，这是我的经验里最容易劝退的地方。适用场景我判断为：静态或低频更新的封闭语料、问题以全局归纳和多跳关联为主、且预算允许——典型如行业研究报告分析、法规体系梳理、大规模代码库理解。逆向的不适用场景同样明确：实时性要求高、答案是单点事实、语料频繁变动。所以我的决策路径是「先把基线做扎实」——先把解析切分、混合检索、重排、query 改写做到位并用评测集量化，确认基线确实答不了这些全局性问题，再带着预算去做 GraphRAG 的投入产出评估。",
 red:"只知道这是个新技术、效果好；或说不出任何代价，计划直接在 FAQ 场景上 GraphRAG。"},

/* ============ C. Agent ============ */
{cat:"LLM应用工程",sub:"Agent",diff:"基础",type:"概念",tags:["ReAct","Plan-and-Execute","Function Calling"],
 q:"ReAct、Plan-and-Execute、Function Calling 的区别是什么？你如何选型？",
 intent:"Agent 基础概念题，但要听出是否理解各自的失效模式。",
 ans:[
  "Function Calling（Tool Use）是底层能力：模型输出结构化的工具调用请求，由外部执行，结果回喂模型。它本身不是「Agent 范式」，而是所有 Agent 的地基。",
  "ReAct = Reason + Act 交替循环：思考一步 → 调用工具 → 观察结果 → 再思考 → 再调用，直到得出答案。优点：能根据中间结果动态调整，容错性好，适合探索性、路径不确定的任务。缺点：步数不可控、延迟长、容易在局部反复打转、token 消耗随步数线性增长。",
  "Plan-and-Execute：先让模型一次性产出完整计划（步骤列表），再逐步执行，执行完可以 replan。优点：全局结构清晰、步数可控、便于展示进度给用户、便于并行执行无依赖的步骤。缺点：计划一旦偏了，后续全错（虽然可以 replan 补救）；对复杂动态环境的适应性不如 ReAct。",
  "选型经验：任务路径明确、步骤可枚举（如「查订单 → 查物流 → 发通知」）用 Plan-and-Execute，确定性高、成本低、用户体验好（能展示进度条）。任务路径依赖中间结果（如「先搜一下，看结果再决定下一步」）用 ReAct。",
  "实践中最常见的是混合：顶层 Plan 拆解子任务，每个子任务内部用 ReAct 循环。子任务失败只重试该子任务，而不是整个重来。",
  "工程要点：无论哪种范式，都必须有步数上限、超时、以及「每步状态可持久化」——否则一次 30 步的任务中途挂了就得从头再来。"
 ],
 follow:[
  "ReAct 循环跑了 20 步还没结束，你怎么处理？",
  "Plan-and-Execute 里的 replan 触发条件是什么？",
  "哪些步骤可以并行执行？你怎么判断依赖关系？"
 ],
 fa:["我的做法是「软硬兼施」，先看是卡在哪。硬约束是必须有的：设置 max_steps（比如 15 到 20），到顶就停止并进入收敛流程，绝不能无限跑。同时在接近上限前触发软收敛——比如在 70% 步数时给模型注入一条系统消息，告诉它「预算已用 70%，请基于已有信息给出当前最优答案，不要开启新的探索分支」。真正有价值的信号处理是循环检测：我会记录每一步的 (tool_name, normalized_args) 哈希序列，一旦发现重复调用模式，直接打破循环并强制模型换策略。最后，到达步数上限不等于失败——正确姿势是把已获得的信息交给一个总结步骤，输出一个「部分完成」的结果并明确告诉用户卡在哪、缺什么，这比返回一句「处理失败」体验好得多。我还会把这类「触顶」的请求沉淀成评测集中的失败用例，因为它往往暴露了任务分解或工具设计的问题。","replan 的触发条件我主要看三类信号。第一类是执行结果与计划预期不符：某个子任务的工具调用返回错误、数据为空、或返回的内容明显不支持后续步骤，这时候原计划的前提已经崩了，必须重规划。第二类是出现了计划之外的关键新信息：比如查用户订单时发现该用户有异常风控标记，这不在原计划里但会影响后续所有步骤，需要重新决策。第三类是连续重试失败：某个子任务重试两次仍失败，说明这条路可能走不通，要么换工具，要么把任务拆得更细。有两个不触发 replan 的原则也很重要：一是单步骤的局部失败优先局部重试，不要动整体计划，否则会因为小扰动频繁重规划，成本和延迟都失控；二是给 replan 本身设上限，比如最多重规划两次，超过就转人工或降级给一个保守答案——防止「规划、失败、再规划」的无限循环。另外 replan 时必须带上已完成的步骤结果，避免重复劳动。","依赖判断是这个话题的核心。我的做法是把每个工具都标记出它的「输入来源」——哪些参数是常量、哪些依赖前面某一步的输出。有了这个元信息就能构建依赖图，没有数据依赖的步骤天然可并行。工程上有两个层次：一是静态分析，在计划生成后，让模型输出每个子任务的 depends_on 字段，我们可以据此做拓扑排序并按层并行；二是运行时调度，用 DAG 执行器，每一层的任务全部并发发出，等全部返回再进下一层。具体到 Agent 场景，最常见的可并行是「多路信息收集」——比如要去查天气、查交通、查酒店，这三者互不相干，就该并发。不可并行的是「必须先知道用户 ID 才能查订单」这类。我还会提醒两点：并行要考虑工具的限流和幂等，不要并发地把 QPS 打爆；以及部分失败的处理——某一路失败了是整层失败还是允许其余继续，这个策略要提前定义。"],
 pass:"能说清 ReAct 是边想边做、Plan 是先规划后执行。",
 good:"能给出明确的选型依据（路径是否可枚举），提出「顶层 Plan + 子任务 ReAct」的混合方案，并强调步数上限与状态持久化。",
 gl:"我用一句话概括选型依据：看任务的路径是否可枚举。Function Calling 适合单步或少量固定步骤的任务——路径清晰、工具集很小、一次调用就能完成，它的优势是简单、延迟低、行为可预测，缺点是没有自主纠错能力，工具一失败就断。ReAct 是「思考-行动-观察」的循环，适合路径不可枚举、需要根据中间结果动态调整的任务，比如排查故障、开放式调研，它的优势是适应性强，代价是步数不可控、延迟和成本浮动大、容易打转。Plan-and-Execute 适合任务复杂但可以拆成稳定子目标的情况，先一次性规划再逐个执行，它的好处是全局观好、子任务之间可以并行，缺点是计划一旦与现实脱节就需要 replan，而且首步延迟较高。实践中我几乎不会只用某一种，而是用「顶层 Plan + 子任务 ReAct」的混合方案：顶层用 Plan 把任务拆成若干子目标并识别依赖便于并行，每个子目标内部允许用 ReAct 循环去完成，并对每个子目标设步数上限。再叠加两个必须有的工程约束：一是三重上限（步数、token、时间），二是状态持久化——每一步的思考和工具结果都要落库，这样才能做断点续跑和事后归因。最后我会补一句，很多时候真正有效的优化不是换框架，而是把工具设计好、把上下文收拾干净。",
 red:"把三个概念混为一谈；或只会说「用 ReAct」，说不出它的失效模式和成本问题。"},

{cat:"LLM应用工程",sub:"Agent",diff:"进阶",type:"设计",tags:["工具设计","Tool","Function Calling"],
 q:"Agent 的工具（Tool）设计有哪些原则？工具数量上限大概是多少？工具太多怎么办？",
 intent:"Agent 落地最常见的坑就是工具设计，能反映实战经验。",
 ans:[
  "工具描述是提示词的一部分，直接影响调用准确率。写好描述的四要素：这个工具能做什么、什么时候该用 / 什么时候不该用、参数含义与取值范围、失败时会返回什么。反面例子：描述写成「查询数据」这种含糊的话，模型会乱调。",
  "工具要「单一职责且粒度适中」：太细（getUserName / getUserEmail 分开）会导致调用轮次暴涨；太粗（doEverything）会导致模型不敢用或用错参数。判断标准是「一个工具对应一个用户可理解的动作」。",
  "参数设计：扁平化、必填项尽量少、给枚举而非自由文本、给默认值、参数名要有强语义（user_id 而不是 id）。避免让模型自己拼复杂嵌套 JSON。",
  "数量上限：经验值在 10–20 个之内比较稳。超过之后模型的工具选择准确率明显下降（会选错工具、漏工具），且每次请求的工具定义本身就占掉大量 token（20 个工具可能吃掉 3–5k token，直接挤压上下文）。",
  "工具太多的三种解法：① 分层分组——先让模型在「工具组」里选（如「订单相关」「用户相关」），选中组后再加载该组的具体工具（类似 RAG for tools）；② 按意图路由——用分类器或小模型先判断 query 属于哪个域，只注入该域的工具；③ 工具检索——把所有工具描述向量化，运行时检索 top-k 相关的注入。本质都是「动态注入而非全量注入」。",
  "其他关键设计：工具必须幂等（重试不能产生副作用）、必须有明确超时、返回值要精炼（不要把 1 万行结果全塞回上下文，要先在工具侧做截断/聚合/摘要）、错误信息要能被模型理解（「用户不存在，请检查 user_id」比 「Error 404」有用得多）。",
  "危险操作（转账、删除、发邮件给外部）必须加二次确认或权限白名单，不能让模型自主执行。"
 ],
 follow:[
  "模型选错了工具，你怎么定位和修复？",
  "工具返回了 1 万条数据，直接塞回上下文会怎样？怎么截断？",
  "同一个工具有多个相似版本（查订单 v1/v2），模型会混淆，怎么处理？"
 ],
 fa:["定位靠数据，不靠猜。我的第一步一定是看 trace——完整的请求里模型看到了哪些工具描述、它当时的 thinking、返回了什么。有了这个就能归因到三类常见原因，修复手段完全不同：第一类是「描述有歧义或重叠」，两个工具的 description 都能解释当前 query，修复方式是改写 description、明确各自的适用边界和「不适用」条件，必要时候合并或拆分工具；第二类是「参数缺失导致模型被迫猜」——它需要的信息没有作为入参暴露，修复是补参数或者提供一个更上层的工具；第三类是「缺少 few-shot 或示例」，在 system 里给一到两个 tool_call 的正例。我强烈建议把「工具调用错误」做成可观的指标：按工具维度统计误选率和调用失败率，这样问题会被主动暴露而不是等着用户投诉。另外还有兜底：对关键危险工具的误调用，服务端必须有硬校验，不能只靠模型判断。","先说后果：直接塞回上下文会带来三宗罪——挤爆上下文预算引发截断、把真正重要的信息淹没在噪声里导致后续步骤质量崩塌、以及成本直线上升。我的处理分四层，按优先级：第一层是工具自身做精炼——这是最该做的，工具的设计原则就是「返回模型需要的最小充分信息」，应该支持分页、过滤、字段选择，让调用方（也就是模型）自己传 limit 和需要的字段。第二层是「摘要加落盘」：超出阈值时只给模型前几条加统计摘要（总数、分布、样例），把完整结果存到一个 artifact 里并在上下文里给一个引用 ID，模型需要细节时再按 ID 去取。第三层是让模型先下推过滤条件，比如告诉它「结果超过 1000 条，请提供更精确的筛选条件重试」，把责任交回模型。最后一个才是粗暴截断，但截断必须明确告知模型「结果已被截断，仅显示前 N 条」，让它知道自己看到的是不完整的，这点非常重要。","这个是典型的「工具集污染」，我一般不共存。首选方案是版本收敛——把 v1 下线或者做成 v2 的内部兼容行为，对外只暴露一个工具，这是最干净的；很多团队留着两个版本只是因为迁移没做完。如果确实必须共存（比如灰度期），我的做法有三个：一是用完全不同的、有强区分度的命名和描述，在 description 里明确写「v2 支持 xxx 场景，v1 已废弃仅用于兼容 xxx」，并给模型一个明确的默认指向；二是用一个外层统一入口加内部路由，模型只需要选一个 query_order 工具，由服务端根据场景决定版本，这样把决策从模型手里拿走；三是只对被授权流量暴露某个版本，用「可见工具集」而非「模型判断」来做隔离。最后我会把混淆案例放进回归集，因为这类问题改完描述很容易又退回去。原则上说：能让模型少做选择，就不要让它做选择。"],
 pass:"知道工具描述要写清楚、数量不能太多。",
 good:"能给出描述四要素、粒度判断标准、数量上限的量化经验，并提出分层/路由/检索三种动态注入方案，以及幂等、返回值精炼、危险操作确认等工程约束。",
 gl:"我的工具设计原则可以归纳成几点。第一，描述要有四要素：这个工具做什么、什么时候该用、什么时候不该用、输入参数的含义与约束。很多工具失败是因为 description 只有一句概括，模型无从判断边界；尤其是「不适用」条件，能显著减少误选。第二，粒度判断标准是「一个工具对应一个用户可理解的动作」，太粗会让参数变复杂、模型填不对，太细会让步数暴涨；我的判断方法是看这个动作是否需要用户侧的一次意图决策。第三，数量上限：经验上同一次请求暴露给模型的工具在 10 到 20 个以内会比较稳，超过 20 个选择准确率会明显衰减，这和 Lost in the Middle 是同源问题。工具真的多的时候用三种方案：分层（先选域，再在域内选具体工具）、路由（用小模型或分类器按 query 选出相关工具子集）、检索（对工具做 embedding，动态注入最相关的几个），这三种我按实施成本从低到高选用。第四是必须有的工程约束：写操作要幂等（带幂等键），返回值要精炼（支持 limit/过滤/字段选择，避免一次塞一万条），危险操作要服务端硬拦截加人工确认，参数要有 schema 校验并给出可理解的错误信息让模型能自我修正。最后一点我很看重：工具描述本身也是要版本管理和 A/B 的，它的改动必须进回归评测。",
 red:"认为工具越多能力越强；工具描述随便写；返回值直接全量塞回上下文。"},

{cat:"LLM应用工程",sub:"Agent",diff:"高阶",type:"设计",tags:["多Agent","协作","任务分解"],
 q:"什么时候需要多 Agent 协作？如何做任务分解与结果汇总？多 Agent 常见的失败模式有哪些？",
 intent:"考察判断力。2025 年多 Agent 被过度炒作，能说清「什么时候不需要」是加分项。",
 ans:[
  "先泼冷水：单 Agent + 好工具能解决 80% 的问题。多 Agent 带来的是复杂度和成本的阶跃式上升（token 消耗可能是 3–10 倍、延迟翻倍、调试难度指数上升）。引入前必须能说清单 Agent 为什么不行。",
  "真正需要的信号：① 上下文污染——子任务差异极大，塞在一个上下文里互相干扰（如同时要写代码、查文档、做数据分析）；② 需要并行提速——多个独立子任务可以并发；③ 需要专业角色差异化——不同子任务需要完全不同的提示词、工具集甚至模型（如一个负责规划用强模型，一个负责格式校验用便宜模型）；④ 需要对抗式校验——用一个 Agent 生成、另一个 Agent 审查，提升可靠性。",
  "常见拓扑：Supervisor（主管分发给多个 worker）、流水线（A→B→C 串行，每步专注一件事）、辩论/评审（多方案并行 + 裁判择优）、黑板模式（共享状态，Agent 自主认领任务）。",
  "任务分解：由规划 Agent 输出结构化计划（带依赖关系、输入输出契约、预计耗时）。每个子任务要有明确的「完成判据」——不含糊的验收标准，否则子 Agent 会交出似是而非的结果。",
  "结果汇总：不要简单拼接。做法包括：让汇总 Agent 按统一 schema 抽取各子结果的关键字段再做整合；要求每个子 Agent 输出时带上「置信度 + 依据来源」，汇总时优先采信高置信度；冲突时要能上报而不是随机选一个。",
  "失败模式（实战中最常见的）：① 无限循环——A 说做完了、B 说不合格，来回踢皮球；② 上下文丢失——子 Agent 之间传递信息时被压缩失真是常态；③ 错误传播——上游 Agent 错了，下游全部放大；④ 责任分散——出了问题不知道是哪个 Agent 的锅（所以必须全链路 trace）；⑤ 成本失控——没有全局预算上限，一次任务烧掉几十块钱。",
  "防护：全局步数与预算硬上限、每个子任务独立超时、共享的结构化状态（而不是靠自然语言传话）、全链路 trace 与回放能力。"
 ],
 follow:[
  "两个 Agent 的输出互相矛盾，你怎么仲裁？",
  "多 Agent 的 token 成本是单 Agent 的几倍？你怎么控制？",
  "你有没有遇到过「多 Agent 反而比单 Agent 差」的情况？为什么？"
 ],
 fa:["仲裁我按成本从低到高有三层。第一层是「让冲突方各自举证」：要求每个 Agent 输出时必须带 evidence（引用了哪些数据源、依据是什么），有证据的优先于没证据的，这是最廉价的判断维度，实践中能解决大部分冲突。第二层是「引入裁判角色」：由一个不带立场的汇总 Agent 或者说 critic 拿着双方的结论和证据做裁决，必要时让它指出冲突点并让相关 Agent 重新就这一点作答一次——注意是就冲突点定向重答，而不是全盘重跑。第三层是「外部事实校验」：如果结论是可用工具验证的（比如双方给出了不同的订单金额），直接调用权威数据源核对，这比任何模型仲裁都可靠。我还会明确一个兜底：如果确实无法裁决，就把分歧如实呈现给用户让用户决定，而不是强行给一个答案——这在很多业务场景反而是对的。无论如何，仲裁过程要留下审计记录。","倍数取决于架构，我给几个量级感受：如果是简单的分工协作（一个规划者加几个执行者），由于每个 Agent 都要带自己的 system prompt 和上下文，token 通常是单 Agent 的 3 到 5 倍；如果 Agent 之间做了多轮讨论和互相批评，10 倍以上很常见，这也是我觉得多 Agent 要慎用的主要原因。控制手段有四个：一是控制 Agent 数量和轮数，这是最直接的杠杆，很多场景下两轮讨论的收益已经饱和；二是上下文隔离，每个子 Agent 只拿它需要的那部分信息，不要把全量上下文复制给每个人；三是用小模型做子任务，不是每个 Agent 都需要最强模型——分类、摘要、格式化这些用便宜模型，只在最终汇总和关键决策用强模型，这是收益最大的一招；四是结果 schema 化，让每个 Agent 输出结构化摘要而不是大段自然语言，传递时只传结论和证据 ID。我会把「单任务的 token 成本」做成一等监控指标，它会非常诚实地告诉你这个架构划不划算。","遇到过，而且我认为这是常态而非例外。最常见的原因有三个。第一是「任务本身不需要分解」——强行拆给多个 Agent，每个人只看到局部信息，缺失了全局一致性，最后拼出来的东西前言不搭后语；一个能整体完成的写作或总结任务，拆成五个人写五段，连贯性一定下降。第二是「误差累积」——多 Agent 是串行链路，每一环的成功率 90%，五环下来只剩 59%，而单 Agent 一次完成就是 90%；这就是为什么流水线式的多 Agent 在没有自纠错的情况下很容易崩。第三是「沟通损耗」—— Agent 之间的信息传递依赖自然语言摘要，每一次摘要都是一次有损压缩，用术语说就是上下文在传递中不断失真。我的判断准则是：只有当「分解带来的收益大于协作带来的损耗」时才用多 Agent，具体来说要么是为了并行降延迟、要么是为了隔离上下文、要么是需要不同专业能力。其他时候，先用单 Agent 加更好的提示词和工具，通常是更简单也更有效的答案。"],
 pass:"能说出 Supervisor、流水线等常见拓扑，知道任务分解的基本做法。",
 good:"能明确给出引入多 Agent 的四个必要信号与「先用单 Agent」的前提，讲清结果汇总的 schema 化与置信度机制，并列出五种真实失败模式及对应防护。",
 gl:"我倾向于谨慎，多 Agent 是被过度使用的技术。引入的四个必要信号：一是确有能力异构——不同子任务需要不同的专业能力或不同的工具权限，比如一个负责写代码、一个负责审查安全；二是上下文必须隔离——单个 Agent 的上下文装不下所有信息，或者把无关信息放进来会严重干扰，这时候拆分是刚需；三是并行可以显著降低延迟——子任务之间无依赖，同时做能把五分钟压到一分钟；四是可靠性需要冗余——需要多个独立视角交叉验证来降低单点幻觉。在这四个信号之前，我的默认建议是先用单 Agent 把提示词、工具、上下文调优到位，因为单 Agent 的调试成本和延迟成本都低得多。任务分解与汇总上我有两个坚持：一是输出必须 schema 化——每个 Agent 返回结构化结果，包含结论、证据 ID、置信度、未完成项，这样汇总阶段才能被程序化处理而不是靠模型自由发挥；二是必须带置信度和失败上报，让子 Agent 有权说「我做不到」，而不是硬凑一个答案。常见的失败模式我会列五种：任务分解不当导致信息割裂、错误沿着流水线累积、角色之间目标不一致互相打架、缺乏全局一致性导致风格或结论矛盾、以及失去用户意图对齐做了一堆无用功。对应的防护是设置共享的结构化黑板状态、引入批判者角色、设置仲裁机制、以及最重要的——全程保留可观测的 trace 来定位问题。",
 red:"认为多 Agent 一定更好，越多越强；讲不出任何失败模式；没有成本和步数的硬约束。"},

{cat:"LLM应用工程",sub:"Agent",diff:"进阶",type:"设计",tags:["Agent安全","死循环","熔断"],
 q:"Agent 出现死循环、卡死、越权操作，你怎么防？超时、重试、熔断怎么设计？",
 intent:"生产可靠性必答题。Agent 的自主性是把双刃剑，5 年经验必须有完整的防线设计。",
 ans:[
  "死循环防护（多层）：① 硬上限——最大迭代步数（如 10 步）、最大 token 预算、最大墙钟时间（如 120s），三个维度都要有，任一触发即中断；② 循环检测——记录「(工具名, 参数哈希)」的调用历史，短时间内重复调用同一工具且参数相同或参数在几个值之间震荡，判定为打转，强制中断或降级；③ 进展检测——每步要求模型输出「这一步离目标更近了吗」，连续 N 步无进展就终止。",
  "超时设计：分层超时——单工具调用超时（如 10s）、单次 LLM 调用超时（如 30s）、整个 Agent 任务超时（如 120s）。超时后要给出「已完成的部分 + 卡在哪一步」，而不是干巴巴的失败。",
  "重试策略：只对幂等的、可重试的错误重试（网络超时、429 限流、5xx）；对业务错误（参数错误、权限不足、数据不存在）绝不重试，直接把错误信息回喂模型让它改参数。重试要有指数退避 + 抖动 + 最大次数上限（通常 2–3 次）。",
  "熔断降级：Agent 失败后的降级路径要预先设计——降级到「单轮 RAG 直接回答」或「转人工」而不是返回错误。整个系统要能在「Agent 能力不可用」的情况下仍提供基础服务。",
  "越权与危险操作：① 工具权限按「用户身份 + 会话上下文」动态下发，用户没权限的工具根本不注入给模型（而不是调用了再拒绝）；② 危险操作（写、删、支付、外发）强制二次确认（Human-in-the-loop）或沙箱预执行 + 干跑（dry run）；③ 最小权限原则——工具只暴露必要参数，租户 ID 这类隔离字段由服务端强制注入，绝不信任模型传来的值。",
  "兜底：所有越权、异常操作必须记审计日志；关键操作有可回滚设计（如发邮件前先存草稿）。"
 ],
 follow:[
  "Agent 卡在第 8 步，前 7 步的工作怎么不浪费？",
  "模型自己伪造了一个 tool_call 说「已执行成功」，怎么防？",
  "熔断之后用户体验怎么保证？"
 ],
 fa:["这正是「状态持久化」存在的理由。我的设计是把 Agent 的执行状态存在外部而不是只活在上下文里：每一步的 tool_name、arguments、result 都会落到一个 step 列表，并对大结果只存引用 ID。这样断点续跑时重建上下文只需要「system prompt + 之前所有 step 的结构化摘要 + 当前待办」，模型看到的信息量远小于原始对话，成本和开头的正常请求接近。这里面有个关键取舍：摘要 vs 全量。我的做法是近几步保留原文保证连贯性，更早的步骤压缩成一两句话的执行纪要，这个策略和长对话的上下文管理是同一套思路。另外设计上要保证每步是幂等的，这样重试或续跑时重复执行某个 step 也不会有副作用。真正难的不是技术而是产品：要在 UI 上让用户看到「已经完成了前 7 步，卡在第 8 步，是否重试或跳过」，把控制权交回给用户。","这条防线必须在服务端，因为我们不能在安全上依赖模型的自觉。核心原则是「工具结果只能来自真实执行」——架构上不让模型有机会自己编造工具返回值。具体做法：一是工具调用的结果由执行框架写入，而不是让模型生成 assistant 消息里的 tool_result；很多应用为了省事让模型一次性输出「思考 + 调用 + 结果」，这就留下了伪造空间，必须拆开由服务端执行后回填。二是任何声称「已执行」的操作，都要有对应的服务端记录做交叉验证——比如模型说已发起退款，服务端查退款流水有没有对应记录，没有就直接判定为幻觉并拦截。三是对高风险操作做二次确认和事后核对，把「模型说了什么」和「系统做了什么」分开记录。我还会加一层：日志里同时保留模型的原始输出和执行结果，出现不一致时告警，这类事件哪怕没造成损失也是重要的质量信号。","熔断之后的体验设计我认为和产品可靠性同等重要，因为用户感知的就是这一段。三条原则：一是「透明」，明确告诉用户当前遇到了什么——「这个任务执行超时已暂停」，而不是沉默或者抛一个技术错误；二是「给出可用结果」，把熔断前已经完成的部分整理成阶段性产出给用户，哪怕不完整也比空白强，并标注哪些是确定的、哪些是待完成；三是「给用户出路」，提供重试、缩小范围重试、转人工三个选项，并且如果用户选择重试，要能从断点继续而不是从头来。策略上我会区分熔断类型：连续工具失败类的熔断可以给出降级答案，超时类的熔断可以转为异步任务，告诉用户「我们继续在后台跑，好了通知你」——把同步改异步是处理长任务最有效的兜底；预算耗尽类的熔断则需要明确告诉用户成本约束。最后所有这些熔断事件都要上报监控，熔断率是一个必须跟踪的稳定性指标。"],
 pass:"知道要设步数上限和超时，知道危险操作要确认。",
 good:"能给出步数/token/时间三重上限、基于调用历史的循环检测、分层超时、按错误类型的重试策略、权限动态下发与服务端强制注入租户 ID 的完整防线。",
 gl:"我把防线分成四层来讲。第一层是硬上限，三重并行缺一不可：步数上限（防无限循环）、token 预算上限（防成本失控）、墙钟时间上限（防卡死），任何一个触发就进入收敛流程，这层是最基本的保命线。第二层是循环检测，这比单纯的步数上限更精准：我会对每一步记录工具名加归一化参数的哈希序列，一旦发现重复模式——比如同一个调用第三次出现、或者 A-B-A-B 的交替——就主动打破循环，可以是强制换策略、注入提示、或者直接收敛。另外「无进展」检测也很重要：连续几步没有产生新的有效信息就该停止。第三层是超时与重试的分层设计：单步工具调用有自己的超时（比如 10 到 30 秒），整个任务有总超时；重试必须按错误类型区分——网络抖动和限流可以退避重试，参数错误应该立刻失败让模型修正而不是重试，权限错误必须终止而不能重试。还要有熔断器：同一个工具连续失败 N 次就熔断一段时间，避免持续打一个已经挂掉的服务。第四层是权限控制，这是防止越权的根本：Agent 拿到的权限应该动态下发且遵循最小权限原则，租户 ID、用户 ID 这类参数由服务端在框架层强制注入而不允许模型自己传，写操作和资金操作必须有服务端硬校验加人工确认。所有这些都要配上可观测——每一步的耗时、token、工具调用都要进 trace，否则出了问题连归因都做不到。",
 red:"只说「设个最大步数」；或完全依赖模型自己遵守提示词里的约束；租户 ID 交给模型传。"},

{cat:"LLM应用工程",sub:"Agent",diff:"进阶",type:"概念",tags:["MCP","协议","生态"],
 q:"MCP（Model Context Protocol）是什么？它给 AI 应用架构带来了什么变化？",
 intent:"考察技术敏感度与架构抽象能力，避免只会用框架不懂原理。",
 ans:[
  "MCP 是模型与外部工具/数据源之间的标准化通信协议，类比「AI 应用的 USB-C 接口」。它规定了应用（Host/Client）如何发现工具（Tools）、读取资源（Resources）、使用提示词模板（Prompts），以及双向通信方式。",
  "解决的核心问题：M×N 的集成爆炸。以前每个 AI 应用要为对接每个数据源写一套适配（100 个应用 × 50 个数据源 = 5000 套），有了 MCP，数据源只需实现一次 MCP Server，所有支持 MCP 的应用都能用。",
  "架构上的变化：① 工具从「硬编码在应用里」变成「可插拔的外部服务」，应用可以在运行时动态发现和挂载工具；② 工具可以独立部署、独立演进、跨应用复用；③ 企业内部的系统（CRM、工单、数据库）只要包一层 MCP Server 就能被各种 AI 客户端接入，不必为每个 AI 应用再写一遍集成。",
  "对 Agent 的影响：工具动态化天然带来「工具太多怎么办」的新问题——MCP Server 挂一堆之后，工具清单可能有上百个，反而加剧了工具选择困难。所以仍需配合工具检索/分组注入。",
  "工程上的现实挑战：① 鉴权与权限传递——MCP Server 如何知道当前操作的是哪个用户、该用户有什么权限，这块规范仍在演进；② 可观测性——跨进程的调用链如何打通 trace；③ 稳定性——外部 MCP Server 挂了要有降级；④ 安全——第三方 MCP Server 本质是可执行代码，供应链风险不可忽视，不能随便接入不可信的 Server。",
  "务实建议：内部系统集成用它确实能显著降低重复劳动；但不要为了「用新技术」而把所有内部函数调用都包成 MCP——进程内函数调用变成跨进程 RPC 会带来延迟、序列化和故障面的增加。"
 ],
 follow:[
  "MCP Server 怎么传递用户身份和权限？",
  "接了 50 个 MCP Server，工具选择准确率怎么保证？",
  "什么情况下你不建议用 MCP？"
 ],
 fa:["这是目前 MCP 生态里相对薄弱的一环，我的理解是这样的：协议本身支持 OAuth 之类的授权机制，Server 可以要求 Client 携带凭证，所以「传身份」是有路径的。但实践中有几个必须注意的点：一是最小权限，MCP Server 应该按 scope 下发能力，而不是拿到用户的所有权限；二是绝不能让模型自己填身份参数——用户 ID、租户 ID 这类必须由 Client 或 Server 侧从会话上下文中派生并强制注入，否则就是一个越权漏洞；三是 服务端要做独立的鉴权校验，不能因为「调用方是我们的 Client 」就信任，因为凭证可能被滥用。我自己的实践原则是：Server 暴露的每个工具都声明所需权限，Client 在连接时按当前用户会话的权限集协商可用工具集，越权的工具根本不出现在模型的可见列表里，把权限控制前移到「可见性」这一层比事后拦截更安全。此外所有的权限判定和拒绝都要有审计日志。","50 个肯定超了模型的可靠选择上限，这里的核心思路和工具治理一样是「动态注入」。方案从简单到复杂：一是按 server 分组，先让模型选「域」——比如今天是数据查询还是代码操作——只把该域的工具放进去；二是对所有工具描述做 embedding，按当前 query 检索最相关的 8 到 12 个注入，这个是目前最通用的做法，成本低效果也不错；三是用一个小模型或者分类器先做工具路由。同时我一定会做两件事：给每个工具的描述写清楚「适用场景和不适用场景」，以及维护一个工具调用质量的看板，统计每个工具的误选率和失败率。还有一个容易被忽略的关键是命名冲突——50 个 server 里很可能有三个都叫 search，必须做命名空间前缀，否则模型必然混淆。最后一个务实建议：与其全接，不如按业务场景裁剪成几个「工具包」，按需加载。","有几个明确的情况。第一，进程内的简单调用没必要包成 MCP——如果工具就是你自己应用里的一个函数调用，包一层协议只会增加序列化开销、调试复杂度和故障点，直接 function calling 更简单可靠，MCP 的价值在于跨进程、跨应用、需要被复用的场景。第二，对延迟极端敏感的路径要谨慎：多一跳通信就有多一跳的开销和失败率，热路径最好直连。第三，安全边界不清晰的场景：如果一个 MCP Server 来自不可信第三方，它拿到的是你 Agent 的上下文和能力，供应链风险很高，尤其要防止恶意 server 通过工具描述做提示注入；所以在接外部 server 之前要有代码审阅和沙箱隔离。第四，团队规模小、工具数量很少的时候，引入这套协议带来的规范和运维成本大于收益。总的来说我的态度是：MCP 解决的是「工具生态互通」的问题，如果你的问题不是这个，就不要为了追新引入它。"],
 pass:"知道 MCP 是工具接入的标准化协议，解决 M×N 集成问题。",
 good:"能讲清它带来的架构变化（工具可插拔、动态发现、跨应用复用），同时指出鉴权、可观测性、安全供应链等现实挑战，并能说出「进程内调用不必都包成 MCP」的务实边界。",
 gl:"MCP 可以理解成 AI 应用与外部数据和工具之间的一个标准化协议层，类比的话它有点像 USB-C：以前每个应用都要为每种数据源写一版专用适配，现在数据源只要暴露一次 MCP Server，所有支持 MCP 的 Client 都能接。它给架构带来的变化我认为有三点最重要：一是工具可插拔——Agent 的能力不再硬编码在代码里，可以在运行时连接新的 server 获得新能力，产品的可扩展性变了；二是动态发现——Client 可以在运行时查询 server 有哪些工具、什么 schema，这让「按需挂载工具」成为可能，直接缓解了工具过多导致选择困难的问题；三是跨应用复用——一个公司做好的数据 MCP Server 可以同时给 IDE、聊天助手、内部平台用，避免每个应用重复对接。但我会诚实地指出它的现实挑战，这也是面试官想听到的：鉴权与权限边界目前还比较原始，必须有意识地做最小权限和服务端强校验；可观测性是个难点，跨进程的调用链要打通才能归因；安全供应链风险不可忽视，尤其是第三方 server 通过工具描述注入恶意指令；还有版本治理和稳定性。最后我想强调那个务实边界——工具就在自己进程内的场景不必都包成 MCP，直接函数调用更可靠。会用新技术很重要，知道新技术在哪里不适用同样重要。",
 red:"只背了「AI 的 USB-C」这个比喻，讲不出具体解决什么问题、有什么代价；或认为它是万能方案。"},

{cat:"LLM应用工程",sub:"Agent",diff:"高阶",type:"设计",tags:["长任务","状态管理","幂等","断点续跑"],
 q:"一个 Agent 任务要跑 5 分钟、调用 30 次工具，怎么做状态管理、断点续跑和幂等？",
 intent:"考察把 Agent 从 demo 推向生产的能力。长任务是 Agent 落地的真实瓶颈。",
 ans:[
  "认知前提：长任务 Agent 本质是一个分布式工作流问题，而不是提示词问题。要按工作流的严谨度来设计：状态显式化、每步可重放、故障可恢复。",
  "状态管理：把 Agent 状态拆成「持久化的结构化状态」和「LLM 上下文」两部分。结构化状态（已完成步骤、中间结果、待办、预算消耗）存 DB；LLM 上下文每次从结构化状态重新组装，而不是依赖内存里的对话历史。这样进程重启也能恢复。",
  "执行模型：推荐事件溯源（Event Sourcing）或显式状态机——每一步产出一条事件（step_started / tool_result / step_completed），整体状态由事件重放得出。好处是天然可回放、可审计、可调试。",
  "断点续跑：任务在任意步中断后，从 DB 读取已完成步骤，只重跑未完成部分。关键约束是每步必须是幂等的——同一输入重跑得到同一结果且不产生副作用（如重复扣款、重复发信）。",
  "幂等实现：给每个「副作用操作」配幂等键（如 任务ID + 步骤序号 + 操作内容哈希），执行前先查是否已经做过；工具侧也要支持幂等键。对无法幂等的操作（发短信），用「预登记 + 确认提交」两阶段。",
  "用户体验：长任务必须异步化——前端提交后立即返回任务 ID，通过 SSE/WebSocket 推送进度（「第 3/8 步：正在查询订单…」）。绝不让用户盯着转圈 5 分钟。",
  "中途干预：支持用户中途取消、修改参数后继续、以及「这一步我不满意，重做」。这些都依赖结构化状态而非对话历史。",
  "成本与超时：为整个任务设 token 与金额预算，接近上限时提前收敛（减少探索、直接给出当前最优结果），而不是硬中断导致任务白跑。"
 ],
 follow:[
  "第 20 步失败了，前 19 步的结果怎么复用？",
  "用户中途改了需求，之前算的结果还能用吗？怎么判断？",
  "怎么防止重复扣费？举个你设计过的幂等键。"
 ],
 fa:["前提是每一步都要持久化。我的设计是「状态与上下文分离」：每一步执行完立刻把 step_id、工具名、参数哈希、结果引用写进一个持久化的 step 表（用事件溯源的方式追加写），上下文只是这份状态的一个投影。那么从失败点续跑时，流程是：读取已完成的 step 列表，重建上下文——把 system prompt、已执行步骤的结构化摘要、当前待办拼起来，然后让模型继续。这里的关键是「不要在恢复时重跑」，靠的是每步的幂等键：同一个 (task_id, step_seq, tool_name, args_hash) 命中已经有成功结果就跳过直接取结果。成本控制上，重建上下文时用摘要而不是全部原文，只保留最近几步的完整内容，这让长任务的恢复成本基本恒定。另外我会给长任务设「软检查点」——在关键节点让用户确认阶段性结果，既提升体验也避免错误延续。","这个需要一个显式的「失效判断」机制。我的做法是给每一步的执行结果记录它的「输入指纹」——也就是这条结果依赖了哪些关键输入（比如查了哪个用户的哪类数据、用了什么时间范围）。当用户修改需求后，重新规划出来的新计划会带新的输入指纹，两相对比就能判断哪些老结果还可以复用。举个具体的例子：用户原来要「查北京上周的销售额」，现在改成「查北京上个月的销售额」，那么「拉取北京地区门店列表」这一步完全可复用，而「拉取上周订单」需要重跑。自动判断不了的时候，我的产品策略是「默认保守复用加提示」——把可用和不可用的部分明确展示给用户，让他一键重跑受影响的部分，而不是偷偷全重跑（浪费钱和时间）或者偷偷全复用（给出过期答案）。最后一个工程细节：需求变更后不要在同一条执行流上改，应该新起一个 run 但允许引用父 run 的结果，这样追溯关系清晰。","幂等键的设计原则是把「这一次业务的唯一性」完整表达出来。我举一个实际设计过的：支付场景的幂等键我用 hash(user_id, order_id, operation_type, idempotency_window)，其中最关键的是客户端生成的一次性 token——前端在用户点「确认支付」时生成一个 UUID 随请求带上，服务端以这个 UUID 为主键做去重。为什么不只用订单号？因为同一个订单可能有多次支付尝试（第一次失败重试是合理的），而同一次用户点击被网络重试触发两次是不合理的，这两件事需要不同的粒度区分。工程实现是：收到请求先查幂等表，命中且状态为成功就直接返回首次结果；命中且处理中就返回「处理中」让客户端轮询；未命中才真正执行，并在同一事务里写幂等记录和业务记录。还要考虑过期时间——通常 24 小时到 7 天，防止存储无限膨胀。我会强调一点：Agent 场景下幂等键必须由服务端框架生成或者校验，不能由模型提供，因为模型可能重复生成所谓的「唯一」键。"],
 pass:"知道长任务要异步化、要存状态、要能断点续跑。",
 good:"能提出「结构化状态 + 上下文重建」的分离设计、事件溯源、步骤级幂等键、异步进度推送、预算接近时提前收敛，并把长任务明确定位为分布式工作流问题。",
 gl:"我会先定性：一个跑五分钟、调用三十次工具的任务，本质上已经不是「一次模型调用」，而是一个分布式工作流问题，所以必须用工作流的思想来做，而不是把它当一个长对话来管理。我的核心设计是「结构化状态与模型上下文分离」——真实的状态存在外部的事件流里，每一步追加写一条记录，包含步骤序号、工具名、参数、结果引用、耗时、token；模型每次看到的上下文是根据这份状态重建出来的投影，而不是把三十条原始结果一直背在身上。这样做带来三个能力：断点续跑（重建上下文继续）、低成本恢复（用摘要而非原文）、以及完整归因（事后能复盘每一步）。幂等方面我坚持每个写操作都要有幂等键，通常是业务维度加客户端一次性 token 的组合粒度，并且第 n 步的重试必须能识别「自己已经执行过」从而跳过而不是重复扣费——这里的关键是幂等键由服务端框架管理，绝不能让模型来提供。依赖的管理上，我会用 step_seq 加参数引用（比如某参数来自 step_7 的输出）来构建依赖图，无依赖的步骤并发执行来压缩总时长。交互上这种任务必须异步化：立刻返回 task_id，通过 SSE 或 WebSocket 推送进度和阶段性结果，让用户看到「已完成 12/30 步」。最后还有一个很实用的设计：预算接近耗尽时提前收敛——在 token 预算用到 80% 时主动让模型收尾输出阶段性成果，而不是硬撞上限后什么都没有。",
 red:"把状态放在内存/对话历史里，进程重启就丢；重跑会重复产生副作用；让用户同步等待 5 分钟。"},

{cat:"LLM应用工程",sub:"Agent",diff:"进阶",type:"设计",tags:["Human-in-the-loop","人工确认"],
 q:"如何让 Agent 在关键操作前请求人工确认？工程上怎么实现？",
 intent:"考察 Agent 安全落地的工程细节，以及交互设计能力。",
 ans:[
  "触发设计：不是等模型「自己想起来要问」，而是服务端硬性拦截。给工具标注风险等级（低/中/高），高风险工具（转账、删除、外发、改权限）在执行前强制走确认流程——即使模型没主动请求也要拦。这样不依赖模型的自觉性。",
  "交互协议：Agent 输出一个特殊的结构化动作 request_confirmation（含操作摘要、影响范围、参数明细、风险提示），前端渲染成确认卡片，用户点确认后，服务端才真正执行。Agent 侧把这次交互视为一次「工具返回」，结果回喂后继续执行。",
  "状态挂起：确认请求发出后 Agent 任务进入 WAITING_USER 状态并持久化，不能占用运行时资源。用户可能几小时后才确认，所以状态必须在 DB 里、且有过期时间（如 24h 未确认自动取消）。",
  "信息充分性：确认卡片必须让非技术用户能看懂——把「DELETE FROM orders WHERE id=123」翻译成「将删除订单 123（张伟，¥1,280），此操作不可撤销」。让模型生成这段话，但参数从结构化数据取，防止模型篡改数值。",
  "分级策略：低风险自动执行；中风险首次确认、后续同类可记忆（本次会话内不再问）；高风险每次必问。可以按金额/影响行数/操作类型设定阈值，而不是一刀切。",
  "批量操作：一次要删 1000 条，不要弹 1000 次确认。做法是「预览 + 一次性批准」——先展示影响清单与统计，用户一次确认后再执行。",
  "兜底：确认流程本身超时/用户无响应，必须走安全侧（默认为不执行）；所有确认与执行结果记审计日志，包含谁在什么时候批准了什么。"
 ],
 follow:[
  "用户批准了一个操作，但执行时参数已经变了（数据被别人改过），怎么办？",
  "确认请求发出后进程重启了，恢复时怎么继续？",
  "你怎么防止「确认疲劳」——用户无脑点同意？"
 ],
 fa:["这是一个典型的 TOCTOU（检查时与使用时的时间差）问题，必须用乐观并发控制来解。具体做法是：用户批准时要锁定的不是「参数的值」，而是「这份参数的快照加版本号」。执行时服务端重新读取相关数据，校验版本号或者关键字段是否还是当初展示给用户时的状态；如果变了，就中止执行并把差异展示给用户重新确认——「您批准时的金额是 1000 元，现在是 1200 元，是否继续」。这里我要特别指出：不能简单地带着老参数执行，也不能自作主张用新参数执行，两者都有风险。对于更严格的操作，可以在审批通过到执行之间设置一个短暂的有效窗口（比如 5 分钟），超时需重新确认。还有一种更彻底的做法是在展示批准请求时就把关键数据做快照冻结，后续操作基于快照执行并要求目标无变更才能提交。总之核心是一条：批准授予的是「对某个特定状态执行某操作的许可」，而不是「执行某操作的无限许可」。","答案是：确认请求本身必须是持久化的状态，而不是内存里的一个 await。工程实现上我把 Agent 的状态机做显式状态转移，其中有一个 WAITING_USER 状态——当 Agent 需要确认时，它把当前执行上下文（含已完成的步骤摘要、待执行动作的提案、要求的权限范围）序列化写库，状态置为 WAITING_USER，进程可以安全地挂掉。用户批准这个动作是一个独立的写操作，把审批记录持久化。Agent 侧有一个恢复器或者定时任务：发现有 WAITING_USER 且已有对应审批记录的任务，就重新hydrate 上下文继续执行。这里还有一个细节是幂等：恢复执行时要保证相同的动作不会因为重复恢复而执行两次，所以批准记录要有 consumed 标记。另外从体验角度，进程重启后用户看到的应该是「你的任务正在继续」，而不是凭空消失或者重新问一遍，这依赖前端也能从 task 状态恢复而不是只依赖长连接。","这个我很在意，因为过度确认会让这道防线形同虚设。四个手段：一是「分级」，按风险等级区分——只有真正不可逆、涉及资金、涉及外部可见后果的操作才需要确认，低风险的直接执行并事后告知可撤销，把确认请求从每天三十次降到一两次；二是「批量」，把同质的一组操作合并成一次批准，比如「本次将修改 5 个文件，是否允许」，而不是逐文件问；三是「范围授权」，允许用户在一段时间内授予某类操作的权限——比如「本次会话内允许读取和写入工作区文件」，避免每个动作都弹；四是「质量」，确认界面要清晰展示将要发生什么、影响范围、可否撤销，用户看得懂才会真正做判断，看不懂就只会点同意。还有一个反向手段是「抽样加确认」——对低风险操作做随机抽样二次确认，既维持注意力又不过度打扰。最后必须配审计日志，让用户和管理员事后能查到每一次批准对应了什么动作，责任清晰本身也能抑制无脑点击。"],
 pass:"知道要有确认环节，模型输出确认请求由前端渲染。",
 good:"能提出服务端按风险等级硬性拦截（不依赖模型自觉）、WAITING_USER 持久化状态、面向用户的可读化翻译、分级阈值与批量一次性批准、超时默认不执行与审计日志。",
 gl:"我会先说一个原则：人工确认这道防线不能依赖模型的自觉，必须是服务端硬性拦截。也就是说，不是提示模型「执行前请询问用户」，而是把这些工具标记成 requires_approval，框架在执行前自动中断并把控制权交回应用侧,模型就算\"想\"绕过也绕不过——因为工具的实际执行权在服务端手里。实现上我把它做成 Agent 状态机的一个显式状态 WAITING_USER：需要确认时，框架把当前执行上下文、待执行动作的提案、参数快照、影响范围全部序列化持久化，然后挂起；用户批准后写入审批记录，由恢复器唤醒任务继续执行。这里的关键工程点是：进程重启能恢复（因为状态在库里而不是内存里）、以及动作执行的幂等（批准记录要有消费标记）。面向用户这一侧我强调「可读化翻译」——不能把一堆 JSON 参数丢给用户确认，要翻译成自然语言说明「将要向 X 发送金额 Y 的转账，手续费 Z，不可撤销」，并提供 diff 视图。体验上还要处理确认疲劳：按风险等级分级低风险的直接执行并支持撤销、同质操作批量一次批准、支持会话级范围授权、以及超时默认不执行而不是默认执行。最后是不可省的审计日志——谁在什么时候批准了什么操作、执行结果是怎样的，这条记录了事故复盘和责任界定才有依据。",
 red:"把确认完全交给模型提示词里的「请先询问用户」；确认状态只存在内存；用户点了同意就直接拿模型给的参数执行不做复核。"},

{cat:"LLM应用工程",sub:"AI架构",diff:"高阶",type:"设计",tags:["可观测性","Trace","排障"],
 q:"一次会话调用了 30 次 LLM、几十个工具，用户投诉「答错了」，你怎么排查？",
 intent:"AI 应用可观测性是 5 年经验最硬的分水岭。做过的和没做过的一听就知道。",
 ans:[
  "前提：如果没有全链路 trace，这道题无解。所以第一答案是「我们每次会话都有一条完整的树状 trace」。",
  "Trace 结构：Trace（一次用户请求）→ Span（每一次 LLM 调用、每一次工具调用、每一次检索、每一次 rerank）。每个 Span 记录：起止时间、耗时、输入输出全文、token 数与成本、模型与参数、提示词 key+版本、检索回来的 chunk 列表及其分数、错误信息。",
  "关联维度（关键）：Span 上要打齐「session_id / user_id / tenant_id / prompt_version / model / rag_config_version / agent_version / 代码版本」。没有这些标签，出问题时无法做聚合归因（比如「是 v3 提示词导致的还是换模型导致的」）。",
  "排查路径：① 拿到 session_id → 打开 trace 树；② 先看耗时与成本分布，定位最慢/最贵的一步；③ 顺着失败的那个最终答案往回追——是检索没召回（chunk 列表里没有正确文档）、还是 rerank 排错了（有但排在第 12）、还是上下文被截断了（正确 chunk 有但 token 超了被裁掉）、还是模型理解/生成错了（上下文都对但答案错）。这四类对应完全不同的修复动作。",
  "回放能力：能从任意 Span 处修改输入重跑（改提示词、改检索参数），对比结果。这是定位「是不是提示词的问题」最高效的手段。",
  "聚合分析：单个 case 之外，还要能聚合——某提示词版本的失败率突增、某模型的超时率上升、某知识库文档的召回贡献为 0（说明索引坏了）、成本按租户/功能/模型的多维下钻看板。",
  "采样与成本：trace 存储成本高（输入输出全文），生产上用「错误请求 100% 采样 + 正常请求 1–10% 采样 + 用户点踩 100% 采样」的tail sampling 策略。",
  "隐私：trace 里含用户输入全文，要做脱敏与访问控制，留存周期要有策略。"
 ],
 follow:[
  "trace 里存了全量输入输出，存储成本扛得住吗？你怎么采样？",
  "怎么从「单条 case 排查」上升到「发现系统性问题」？",
  "上线新提示词后，你怎么快速判断它有没有让线上变差？"
 ],
 fa:["全量存储确实扛不住，尤其工具返回值动辄几千 token。我的采样策略是分层的：基础层是全量的「元数据 Trace」——每次请求都记录，只包含 trace_id、各 span 的耗时、token 数、工具名、状态码、成本、版本号，这部分很轻，一条几百字节，可以全量存并长期聚合；第二层是 Payload 采样——错误请求和异常请求百分百存全文，正常请求按 1% 到 5% 采样，同时对特定标记（新灰度版本、新提示词、重点客户）做强制全采或者更高的采样率。还有一个技巧是尾部采样——等请求结束后再决定要不要存，这样能保证所有失败样本都被留下。另外冷热分层：最近 7 天全文可查，更早的只保留元数据，需要时按 trace_id 去对象存储里捞。最后脱敏是必须的，手机号、身份证、密钥在写入前就在 SDK 层做掩码，这步不能后置。","关键是「归因标签结构化」加上聚合视图。每条 bad case 排查完必须打上一个结构化的根因标签，我常用的分类是四类——召回失败（正确材料没被捞出来）、排序或截断失败（捞到了但没进上下文）、生成失败（材料对了但理解或推理出错）、以及非模型问题（工具返回错误、数据本身有错、前端展示问题）。有了这个标签就可以做聚合分析，把「单条归因」变成「根因分布图」，这一步是质变。接下来是看分布随时间、随版本、随场景的变化：如果召回失败占六成，那投入应该在检索侧而不是提示词；如果某个工具的错误率突增，那是外部依赖出问题。我们会把这个分布做成周会例行看的指标，同时设置阈值告警——某类根因占比突变就触发排查。另一个很有用的做法是「聚类」——把语义相近的失败 query 聚成一簇，往往一簇背后是同一个系统性问题，比逐条看效率高得多。","我会用一个组合拳而不是单一指标。第一道防线是上线前的离线回归——新提示词必须在评测集上跑一遍，和旧版本做逐条对比，重点不是总分而是「变差的用例占比」，总分涨了但 15% 的用例变差这种风险是必须看的。第二道防线是灰度发布加影子流量：先 5% 流量，并且在此之前用影子模式在同一批真实请求上同时跑新旧两版，离线对比差异。第三道防线是线上对比：按版本把关键指标分组,不能只看总体的点赞率，因为流量波动会掩盖问题——要看同期的、分场景的对比。第四是设一个自动回滚红线，比如点踩率相对提升超过某个阈值就自动切回旧版。还有一个经常被忽略的点：要盯代理指标而不只是结果指标——拒答率、答案长度分布、工具调用次数、token 消耗，这些变化往往比最终结果更早给出信号。最后提醒一点，新提示词的评估周期至少覆盖一个完整业务周期，避免因为某天的流量异常就下结论。"],
 pass:"知道要看日志，能说出看 retrieval 的 chunk 和最终 prompt。",
 good:"能给出 Trace/Span 的树状结构与完整打标维度、给出「召回/重排/截断/生成」四类根因的区分定位方法、具备回放与聚合分析能力，并考虑采样成本与隐私脱敏。",
 gl:"我的排查方法是先保证有 trace，再谈定位。Trace 用树状结构组织：根节点是一次用户请求，下面挂 LLM 调用、工具调用、检索、重排这些 span，每个 span 记录耗时、输入输出、token、成本、模型版本、提示词版本，并且整棵树共享一个 trace_id 和 user session id，可以按多维标签检索。有了这个之后，针对「答错了」我按四类根因依次排除，这个顺序很重要因为它决定了投入产出：第一看召回——正确材料到底有没有被检索到，这会占相当大比例，没召回的问题要从切分、embedding、query 改写去修；第二看重排和截断——材料捞到了但排序靠后或者超出 top-k 被砍掉，也是最容易被误判成「模型笨」的一类；第三看生成——材料明确还在上下文里但模型理解或推理出错,这时候才是提示词和模型的问题；第四看工具和数据本身有没有返回错误，以及是不是产品形态的问题。除此之外，我一定会做「回放」能力——拿这条 case 用不同的提示词版本、不同模型重跑，确认改动真的能修好它；这需要 trace 里保存足够的重建信息。聚合层面我会给每个 bad case 打结构化根因标签，做成根因分布随时间变化的看板，这样才能从个案上升到系统性问题。最后两点不能忘：采样（头部报错全采、正常按比例采、冷热分层控成本）和隐私脱敏（在 SDK 层就掩码敏感数据，不要把 PII 写进日志系统）。",
 red:"靠 print 日志和人工复现；无法定位是哪个环节出错；改了线上提示词后无法评估影响。"},

/* ============ D. 训练 / 微调 / 评测 ============ */
{cat:"LLM应用工程",sub:"训练与评测",diff:"基础",type:"概念",tags:["微调","RAG","决策"],
 q:"什么时候该微调，什么时候不该？给出 RAG / 微调 / 提示工程的决策路径。",
 intent:"经典决策题。5 年经验要能顶住「老板要求微调」的压力给出正确判断。",
 ans:[
  "核心区分：RAG 解决「知识」问题（模型不知道这些信息），微调解决「行为」问题（模型知道但表达方式/格式/风格不对）。用微调灌知识是错误用法——知识会过时、会产生幻觉、无法溯源、无法更新。",
  "决策树：① 模型不知道私有知识（公司制度、产品文档）→ RAG；② 知识需要实时更新 → RAG；③ 答案需要引用溯源/可审计 → RAG；④ 输出格式不稳定/需要严格遵循特定风格或结构 → 先试提示工程 + 结构化输出，不行再微调；⑤ 需要稳定的领域行为（如客服的语气、问诊的追问逻辑、特定分类体系）→ 微调；⑥ 需要用小模型达到大模型在某垂直任务上的效果以降成本 → 微调（蒸馏）；⑦ 需要极低延迟、无法接受长提示词 → 微调（把指令内化，省掉 few-shot 的 token）。",
  "不该微调的情况：数据少于几百条、需求变化频繁、只是想「试试看」、团队没有评测体系（没法验证微调到底有没有变好）、问题其实出在检索/提示词上。",
  "成本对比要讲清：微调一次性训练成本 + 每次都要承担的模型部署/运维成本 + 每次更新都要重训；RAG 是持续的存储与检索成本，但知识更新即时生效。",
  "实践建议：永远先做「提示工程 + RAG」的基线并量化效果。只有在基线明确卡在「模型行为」而非「知识缺失」时，才考虑微调。而且微调往往不是终局——很多项目最终是「微调做格式/风格 + RAG 做知识」的组合。",
  "反例警示：用微调去记 1000 条 FAQ，结果模型记住了 60%、剩下的开始编，且无法溯源、无法更新——这是典型的用错工具。"
 ],
 follow:[
  "老板坚持要微调，你怎么说服他？",
  "微调 + RAG 组合使用时，两者的边界怎么划？",
  "微调之后知识更新了怎么办？"
 ],
 fa:["我不会直接反对，而是把他的目标翻译成技术方案。老板说要微调，通常真正的诉求是三个之一：效果不够好、想要更强的领域掌控感、或者担心数据出域安全性。如果是效果问题，我会先拿出当前 bad case 的根因分布给他看——如果六成是材料没召回，那么微调完全解决不了，钱花下去没水花，这时候拿出数据比讲道理有用得多；同时给出一个承诺：我们先用两周把 RAG 基线优化到位，用同样的评测集对比，如果仍然达不到目标，再拿预算做微调，这样他看到一个明确的 checkpoint 而不是无限期的等待。如果是数据安全或合规诉求，那微调或者私有部署确实是合理解法，我会支持但要对齐预期——算清楚数据准备、训练、评测、持续迭代的人力成本，这不是一次性投入。我的经验是，老板要的往往不是微调，而是「效果变好且可控」，把这两件事分开谈就好谈了。","我的划分原则是「微调管行为和形式，RAG 管事实和内容」。具体来说，微调适合注入的是：输出格式和风格的稳定性、领域特定的推理逻辑和判断标准、术语和表达习惯、工具调用的行为规范、以及减少特定的坏习惯（比如废话太多、不肯拒答）。RAG 适合注入的是：会变化的事实性知识、长尾的具体信息、需要引用溯源的内容、以及任何有时效性的东西。一个很直观的判断方法：如果这部分内容半年后会过时，它就不该进模型权重，应该走 RAG；如果它是一种「做事方式」，它就适合微调。组合使用的典型收益是：微调让模型更好地理解你们领域的 query、更好地遵循你们的回答规范，从而让 RAG 的效果也被放大，两者是乘法而不是加法。反过来如果把易变知识微调进去，它不仅会过时，还会和 RAG 召回的内容冲突，产生更难以诊断的错误。","这是微调最大的隐性成本，我在评估阶段就会把这个先说清楚，避免上线半年后被动。三个应对层次：一是建立微调流水线而不是一次性人工流程——把数据准备、训练、评估、发布做成可重复执行的 pipeline，知识更新时重跑一遍，通常一天内能出新版；这件事不做，第二次微调会比第一次还痛苦。二是版本化管理（数据版本、模型版本强绑定），配合回归评测门禁，确保每次重训不会引入新的退化。三是降低更新频率——把高频变化的知识剥离到 RAG，只把稳定的行为规范留在权重里，这样需要重训的频率从每周降到每季度。还有一个必须有的是「知识新鲜度」的监控，例如某些问题答旧了会被线上指标捕捉到，这个信号要能触发「该重训了」的流程。我还会提醒，如果你们的业务知识每周都在变，那这条路本身就不合适，应该走 RAG 或者两者的组合。"],
 pass:"能说出 RAG 管知识、微调管行为的基本区分。",
 good:"能给出完整的决策树并说明每类场景的理由，量化对比成本，提出「先做基线再判断」的路径，并能指出用微调灌知识的典型反例。",
 gl:"我会先给出一个明确的决策路径，而不是罗列优缺点。第一问是「模型的知识够不够」——如果它缺的是事实性知识（公司政策、产品文档、最新数据），答案是 RAG，用微调灌知识是典型的反例：它既不能保证准确、又会过时、还无法引用溯源，成本和效果都不划算。第二问是「模型的风格和型不对」——如果它缺的是稳定的输出格式、领域术语习惯、特定的推理逻辑、或者工具调用的行为规范，这时候先尝试提示工程（加 few-shot、加详细指令），只有当提示词已经很长、few-shot 吃掉大量上下文、或者行为稳定性仍然不达标时，才考虑微调。第三问是「有没有强约束动机」——数据不能出域必须私有部署、延迟要求导致必须小模型、或者成本量级使得必须压缩模型体积，这些情况下微调是直接手段。我的核心原则是「先把基线做到极致再判断」：把 RAG 的解析切分、混合检索、重排、query 改写，以及提示词都优化到位，用评测集量化 bad case 的根因分布，只有在明确看到「瓶颈确实在模型行为而非信息和技巧」时才启动微调。成本对比也必须量化：提示工程的成本几乎为零且当天见效；RAG 是一次中等投入但持续可用；微调在数据准备、训练、评测和长期迭代上的隐性成本通常被严重低估，尤其是「知识更新了怎么办」这件事必须在立项时就想清楚。最后我会补一句：绝大多数我见过的项目，最终都是 RAG 加好的提示词解决的，真正需要微调的是少数。",
 red:"遇到效果不好就想到微调；认为微调能让模型「学会」公司知识；说不清两者的适用边界。"},

{cat:"LLM应用工程",sub:"训练与评测",diff:"进阶",type:"概念",tags:["LoRA","QLoRA","超参"],
 q:"LoRA / QLoRA 的原理是什么？rank、alpha、学习率这些超参怎么定？",
 intent:"考察微调是否真上手过，还是只调过 API。",
 ans:[
  "原理：冻结预训练模型权重，只训练注入的低秩分解矩阵。对某个权重矩阵 W（d×k），不直接更新 W，而是训练 B（d×r）和 A（r×k）两个小矩阵，使得 ΔW = B×A，其中 r << min(d,k)。前向传播时 W' = W + (alpha/r)·BA。参数量从 d×k 降到 r×(d+k)，通常只占原模型的 0.1%–1%。",
  "好处：显存与算力需求大幅下降（单卡可训）、训练快、可插拔（不同任务训不同的 adapter，切换只需换几十 MB 的权重）、缓解灾难性遗忘（原权重冻结）。",
  "QLoRA：在 LoRA 基础上把基座模型量化到 4-bit（NF4 量化 + 双重量化 + 分页优化器），进一步降低显存。代价是有轻微精度损失，推理时需要反量化（或合并权重）。",
  "rank（r）：控制表达能力。经验起点 r=8 或 16；任务复杂、数据量大（>1万条）可以上 32/64；r 越大越接近全参数微调但过拟合风险和显存也上升。通常 8–64 之间，超过 64 收益递减。",
  "alpha：缩放系数，实际更新幅度是 alpha/r。常见做法 alpha = 2×r（如 r=16, alpha=32）。有些实现里固定 alpha=2r 相当于把缩放固定为 2，调 r 即可。",
  "学习率：LoRA 的学习率比全参数微调大得多，通常 1e-4 ~ 2e-4（全参微调一般 1e-5 ~ 2e-5）。用 cosine 衰减 + warmup（warmup 占比 3%–10%）。",
  "其他：target_modules 一般覆盖所有线性层（q_proj, k_proj, v_proj, o_proj, gate/up/down_proj）效果比只训 q,v 好；dropout 0.05–0.1 防过拟合；epoch 通常 2–3 轮，多了容易过拟合（尤其小数据集）。",
  "调参方法：先用小数据 + 少步数跑通流程验证 pipeline 正确，再网格搜索 r × lr 的少数几组，用验证集 loss 和下游任务指标选。不要一上来就大海捞针。"
 ],
 follow:[
  "训练 loss 降了但线上效果没变好，可能是什么原因？",
  "LoRA 权重怎么合并部署？多个 adapter 怎么切换？",
  "你遇到过 LoRA 训练不稳定（loss 爆炸）吗？怎么解决的？"
 ],
 fa:["有几种可能，我按排查顺序说。最常见的是「评估集不代表线上分布」——loss 下降说明模型确实学会了训练集的模式，但训练集和真实流量有偏，比如在训练数据里回答都很长而线上用户期望简短，这种情况要回去修数据的分布。第二种是「过拟合」——模型背下了训练集，训练集 loss 很低但验证 loss 已经开始回升，办法是减少 epoch、降低学习率、增加数据多样性、加强正则。第三种是「指标不对齐」——你优化的是下一个 token 的预测损失，但线上看的是某个业务指标，两者本来就不是一回事，这种情况需要引入偏好对齐或者直接以业务指标构建验证集。第四种是「灾难性遗忘」——目标变好了但通用能力下降导致整体体验恶化，这需要混入通用数据。我的排查顺序是先确认验证集可靠且与线上同分布，再看是否过拟合，然后检查是不是评估指标本身选错了，最后才怀疑训练过程。还有一个实操经验：上线前一定要做小流量 A/B，离线指标的提升只能作为放行的必要条件而不是充分条件。","合并部署的核心是把 ΔW 加回原始权重：W' = W + (alpha/r) × B × A，合完之后就是一个普通的完整模型，推理没有任何额外开销。是否合并取决于场景：如果只服务单一任务，直接合并最省；如果需要服务的 multiple任务，我会保留 base 模型加上多个 adapter，在推理框架层做切换——vLLM 这些框架支持运行时加载不同的 LoRA adapter，可以在同一个请求里指定，这样多个 adapter 共享一份 base 权重显存，成本比部署多个完整模型低得多。关于多 adapter 切换的实践点：一是要给每个 adapter 版本号并和提示词版本对齐，避免混淆；二是注意切换的预热开销,高频切换会影响延迟；三是有些多 adapter 合并会互相干扰,尤其是 rank 较大或者 task 差异很大时，需要评估。我的建议是：先各自独立测试没问题，再评估合并共存；如果任务之间差异极大，宁可拆成多个服务也不要硬塞。","遇到过，loss 爆炸在 LoRA 微调里通常是几个具体原因。最常见的是学习率过高——LoRA 的学习率通常远高于全参微调，常见在 1e-4 到 2e-4 量级，但如果任务数据量很小或者 batch 很小，这个值还是会导致发散；我一般从 1e-4 起，配合 warmup 和 cosine 衰减。第二个原因是数据里有脏样本——极长的文本、乱码、重复内容会造成巨大的梯度，去重和长度过滤能解决一大半。第三个是混合精度问题，尤其是某些模型在 bf16 下训练不稳定，换成 fp32 主权重加 bf16 计算会好很多。第四个是 target_modules 配置错误或者 gradient checkpointing 的 bug。我的处理流程是：先降到很小的学习率跑通一个 subset 确认 pipeline 正常，再逐步加大；加上 gradient clipping；终于 loss 曲线要实时监控并对 spike 告警。如果仍然不行，我会怀疑数据，抽几百条人工看一遍——经验上一次数是有问题的库，模型很可能九次是数据有问题。"],
 pass:"知道 LoRA 是低秩矩阵、省显存，能说出 r 和 alpha 的大致取值。",
 good:"能讲清 ΔW=BA 的数学形式与 alpha/r 缩放关系，给出 r/lr/epoch 的实战取值区间与理由，说明 target_modules 覆盖范围的影响，并给出「先跑通再网格搜索」的调参路径。",
 gl:"原理我这样讲：LoRA 的洞察是「微调时的权重更新矩阵 ΔW 是低秩的」——你不需要更新整个 W，只需要用两个小矩阵 B 和 A 的乘积来近似它，ΔW = B × A，其中 A 是 r×d、B 是 d×r，中间维度 r 远小于原矩阵维度。这样可训练参数从 d×d 降到 2×r×d，通常只有原模型的千分之一量级,显存和 checkpoint 体积都大幅下降。alpha 是缩放因子，实际更新是 (alpha/r) × B × A，引入它是为了让『调 r 的时候不用重新调学习率』——把 scaling 解耦出来。QLoRA 是在此之上再叠一层：base 模型用 4bit 量化加载，配合分页优化器处理显存峰值，让单卡就能微调模型。超参上我给几个实战值：rank 通常是 8/16/32/64，多数任务 16 到 32 足够，只有任务特别复杂或者需要学习大量新知识时才上 64 以上；alpha 我习惯设成 r 的两倍，也就是 scaling 为 2，这是比较稳的默认值；学习率 LoRA 在 1e-4 量级，全参微调则是 1e-5 量级，这个差一个数量级很重要；epoch 一般 2 到 3 个，数据量小可以适当增加但要盯着验证 loss 防过拟合。target_modules 我建议覆盖所有线性层——包括 attention 的 q/k/v/o 和 FFN 的 up/down/gate，只调 q/v 是早期论文的做法，实践中覆盖广一些效果更好，代价只是多一点显存。调参路径我坚持「先跑通再搜索」：先用一个保守配置跑完整条链路确认没有 bug，拿到 baseline 分数后再对 r、lr、epoch 做小规模网格搜索。还有一条我会强调——大多数情况下，多花时间改数据比多花时间调超参收益大得多。",
 red:"只听过名字；把 LoRA 和量化混为一谈；超参全靠抄 GitHub 默认配置且说不出为什么。"},

{cat:"LLM应用工程",sub:"训练与评测",diff:"进阶",type:"设计",tags:["SFT数据","数据质量"],
 q:"SFT 数据怎么构造？多少条才够？如何做质量过滤（去重、难度、多样性）？",
 intent:"数据质量决定微调上限。考察是否理解「数据工程 > 调参」。",
 ans:[
  "核心认知：微调效果的天花板由数据质量决定，超参调优的边际收益远小于数据清洗。大部分微调失败的案例都是数据问题而非训练问题。",
  "数据来源：① 真实业务日志（最有价值，但需脱敏与授权）；② 专家标注（质量最高，成本最高）；③ 强模型蒸馏（用 GPT/Claude 级模型生成，注意许可协议与服务条款）；④ 自造（Self-Instruct，用种子问题让模型扩展生成）。",
  "数量：没有魔法数字，但经验区间是——风格/格式对齐类 500–2000 条就能看到明显效果；复杂任务（多步推理、领域问答）通常 5000–50000 条。质量远比数量重要：1000 条高质量数据 > 10000 条噪声数据。",
  "去重：① 精确去重（哈希）；② 近似去重（MinHash / SimHash / embedding 聚类后每簇保留代表），去掉高度相似的模板化样本；③ 指令去重和答案去重都要做。",
  "难度分层：数据不能全是简单样本，否则模型学不到难的处理方式；也不能全是难题，否则基础能力退化。做法是用模型给样本打难度分（或按「强模型一次能否答对」划分），保留合理的难度分布，对难题可以过采样。",
  "多样性：按「任务类型 × 领域 × 输入长度 × 输出长度 × 语言」分层统计，看哪些格子是空的就补哪些。用 embedding 聚类可视化检查分布是否均衡，避免数据全集中在少数几个模式上。",
  "质量过滤实操：① 规则过滤（长度异常、含乱码、含重复 n-gram、截断没写完的）；② 模型打分（用一个模型当裁判给「指令清晰度 / 答案正确性 / 有帮助程度」打分，过滤低分）；③ 一致性校验（同一问题多次采样答案，一致性低的说明题目本身有歧义，剔除）；④ 人工抽检——这一步永远不能省，抽 100 条人工看，是发现系统性问题的唯一可靠方式。",
  "验证集：必须留出独立验证集（不与训练重合），且验证集的分布要贴近真实线上分布而非训练分布，否则指标虚高。",
  "数据版本管理：数据集也要有版本号和变更记录，否则「这版模型为什么变差了」无法归因。"
 ],
 follow:[
  "1000 条数据能微调出可用的模型吗？什么条件下可以？",
  "你怎么发现训练数据里有系统性的标注错误？",
  "用商业大模型生成训练数据，有哪些合规风险？"
 ],
 fa:["可以，但要看\\\"可用\\\"的定义和三个条件。这里的现实认知是：微调主要改变的是「行为和形式」，而不是「注入大量新知识」。所以如果目标是让模型学会稳定的输出格式、遵循特定的回答风格、掌握某个领域的推理套路、或者可靠地调用某几个工具，1000 条高质量数据确实够了，我见过几百条就见效的案例。条件有三个：一是数据质量足够高且分布贴近真实请求，噪声大的话还不如不要；二是 base 模型本身已具备相关的底层能力，微调只是「激发和固化」它，如果模型完全没这个能力，一万条也很难；三是任务边界清晰、输出空间收敛，开放式创作类的任务需要更多数据。反之，如果目标是让模型记住大量事实性知识、或者学会它原本不会的复杂推理，1000 条远远不够，那时候正确做法是 RAG 或者换更强的 base。我还会提醒：起步阶段宁愿用 500 条精选数据先跑出 baseline，看看有没有收益，再决定是否继续扩量，这比一开始就砸几万条标注预算更理性。","有三类信号能把它揪出来。第一类是「模型行为本身」：如果标注存在系统性错误（比如所有涉及退款的问题都标注成了同一种处理方式），模型会高置信度地重复这个错误，表现为某一类样本的错误率异常地一致地高，而不是随机分布。第二类是「交叉验证」：我习惯留出一部分数据用不同的来源或不同的标注者重标，比对一致率；系统性的差异就会直接暴露。第三个最实用的方法——训练小模型做过滤：用全部数据训一个小模型，然后看哪些样本的 loss 特别高或者预测和标注严重不符，把这些样本捞出来人工看，这往往能精准定位到成片的标注错误。我还会在最终验证集上做分层：每类分别算准确率，某类特别低通常不是模型笨而是那类标注有问题。最后一条经验是：随机抽 100 条人工看一遍，这是最笨但从来不会让人失望的手段。","这一块我会比较谨慎，主要有三点。第一是服务条款层面的风险——很多商业模型的使用条款明确禁止用输出去训练竞品模型，即便允许也要注意条款变化，这属于法务要确认的事项，不是我们能自己判断的；我通常会优先选择条款明确允许数据蒸馏的服务或者直接用开源模型生成。第二是数据污染和偏差——生成数据会继承教师模型的偏见、错误和表达习惯，并且多样性往往不足，直接用会导致模型看起来很像教师但错误也被继承，需要做去重和去偏。第三是被忽略但有实际影响的一点：如果生成过程中输入了公司的敏感数据，输出可能包含泄漏信息进入训练语料，这在数据合规层面是有风险的。我的做法一般是三条腿：优先使用内部真实数据（最有价值也最合规）、使用明确允许商业使用的开源模型做生成、以及对生成数据做必要的过滤和人工抽检，同时把每条数据的来源和许可信息记录下来，用于追溯。"],
 pass:"知道数据要清洗、要去重，知道几百到几千条的量级。",
 good:"能给出多来源数据策略、分层去重/难度/多样性的具体手段、模型打分+人工抽检的质量过滤流程，强调独立验证集与数据版本管理，并指出「数据质量 > 超参调优」。",
 gl:"我的数据策略是多来源组合而不是单一渠道：优先级最高的是线上真实被采纳的回答和用户修正过的内容，它天然贴合真实分布；其次是业务专家针对难点写的高质量示范；第三是模型生成加人工筛选，用来扩充长尾覆盖；最后混入少量通用指令数据防止灾难性遗忘。数量的回答我不会给死数字，而是说取决于任务的开放程度：封闭的格式转换、分类、抽取类任务，几千条就能收敛；开放式生成通常需要上万条；并且我建议先小规模跑出baseline看收益再扩量。质量过滤这块我会做三个维度的处理：去重是第一步，用 embedding 聚类加 MinHash 去掉近似重复，避免模型背答案；难度分层是第二步，我倾向于过滤掉过于简单（模型已经能做对）的样本，把预算集中在对模型有增量 information的样本上，同时剔除过于模糊连人都标不准的噪声；多样性是第三步，按意图、长度、场景、用户类型做分层采样保证覆盖。具体流程我推荐「模型打分加人工抽检」——用强模型按 rubric 给每条数据打分，低分剔除，同时对抽样结果人工复核打分器本身的准确性。两个工程习惯必须有：一是独立的验证集（绝不参与训练，最好来自真实分布），二是数据版本管理——数据、训练配置、模型版本三者绑定，否则几个月后你完全没法复现当时的结果。最后我想强调一句经验：数据质量的收益远大于超参调优，同样的超参配置，换一份清洗过的数据，效果差距经常是几个百分点级别的，而调学习率往往只有零点几个百分点。",
 red:"认为数据越多越好；只做简单长度过滤；没有独立验证集；从未人工抽检过训练数据。"},

{cat:"LLM应用工程",sub:"训练与评测",diff:"进阶",type:"设计",tags:["微调评估","灾难性遗忘"],
 q:"微调后怎么评估？灾难性遗忘怎么检测和缓解？",
 intent:"考察评估的完整性。很多人只测目标任务，忽略能力退化。",
 ans:[
  "评估必须三层：① 目标任务指标（微调想提升的那个）——这是主指标；② 通用能力回归（通用问答、推理、指令遵循、安全性）——检测遗忘；③ 线上业务指标（真实的成功率、点踩率、成本、延迟）——最终裁判。只看第一层就上线是危险的。",
  "对比基准要公平：和「基座模型 + 相同提示词」对比，而不是和模糊的记忆印象比。要做多次采样取平均（生成任务单次结果波动大），并做统计显著性检验（样本量足够时）。",
  "灾难性遗忘检测：准备一份「冻结的通用能力评测集」（如几百条覆盖推理、数学、代码、写作、安全拒答的通用题），每次微调后都跑一遍。如果目标指标涨了但通用指标跌了，就要权衡——除非你的场景是完全封闭的垂直任务，否则通用能力下跌通常不可接受。",
  "缓解手段：① 降低学习率、减少 epoch（最常见有效的办法，很多遗忘其实是过拟合）；② 数据混合——在训练数据里掺入 5%–30% 的通用指令数据（这叫 rehearsal），效果往往立竿见影；③ 用 LoRA 而非全参微调（冻结原权重天然缓解）；④ 减小 rank；⑤ 只微调部分层或只训特定模块；⑥ 用 KL 散度正则约束输出分布不要偏离基座太远。",
  "其他微调风险：过拟合（训练集完美、验证集很差）、风格过强（所有回答都变成一个腔调，即使问题不需要）、安全性退化（微调可能削弱对齐，让模型更容易执行有害指令——这一点常被忽略但很危险）、幻觉增加（在知识类任务上微调尤其明显）。",
  "上线策略：影子流量并行跑一段时间，对比新旧模型，指标不劣化再切量；保留一键回滚到基座模型的能力。"
 ],
 follow:[
  "目标指标涨了 5%，通用能力跌了 8%，你上不上？",
  "微调后模型安全性变差了，怎么发现？怎么修？",
  "怎么判断是过拟合而不是遗忘？"
 ],
 fa:["这个要看业务的性质和这个溢出可接受的程度。我的决策框架是三问：第一，「通用能力跌的这部分，是不是我们产品的核心场景？」——如果跌的是多语言、闲聊这些我们的产品根本不用的能力，那这个交换是划算的，因为用户对不存在的功能没有感知；如果跌的是我们自己产品里也依赖的能力（比如一个文档助手跌了长文总结能力），那就不能接受。第二，「跌幅是均匀下降还是断崖式跌」——如果是某些特定领域完全崩了而其他正常，风险远大于均匀下降，因为断崖意味着它会以不可预测的方式出错。第三，「有没有技术上的补救手段」——混入通用数据、降低学习率、减少 epoch、用 LoRA 限制更新幅度，通常能把遗忘压到很小。下一步我会带着这三问的结论去找产品负责人对齐，让业务方基于信息做决策而不是工程师自己拍板。如果一定要我给出默认倾向：在可以补救的情况下我会倾向于不上，先用缓解方案把通用能力跌压到 3% 以内再重新评估。","安全性的发现我会做专项红队测试而不依赖常规评测——常规评测集里几乎没有对抗性用例，所以安全退化往往是隐性的。具体做法是：准备一套安全用例集（越狱尝试、有害请求、诱导泄露个人信息、诱导给出危险建议），在每次微调后必跑，比较拒答率和有害输出率。还有一个重要的观测手段是上线后的异常监控——有害输出虽然罕见但一旦出现就是事故，我会做关键词和分类器双重检测。至于修复，通常有三个层次：最直接的是在训练数据里补充安全相关的样本（正确拒答的示例），让模型重新学会边界；其次是混入一部分安全对齐数据再做一次轻量训练；第三是在推理侧加护栏——输入侧做意图检测和有害 query 过滤，输出侧做内容安全检查，这层虽然治标但在工程上最可控。我的经验是，微调特别是用小数据微调时，很容易破坏原有的安全对齐，所以安全性必须做成发布的强制门禁，而不是上线后才发现。此外还有一个常被忽略的相关风险：幻觉可能增加，因为模型被训练成「总要给出某种特定风格的答案」，可能会变得更敢于编造。","两者的表现很不一样，可以用几个手段区分。最可靠的是看训练曲线：过拟合的典型特征是训练 loss 持续下降而验证 loss 在某点后开始回升，这时候模型是在背训练集；而遗忘不会有这个特征，它的验证 loss 可能也正常，但通用能力测试集会明显下降。第二个判据是「错误类型」：过拟合的模型会在训练样本上表现极好但在同分布的未见样本上大幅下降，表现为泛化能力差；遗忘的模型则在原任务上依然好，但在完全不相关的任务（比如基础的常识问答、简单的指令遵循、语言流畅度）上退化。第三个做法是做控制实验：拿一小部分混入的通用数据重新训练一轮，如果通用能力恢复而目标指标不变，说明是遗忘；如果目标指标也掉了，说明之前的模型只是适应了数据分布。还有一个廉价的判断：降低 epoch 或学习率重训，如果各项指标都更均衡，那多半是训练强度过大导致的过拟合加轻微遗忘，这两者经常同时发生。"],
 pass:"知道要用验证集评估，知道微调可能损害通用能力。",
 good:"能给出三层评估体系、对比基线的公平性与显著性要求、通用能力冻结集的做法，以及学习率/epoch/数据混合/LoRA 等具体缓解手段，并指出安全性退化和幻觉增加这两个常被忽略的风险。",
 gl:"我会把评估做成三层。第一层是目标能力的评测集，也就是你微调想解决的那个任务的分层测试集——按场景、难度、长度分层，不能只报一个总分，因为总分会掩盖某一层崩掉；这一层必须和微调前的 baseline 做同条件公平对比（同样的 prompt、同样的解码参数、同样的打分方式），并且样本量足够支撑显著性判断，我通常要求跑多次取平均或者至少有几十条样本，避免仅凭几条样本波动下结论。第二层是通用能力冻结集：从公开 benchmark 或者自己的通用任务里固定一批离线评测样本，专门用来测有没有灾难性遗忘，这个是发布的门禁。第三层是安全性和幻觉专项：准备一套红队用例（越狱、有害请求、隐私泄露诱导），以及一组「应拒答」用例，因为微调经常会让模型变得更敢答、更敢编，这是最容易被忽略的两个退化方向。此外还必须有线上小流量 A/B 作为最终确认。至于缓解灾难性遗忘的具体手段，按我使用频率排：混入 10% 到 30% 的通用指令数据是最有效的；控制训练强度（更低的学习率、更少的 epoch）次之；用 LoRA 并保持较小的 rank 天然限制更新幅度，比全参微调遗忘小得多；只在必要层训练、或者对重要权重做正则约束（如 L2 或类似 EWC 的思路）也可以。核心态度是：微调是一个不断做减法的手艺，与其事后补救，不如一开始就用温和的参数和保守的数据配比。",
 red:"只测目标任务；没听过灾难性遗忘；微调完直接上线没有回归评测。"},

{cat:"LLM应用工程",sub:"训练与评测",diff:"进阶",type:"设计",tags:["模型选型","开源vs商用"],
 q:"开源模型 vs 商业 API，你怎么选？评估维度有哪些？",
 intent:"考察综合决策能力，涉及技术、成本、合规、风险多个维度。",
 ans:[
  "维度一 效果：在你的业务评测集上跑分，不要用公开榜单代替。注意区分「通用能力」和「你的任务能力」——很多场景下小模型 + 好的 RAG/提示词能追平大模型。",
 "维度二 成本：算 TCO 而不只是单价。商业 API 是按 token 付费（可变成本，用得多花得多）；开源自建是 GPU 固定成本 + 运维人力。有个交叉点：量小用 API 便宜，量大到一定程度自建更划算（常见分界线在每月几千万到上亿 token 量级，取决于模型大小和 GPU 单价）。",
  "维度三 延迟与稳定性：商业 API 有网络往返、可能限流、可能受区域限制；自建可控制延迟但要做高可用。首 token 延迟（TTFT）对交互体验影响极大。",
  "维度四 数据与合规：这是最容易被低估的维度。金融、医疗、政务等场景数据不能出域，必须私有化部署；商业 API 要确认厂商的数据留存政策、是否用于训练、是否符合等保/个人信息保护要求。",
  "维度五 可控性：开源可以微调、可以改解码策略、可以加约束解码、可以做深度定制；商业 API 只能调参数，模型升级（有时是静默的）会导致行为漂移——线上效果可能某天突然变化而你毫无察觉。这一点很致命。",
  "维度六 团队能力：自建推理需要懂 vLLM、GPU 运维、弹性伸缩的人。没有这个能力硬上自建会变成运维灾难。",
  "务实策略：混合使用（模型路由）——简单/高频/低成本的任务用小模型或开源模型，复杂/高价值的用强商业模型；商业 API 做冷启动验证需求，跑通后再评估是否用开源降本。架构上用 LLM 网关屏蔽差异，保证可切换。",
  "合同与风险：关注商业 API 的 SLA、限流配额、停服风险、价格变动历史；开源要关注许可证（Llama、Qwen、DeepSeek 各自的商用条款不同）。"
 ],
 follow:[
  "商业 API 模型静默升级导致线上效果变差，你怎么防？",
  "自建推理的 GPU 成本怎么估算？什么量级开始划算？",
  "混合路由怎么判断该用大模型还是小模型？"
 ],
 fa:["这是用商业 API 最容易被忽略的系统性风险，我的防线有四条。第一是版本钉死——绝不使用 latest 这类别名，必须显式指定版本快照串（日期版本或具体版本号），让升级变成一个我们主动选择的动作而不是供应商的单方面决定。第二是自动化回归监控——每天或每次部署时用固定的评测集对线上模型跑一遍，跟踪关键指标的时间序列，一旦出现台阶式变化立刻告警；这套监控比我们想象的更重要，因为静默升级往往伴随着供应商的灰度，我们可能是最后知道的。第三是金丝雀和影子——在把流量切到新版本之前，先在影子流量上用真实请求对比新旧两版的输出差异。第四是契约化测试——在你的提示词里包含一批「探针用例」，比如特定的格式要求、特定的边界行为，一旦模型变了它们会立刻失效。此外订阅供应商的变更日志并和对方建立沟通渠道，也很重要。最后兜底是：设计一个可以快速切换到备用模型（开源自建或另一家）的网关能力，这会让你在事故发生时有牌可打。","估算我分两步。第一步算单卡吞吐：根据模型参数量和量化方式估算显存占用（比如 7B 模型 fp16 大约 14GB 权重，加上 KV cache 和开销大体需要 24GB 以上；量化到 4bit 能把权重压到 4GB 左右），再按目标并发和上下文长度估算单卡能支撑的并发数，这个会随框架不同差异很大，通常一个 7B 模型在单张主流卡上面对几百 token 的输出，大约能支撑十几到几十并发。第二步算成本：GPU 小时单价乘以需要的卡数乘以运行时长，再加上闲置浪费（这里的关键是实现自动扩缩容和低峰降级，否则利用率可能只有 30%）。至于什么量级划算，我的经验参考是：日调用量达到几万次以上、并且请求模式比较稳定可预测（这样 GPU 利用率高），自建的成本优势开始显现；但在那之前，商业 API 的边际成本更低，因为你不用为闲置时间付费。还有一个重要的隐藏成本是人力——自建需要有人做推理优化、扩缩容、模型升级和值班，这部分往往被漏算。另外合规要求和数据不能出域的场景，成本就不再是主要考量了。","路由判断我通常从三个层面组合，而不是单一阈值。第一层是规则硬分流——某些场景是明确不需要大模型的（格式化、分类、简单的意图识别、内容 moderation），这些在路由表里就直接写明走小模型，这是最可靠的方式。第二层是难度预估——用一个小模型或者轻量分类器对每个请求做复杂度打分，可以考虑 query 长度、是否需要多步推理、是否涉及计算、是否引用了大量上下文等特征，超过阈值走大模型。第三层是级联验证——先让小模型答，同时让小的评分模型或者用自检法（让模型自评置信度）判断这份答案可不可信，不可信再升级到大模型重试；这种「小模型优先、大模型兜底」的级联在成本敏感场景收益很好，代价是部分请求的延迟上升。我会把路由决策做成可观测的：跟踪大小模型的占比、以及「被路由到小模型后来又升级」的比例，后者是优化路由规则的黄金信号。另一个原则是新场景上线时先走大模型建立质量基线，等有了数据再逐步下沉到小模型。"],
 pass:"能从效果和成本两个维度对比。",
 good:"能系统给出效果/成本/延迟/合规/可控性/团队六个维度，指出商业 API 静默升级的风险和自建的运维门槛，并提出混合路由 + 网关屏蔽差异的落地策略。",
 gl:"我习惯从六个维度系统评估，而不是只比效果和价格。第一是效果——不只看通用 benchmark，更要看我们自己评测集上的表现，尤其是那些决定产品体验的关键能力（指令遵循、长文理解、结构化输出稳定性）。第二是成本——商业 API 是按 token 计费，量小的时候极其划算且没有闲置成本；自建是固定成本，需要足够的量才能摊薄，而且有隐性的人力运维成本。第三是延迟和吞吐——自建可以完全控制调度策略、批处理、量化方案，也能做 prefix caching 这类深度优化，商业 API 只能被动接受。第四是合规与数据主权——这是很多场景的一票否决项，金融、医疗、政务的数据往往不能出境到第三方，这时只能选择私有部署。第五是可控性——商业 API 存在静默升级的风险，你的线上效果可能在某天悄悄变化，自建则完全可控但你要自己承担升级迭代。第六是团队能力——有没有人能做推理优化和 GPU 运维，这决定自建会不会变成一个持续的负担。基于这些，我通常推荐混合架构加屏蔽网关：在业务和模型之间建一层统一网关，提供兼容 OpenAI 风格的接口，把鉴权、限流、重试、降级、路由、可观测都收敛在这一层，业务代码只依赖抽象接口。网关背后是企业里多个模型的mix——高频简单请求路由到便宜的小模型，难任务走强模型，涉及敏感数据的走自建。这样既保留了商业 API 的弹性，又在某些场景获得了自建的成本和控制力，同时避免了供应商锁定。",
 red:"只说「开源省钱」或「商业 API 效果好」这种单维度结论；完全没考虑数据合规和模型版本漂移。"},

{cat:"LLM应用工程",sub:"训练与评测",diff:"高阶",type:"设计",tags:["评测体系","badcase回流"],
 q:"如何为你的 AI 应用设计评测体系？线上 badcase 如何回流成评测集？",
 intent:"把评测从「一次性动作」升级为「持续运转的体系」，这是资深工程师的标志。",
 ans:[
  "评测分层：① 离线评测集（golden set）——回归用，进 CI，防劣化；② 线上 A/B——验证真实增益；③ 线上监控指标——持续健康度。三层缺一不可，只做离线会脱离真实分布，只做线上则改动的代价太大。",
  "评测集设计原则：分布贴近真实（按真实 query 频次分层抽样，而不是均匀覆盖）；覆盖三类用例（正常/应拒答/对抗）；有明确的判定标准（能自动判就自动判，不能自动判就定好人工 rubric）；样本量足够（主指标要能检出 3%–5% 的差异，通常需要几百条）。",
  "判定方式选择：① 精确匹配/正则——适合分类、抽取、结构化输出；② 语义相似度——适合改写类，但容易放过实质错误；③ LLM-as-judge——灵活但需校准；④ 人工标注——金标准，成本高，用于校准和抽检。优先用确定性判据，判据越客观越好。",
  "badcase 回流闭环（核心）：① 采集——用户点踩、转人工、重复追问、负向反馈、以及基于规则的自动检测（如答案里有「我不知道」但分类为应回答、引用为空、响应时间异常）；② 归因——把 badcase 关联到 trace，定位是哪个环节（召回/重排/提示词/模型）；③ 入库——把 case 连同正确的期望输出（由专家补标注）加入评测集，打上来源标签；④ 验证——下次改动后这些 case 必须通过；⑤ 运营——定期（如每周）开 badcase 复盘会，归类统计找出系统性问题而不是一个个零散修。",
  "防过拟合：评测集要持续扩充（每季度补充新 case），并保留一份「不对外公开的 holdout 集」用于最终验收，防止团队为了指标好看而对着评测集刷分。",
  "指标看板：离线通过率趋势、线上点踩率、转人工率、任务完成率、单次成本、P95 延迟——这些要放在一起看，因为很容易出现「效果涨了但成本翻倍」的虚假优化。"
 ],
 follow:[
  "评测集跑分涨了但用户点踩也涨了，可能是什么原因？",
  "怎么防止团队对着评测集刷分？",
  "badcase 太多修不过来，你怎么排优先级？"
 ],
 fa:["有几种可能，按我发现它们的频率排。最常见的是「过拟合评测集」——团队反复对着评测集调提示词，模型学会了讨好这些特定用例，评测集的分布和用户真实请求的分布产生了偏离；这时评测分涨只是假象。第二种是「Goodhart 定律」式的指标失真——你优化的指标不是用户真正在意的：比如评测集认为「详细周全」是好的，给长答案打高分，但用户觉得啰嗦点踩；或者评测集没有覆盖某些高频场景，导致你在未覆盖的方向上退化了。第三种是「评测判据有问题」——用 LLM-as-judge 打分而裁判本身有长度偏好、格式偏好，你把答案改长就得分，用户却更烦。第四种是「线上引入了评测集之外的新变量」——流量结构变了、某个上游数据源坏了、UI 改了，这些评测集完全感知不到。我的应对是立刻做偏差分析：把高分低评价以及低分高评价的样本捞出来分组研究，看共性和哪一层的问题。核心原则我说清楚：永远以线上用户体验为准，评测集是用来逼近它的工具，两者冲突时改工具。","结构上我做三件事：一是「holdout 集」——切出一部分评测样本完全不开放给日常迭代，只在重大版本或定期评审时才跑，这是不被污染的标尺；日常开发只能用开发集。二是流程上的留痕——评测集的每次修改都要有变更记录和理由，禁止在调 prompt 的同一个 PR 里顺手改评测标准，否则等于自己给自己出题自己改分。三是监控背离度——同时看评测分曲线和线上指标曲线，两者长期背离本身就是最强的信号；我会把这个双曲线做成周会固定看的东西。文化上我认为更重要的是：明确告诉团队评测分是手段不是目的，鼓励大家去发现评测集的漏洞并把「发现漏洞」当成贡献。还有一个很有效的做法是定期轮换评测集的一部分样本——从线上新采的真实 case 替换掉旧样本，让模型无法长期记住它。最后补充：对「部分样本难判」的情况做打标不要只用一个裁判，多裁判投票加难度标记能减少被迎合的空间。","我用二维 prioritization，先看性价比而不是先看严重性。第一个维度是「影响面」——这类 bad case 在真实流量里的占比有多大，这个必须量化，方法是对线上日志做抽样或者聚类统计，不要凭印象；一个占比 15% 的问题远优先于占比 0.5% 的问题，哪怕后者看起来更蠢。第二个维度是「修复成本」——有的改一行提示词就能解决，有的要重建索引或者改架构；我会优先做高影响面低成本的，这些通常是数据缺口或者明显的提示词漏洞。第三个维度是「严重性」作为加权——涉及安全、合规、资金、误导用户的 bad case 会被提到最高优先级，无论占比多低。我的做法是每周固定做一次 bad case 归因会，把新出现的 case 聚类后归入根因分类，更新「根因分布图」，然后按上述排序决定下周做什么。还有两个很实用的经验：一是给每个修好的 case 都加入回归集防止退化；二是如果某类 case 修不动，说明是能力边界而非 bug，这时候应该考虑产品层面规避（比如不支持这类问题、转人工），而不是无限投入。"],
 pass:"知道要建评测集并定期跑。",
 good:"能给出离线/线上/监控三层体系、评测集的三类用例与分布原则、判据的优先级选择，以及采集→归因→入库→验证→复盘的完整 badcase 回流闭环，并有防过拟合设计。",
 gl:"我会把它设计成三层闭环。第一层是离线评测：固定的评测集加自动化的打分流程，跑在 CI 里作为合并门禁，这层负责「不能变差」。评测集的用例我要覆盖三类——标准可答的（占大头）、应拒答的（防止模型变得不敢不会）、以及多跳或边界难的（拉开候选方案的区分度），并且分布要贴近线上真实场景的分布而不是均匀分布。判据选择上，我会优先选客观可判定的（是否命中标准答案、JSON 是否合法、是否包含必需字段），主观部分才交给 LLM-as-judge，并且对裁判做一致性校准。第二层是线上指标：这是最终的真相来源。我会定义北极星指标（任务完成率、答案采纳率），加上代理指标（点赞点踩、追问率、修改率、拒答率、延迟、成本）和护栏指标（有害输出率、幻觉率、故障率）；代理指标的价值是反馈更快，护栏指标的价值是防止优化跑偏。第三层是监控与回流闭环：采集线上 bad case（点踩、用户纠正、异常重试），归因打标签，入库成为评测集的一部分，然后修复并在回归中验证有效，最后定期复盘根因分布决定投入方向。防过拟合的设计贯穿其中——保留 holdout 集、限制评测集修改频率、监控评测分与线上指标的背离度，并且永远在两者冲突时以线上体验为准去修正评测集。我还会强调一件事：这套体系最大的价值不在于给某个数字，而在于让团队每周都能知道「上周的改动到底让产品变好了还是变差了」。",
 red:"评测靠人工试几个例子；没有 badcase 回流机制，同样的问题反复出现；指标只有「感觉变好了」。"},
